// --- Modale : graphique agrandi d'une station meteo ---
// Ouverte par un clic sur la sparkline de l'etiquette, comme pour les ouvrages. Le trace
// passe par drawStationChart, la meme fonction que la sparkline : seules la taille et
// l'option 'axes' (graduations chiffrees) changent.
// Valeurs de la frame courante dans l'en-tete de la modale. Extraite pour que le
// rafraichissement par frame ne repasse pas par openModalStation.
function refreshModalStationStats() {
  if (modalStaChartIdx < 0) return;
  const st = D.meteo.stations[modalStaChartIdx];
  const fr = meteoStaFrame(frame, modalStaChartIdx);
  const mes = st.mes || {};
  const pC = (mes.p && fr && fr.p24 != null) ? fmt1(fr.p24) + ' mm/24h' : (mes.p ? '—' : 'N/D');
  const tC = (mes.t && fr && fr.tmn != null && fr.tmx != null)
    ? fmt1(fr.tmn) + ' / ' + fmt1(fr.tmx) + ' °C' : (mes.t ? '—' : 'N/D');
  modalStats.textContent = 'Pluie : ' + pC + '  ·  T° min/max : ' + tC;
}

function openModalStation(k) {
  modalStaChartIdx = k;
  modalIdx = -1; modalResIdx = -1; modalTurbIdx = -1; modalNivResIdx = -1;
  modalTable.innerHTML = '';
  const st = D.meteo.stations[k];
  modalTitle.textContent = (st.nom || st.code) + ' (' + st.code + ') — station météo';
  refreshModalStationStats();

  // La note dit ce que les valeurs SONT : une mesure ponctuelle, a distinguer des
  // moyennes de zone affichees sur les ouvrages.
  const zonesP = (st.p && st.p.length) ? st.p.join(', ') : null;
  modalNote.innerHTML =
    'Mesures brutes de cette station (identifiant Hydro-Qu&eacute;bec ' + st.id + '). ' +
    'Barres : pluie tomb&eacute;e pendant le pas de temps ; courbe bleue : cumul sur 24 h glissantes ' +
    '(&eacute;chelle de gauche, mm). Courbes rouges : temp&eacute;rature maximale (trait plein) et ' +
    'minimale (tirets), &eacute;chelle de droite en &deg;C.' +
    (zonesP ? ' Cette station alimente la pluie de : ' + zonesP + '.' : '') +
    ' Les valeurs affich&eacute;es sur les ouvrages sont, elles, une <b>moyenne</b> des stations de leur zone.';

  modal.classList.add('open');
  requestAnimationFrame(drawBigChartStation);
}

function drawBigChartStation() {
  if (modalStaChartIdx < 0) return;
  const s = serieStation(modalStaChartIdx);
  const w = modalCv.width  = modalCv.clientWidth;
  const h = modalCv.height = modalCv.clientHeight;
  const cx = modalCtx;
  cx.clearRect(0, 0, w, h);
  if (!s) return;
  // Marges : symetriques a gauche et a droite, les deux axes portant des graduations.
  const pad = { l: 56, r: 56, t: 30, b: 42 };
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  drawStationChart(cx, s, pad.l, pad.t, plotW, plotH, 1, { axes: true, fsAxis: 11 });

  // Etiquettes de temps sous l'axe : debut, milieu, fin de la fenetre.
  const n = s.vals.length;
  if (n > 1 && D.timestamps) {
    cx.font = '11px "Segoe UI",Arial,sans-serif';
    cx.fillStyle = 'rgba(90,90,100,.9)';
    cx.textBaseline = 'top';
    const marks = [0, Math.floor((n - 1) / 2), n - 1];
    for (const j of marks) {
      const ts = D.timestamps[j];
      if (!ts) continue;
      const x = pad.l + (j / (n - 1)) * plotW;
      cx.textAlign = (j === 0) ? 'left' : (j === n - 1 ? 'right' : 'center');
      cx.fillText(String(ts).substring(0, 10).replace(/\//g, '-'), x, pad.t + plotH + 6);
    }
    cx.textAlign = 'left';
  }

  // --- Legende visuelle, au meme format que celle des modales d'ouvrages ---
  // Cadre blanc semi-opaque, pastille de couleur puis libelle. Les pastilles reprennent
  // exactement les couleurs du trace (cf. drawStationChart) : une divergence ici rendrait
  // la legende trompeuse.
  const items = [];
  if (s.aPluie && Math.max(s.max, s.hMax || 0) > 0) {
    items.push({ col: 'rgba(150,175,205,.75)', txt: 'Pluie (mm)', kind: 'bar' });
    items.push({ col: 'rgba(70,110,160,.95)',  txt: 'Cumul 24 h glissantes (mm)', kind: 'line' });
  }
  if (s.aTemp) {
    items.push({ col: STA_TMAX_COL, txt: 'T° maximale (°C)', kind: 'line' });
    items.push({ col: STA_TMIN_COL, txt: 'T° minimale (°C)', kind: 'dash' });
  }
  if (!items.length) return;

  cx.font = '12px "Segoe UI",Arial';
  const swW = 22, swH = 7, pX = 8, pY = 6, gapY = 18;
  const bw = Math.max.apply(null, items.map(it => cx.measureText(it.txt).width)) + swW + 8 + 2 * pX;
  const bh = items.length * gapY + 2 * pY;
  // Coin haut gauche du trace, decale vers l'interieur : les deux axes chiffres occupent
  // les marges, et le debut de fenetre est la zone la moins chargee en donnees.
  const lx2 = pad.l + 10, ly2 = pad.t + 8;
  cx.fillStyle = 'rgba(255,255,255,.88)';
  cx.fillRect(lx2, ly2, bw, bh);
  cx.strokeStyle = '#dde'; cx.lineWidth = 1;
  cx.strokeRect(lx2, ly2, bw, bh);
  cx.textAlign = 'left'; cx.textBaseline = 'top';
  items.forEach((it, li) => {
    const yy = ly2 + pY + li * gapY;
    if (it.kind === 'bar') {
      cx.fillStyle = it.col;
      cx.fillRect(lx2 + pX, yy + 1, swW, swH + 2);
    } else {
      // Trait (plein ou tirete) plutot qu'un rectangle : la legende doit montrer la
      // FORME du trace, pas seulement sa couleur — c'est ce qui distingue min de max.
      cx.save();
      if (it.kind === 'dash') cx.setLineDash([3, 2]);
      cx.strokeStyle = it.col;
      cx.lineWidth = 2;
      cx.beginPath();
      cx.moveTo(lx2 + pX, yy + swH / 2 + 2);
      cx.lineTo(lx2 + pX + swW, yy + swH / 2 + 2);
      cx.stroke();
      cx.restore();
    }
    cx.fillStyle = '#333';
    cx.fillText(it.txt, lx2 + pX + swW + 8, yy);
  });
}

function drawBigChartNivRes() {
  if (modalNivResIdx < 0) return;
  const r = D.reservoirs[modalNivResIdx];
  const w = modalCv.width  = modalCv.clientWidth;
  const h = modalCv.height = modalCv.clientHeight;
  const cx = modalCtx;
  // b: 42 — cf. note sur les ticks sur 2 lignes dans drawBigChart().
  const pad = { l: 68, r: 20, t: 28, b: 42 };
  cx.clearRect(0, 0, w, h);

  const niveaux = r.niveauxEff;
  let yMin = Infinity, yMax = -Infinity;
  for (const v of niveaux) { if (v == null) continue; if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
  if (r.minNiv != null && r.minNiv < yMin) yMin = r.minNiv;
  if (r.maxNiv != null && r.maxNiv > yMax) yMax = r.maxNiv;
  if (!isFinite(yMin) || !isFinite(yMax)) { yMin = 0; yMax = 1; }
  const spread = Math.max(yMax - yMin, 0.5);
  const yBot = yMin - spread * 0.08;
  const yTop = yMax + spread * 0.08;

  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const xSpan = Math.max(N - 1, 1);
  const xOf = i => pad.l + (i / xSpan) * innerW;
  const yOf = v => pad.t + (1 - (v - yBot) / (yTop - yBot)) * innerH;

  // Bande futur
  const xFut = xOf(frame + 1);
  if (xFut < pad.l + innerW) {
    cx.fillStyle = 'rgba(150,150,160,.18)';
    cx.fillRect(xFut, pad.t, pad.l + innerW - xFut, innerH);
  }

  // Grille horizontale + labels Y
  cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
  cx.fillStyle = '#666'; cx.font = '11px "Segoe UI",Arial';
  cx.textAlign = 'right'; cx.textBaseline = 'middle';
  for (let g = 0; g <= 5; g++) {
    const y = pad.t + (g / 5) * innerH;
    cx.beginPath(); cx.moveTo(pad.l, y); cx.lineTo(pad.l + innerW, y); cx.stroke();
    const val = yTop - (g / 5) * (yTop - yBot);
    cx.fillText(val.toFixed(2) + ' m', pad.l - 6, y);
  }

  // Ticks X
  cx.fillStyle = '#666'; cx.textAlign = 'center'; cx.textBaseline = 'top';
  for (let g = 0; g <= 4; g++) {
    const i = Math.round((g / 4) * (N - 1));
    drawTickLabel(cx, D.timestamps[i], xOf(i), h - pad.b + 6, '11px "Segoe UI",Arial');
  }

  // Ligne MIN historique (rouge pointille)
  if (r.minNiv != null) {
    const yM = yOf(r.minNiv);
    cx.save();
    cx.strokeStyle = '#c0392b'; cx.lineWidth = 1.4;
    cx.setLineDash([6, 4]);
    cx.beginPath(); cx.moveTo(pad.l, yM); cx.lineTo(pad.l + innerW, yM); cx.stroke();
    cx.restore();
    cx.fillStyle = '#c0392b'; cx.font = 'bold 10px "Segoe UI",Arial';
    cx.textAlign = 'right'; cx.textBaseline = 'bottom';
    cx.fillText('min ' + r.minNiv.toFixed(2) + ' m', pad.l + innerW - 4, yM - 2);
  }

  // Ligne MAX historique (vert pointille)
  if (r.maxNiv != null) {
    const yM = yOf(r.maxNiv);
    cx.save();
    cx.strokeStyle = '#1a6e2a'; cx.lineWidth = 1.4;
    cx.setLineDash([6, 4]);
    cx.beginPath(); cx.moveTo(pad.l, yM); cx.lineTo(pad.l + innerW, yM); cx.stroke();
    cx.restore();
    cx.fillStyle = '#1a6e2a'; cx.font = 'bold 10px "Segoe UI",Arial';
    cx.textAlign = 'right'; cx.textBaseline = 'top';
    cx.fillText('max ' + r.maxNiv.toFixed(2) + ' m', pad.l + innerW - 4, yM + 2);
  }

  // Courbe niveau (bleu). Grandeur en METRES, distincte du deversement (m3/s) :
  // les deux ne coexistent jamais dans le meme graphe, donc le meme bleu ne prete
  // pas a confusion — il dit "eau" dans les deux cas, sans ambiguite de lecture.
  const blueStroke = SERIES.deverse.solid;
  cx.beginPath(); cx.strokeStyle = blueStroke; cx.lineWidth = 2.4;
  let started = false;
  for (let i = 0; i < N; i++) {
    const v = niveaux[i]; if (v == null) { started = false; continue; }
    const xx = xOf(i), yy = yOf(v);
    if (!started) { cx.moveTo(xx, yy); started = true; } else { cx.lineTo(xx, yy); }
  }
  cx.stroke();

  // Curseur + valeur courante
  const xCur = xOf(frame);
  cx.strokeStyle = 'rgba(200,40,40,.85)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(xCur, pad.t); cx.lineTo(xCur, pad.t + innerH); cx.stroke();
  const nCur = niveaux[frame];
  if (nCur != null) {
    cx.fillStyle = blueStroke;
    cx.beginPath(); cx.arc(xCur, yOf(nCur), 4, 0, 2 * Math.PI); cx.fill();
    cx.fillStyle = '#222'; cx.font = 'bold 12px "Segoe UI",Arial';
    const txt = nCur.toFixed(2) + ' m';
    const txtW = cx.measureText(txt).width;
    const fitsRight = (xCur + 6 + txtW) <= (pad.l + innerW - 2);
    cx.textAlign = fitsRight ? 'left' : 'right';
    cx.textBaseline = 'bottom';
    cx.fillText(txt, xCur + (fitsRight ? 6 : -6), yOf(nCur) - 4);
  }

}

  const r = modalCv.getBoundingClientRect();
  const xPix = (ev.clientX - r.left) * (modalCv.width / r.width);
  // La modale station a ses propres marges (deux axes chiffres, donc symetriques) :
  // reprendre l:60/r:20 y decalerait la frame ciblee de plusieurs pas.
  const pad = (modalStaChartIdx >= 0) ? { l: 56, r: 56 } : { l: 60, r: 20 };
  const innerW = modalCv.width - pad.l - pad.r;

});

// ---------------------------------------------------------------------------
// Barre de controle toujours visible sur telephone, meme zoome
// ---------------------------------------------------------------------------
// Probleme : sur iOS Safari, position:fixed est ancre au viewport de MISE EN
// PAGE, pas au viewport VISUEL. Quand on pince pour zoomer sur le schema, la
// barre reste collee au document agrandi et sort de l'ecran. env(safe-area-*)
// ne corrige pas ca : il ne traite que la bande du home indicator.
//
// Solution : on passe la barre en position:absolute et on la repositionne a
// chaque evenement de visualViewport (zoom, defilement, rotation). On la place
// au bas du viewport visuel, remontee d'une marge pour ne pas tomber dans la
// zone gestuelle du systeme, et on compense le zoom par un scale inverse pour
// qu'elle garde la meme taille apparente a l'ecran.
//
// N'est active QUE sur telephone (meme critere de taille que l'injection du
// meta viewport). Sur ordinateur, la barre reste en position:fixed classique.

// ---------------------------------------------------------------------------
// Reservation de la place occupee par la barre de controle
// ---------------------------------------------------------------------------
// #ctrl est en position:fixed, donc HORS FLUX : le contenu centre par
// justify-content ne "sait" pas qu'elle existe. La hauteur etait auparavant
// codee en dur (max-height:calc(100vh - 54px) sur #img), avec deux defauts :
//   - 54px ne correspondait pas a la hauteur reelle (48px sur une ligne, 56px
//     des que les controles reviennent a la ligne sur une fenetre etroite) ;
//   - surtout, cette contrainte ne s'appliquait QUE si l'image etait limitee par
//     la hauteur. En 16:9 elle l'est par la LARGEUR, donc la reserve tombait a
//     plat et le bas du schema — les sparklines de La Gabelle et Grand-Mere,
//     les plus basses — passait derriere la barre.
//
// On mesure donc la hauteur reelle et on la publie dans --ctrl-h, que le
// padding-bottom du body consomme. Le centrage vertical s'opere alors dans
// l'espace restant, quelle que soit l'orientation ou le nombre de lignes.
(function () {
  var ctrl = document.getElementById('ctrl');
  if (!ctrl) return;
  var last = -1;
  function sync() {
    // Barre HORS FLUX : elle est en position:absolute, mise a l'echelle inverse du
    // zoom, et flotte au-dessus du schema — elle ne reserve donc aucune place et ne
    // doit pas amputer la hauteur utile.
    //
    // Les DEUX classes mettent la barre dans cet etat (meme regle CSS :
    // position:absolute + bottom:auto). Ne tester que .vv-pinned etait le bug :
    // en mode application sur un poste de travail, c'est .vv-zoomfix qui s'active,
    // et --ctrl-h gardait alors la hauteur d'une barre qui ne reserve plus rien.
    // Le padding-bottom du body amputait donc la hauteur pour rien, #img retrecissait,
    // et le calque se retrouvait cale sur une geometrie qui n'existait plus
    // -> anneaux et etiquettes decales, barre qui remonte.
    // Seul .vv-pinned (telephone) sort reellement la barre du flux : elle y est
    // superposee au schema. .vv-zoomfix (bureau) ne fait que compenser l'echelle
    // du pinch — la barre reste posee au bas de l'ecran et continue donc de
    // reserver sa place. Mettre --ctrl-h a 0px dans ce cas retirait le
    // padding-bottom du body : la hauteur utile etait amputee pour une barre qui
    // reserve pourtant sa place, et le bas du schema passait sous la barre.
    var b = document.body.classList;
    if (b.contains('vv-pinned')) {
      if (last !== 0) {
        last = 0;
        document.documentElement.style.setProperty('--ctrl-h', '0px');
        schedResize();   // la hauteur utile vient de changer : recaler le calque
      }
      return;
    }
    var h = Math.round(ctrl.getBoundingClientRect().height);
    if (!h || h === last) return;   // inchangee : pas de reflow inutile
    last = h;
    document.documentElement.style.setProperty('--ctrl-h', h + 'px');
    // La hauteur disponible pour l'image vient de changer : le canvas doit se
    // recaler dessus, sinon le calque reste dimensionne sur l'ancienne geometrie.
    schedResize();
  }

  // resize() DOIT etre differe d'une frame. --ctrl-h alimente le padding-bottom du
  // body, donc la hauteur disponible pour #img ; mais la mise en page n'est pas
  // recalculee dans le meme tick. Appeler resize() immediatement lui faisait lire
  // l'offsetWidth d'AVANT le changement : le calque se dimensionnait sur l'ancienne
  // geometrie pendant que l'image prenait la nouvelle.
  var rafSync = 0;
  function schedResize() {
    if (rafSync) return;
    rafSync = requestAnimationFrame(function () {
      rafSync = 0;
      if (typeof resize === 'function') resize();
    });
  }
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', function () { setTimeout(sync, 250); });
  if (window.ResizeObserver) new ResizeObserver(sync).observe(ctrl);  // capte le flex-wrap
  // Expose : le bloc .vv-zoomfix doit resynchroniser --ctrl-h a l'instant precis ou
  // il ajoute ou retire la classe. Aucun evenement ne signale une mutation de
  // classList, et le ResizeObserver ci-dessus ne se declenche pas : passer la barre
  // en position:absolute ne change pas forcement sa hauteur. Sans cet appel,
  // --ctrl-h resterait perime jusqu'au prochain resize fortuit.
  window.__syncCtrlH = sync;
  sync();
})();

// ---------------------------------------------------------------------------
// Barre de controle a taille constante au pinch-zoom — version BUREAU
// ---------------------------------------------------------------------------
// Pendant du bloc telephone ci-dessous, pour le pinch au trackpad ou sur ecran
// tactile d'un poste de travail. position:fixed suit le viewport de MISE EN PAGE :
// au pinch, le compositeur agrandit donc la barre optiquement, et le selecteur de
// vue, les boutons et le slider grossissent alors que le schema, lui, reste cale.
//
// On applique la meme compensation (scale inverse + repositionnement sur le
// viewport visuel) mais via la classe .vv-zoomfix, qui ne change QUE l'echelle :
// contrairement a .vv-pinned, elle ne masque aucun controle.
//
// Sans zoom (scale = 1) la barre reprend exactement sa geometrie d'origine, donc
// le comportement bureau habituel est inchange.
(function () {
  var vv = window.visualViewport;
  if (!vv) return;

  // Garde INVERSE de celui du bloc telephone : les deux sont mutuellement exclusifs,
  // pour qu'une meme barre ne soit jamais pilotee deux fois.
  var dprD = window.devicePixelRatio || 1;
  var isPhone = ((screen.width || 9999) / dprD <= 900) && ((window.innerWidth || 9999) / dprD <= 1100);
  if (isPhone) return;

  var ctrl = document.getElementById('ctrl');
  if (!ctrl) return;

  var raf = 0, applied = false;
  function place() {
    raf = 0;
    var scale = vv.scale || 1;
    // Pas de zoom : on rend la main a position:fixed (CSS d'origine, aucun surcout).
    if (Math.abs(scale - 1) < 0.01) {
      if (applied) {
        applied = false;
        document.body.classList.remove('vv-zoomfix');
        ctrl.style.transform = ctrl.style.width = ctrl.style.left = ctrl.style.top = '';
        // La barre revient DANS le flux : --ctrl-h doit reprendre sa hauteur reelle,
        // sinon le bas du schema repasse derriere elle.
        if (window.__syncCtrlH) window.__syncCtrlH();
      }
      return;
    }
    if (!applied) {
      applied = true;
      document.body.classList.add('vv-zoomfix');
      // Pas de __syncCtrlH() ici : contrairement a .vv-pinned, la barre continue
      // de reserver sa place au bas de l'ecran (voir le garde dans sync()).
      // Forcer --ctrl-h a 0 amputait la hauteur utile pour rien et faisait passer
      // le bas du schema sous la barre.
    }
    // Largeur : on garde le calage sur le schema (--wrap-w) plutot que sur le
    // viewport, pour que la barre ne deborde pas dans les bandes de fond pendant
    // un pinch comme hors zoom. Exprimee avant le scale inverse (donc x scale)
    // pour qu'apres mise a l'echelle elle retombe sur la largeur visee. Repli sur
    // le viewport visuel si --wrap-w n'a pas encore ete mesuree.
    var wrapW = parseFloat(
      getComputedStyle(document.documentElement).getPropertyValue('--wrap-w')
    ) || vv.width;
    ctrl.style.width = (Math.min(wrapW, vv.width) * scale) + 'px';
    ctrl.style.transform = 'scale(' + (1 / scale) + ')';
    // margin-inline:auto ne centre plus rien ici (position:absolute + left
    // explicite), donc le centrage est calcule : la barre etant plus etroite que
    // le viewport depuis le calage sur --wrap-w, la laisser a offsetLeft la
    // collait au bord gauche. La demi-marge est en px ecran, donc non divisee par
    // scale (le transform s'applique apres, origine bas-gauche).
    var barW = Math.min(wrapW, vv.width);
    ctrl.style.left = (vv.offsetLeft + (vv.width - barW) / 2) + 'px';
    // offsetHeight lu APRES avoir pose largeur et transform : la largeur decide
    // du nombre de lignes (flex-wrap), donc de la hauteur. Le lire avant donnait
    // la hauteur de la mise en page precedente et posait la barre trop haut.
    var hCss = ctrl.offsetHeight;
    // transform-origin en bas a gauche : le HAUT doit etre pose de facon que le
    // BAS tombe au bord inferieur du viewport visuel apres mise a l'echelle.
    ctrl.style.top = (vv.offsetTop + vv.height - hCss / scale) + 'px';
  }
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(place);
  }
  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
  window.addEventListener('resize', schedule);
  schedule();
})();

(function () {
  var vv = window.visualViewport;
  if (!vv) return;  // navigateur sans visualViewport : on garde position:fixed

  // Meme critere que le meta viewport : deux mesures basses exigees, car
  // screen.width peut etre une valeur fictive figee selon l'environnement.
  var dpr3 = window.devicePixelRatio || 1;
  if ((screen.width || 9999) / dpr3 > 900) return;
  if ((window.innerWidth || 9999) / dpr3 > 1100) return;

  var ctrl = document.getElementById('ctrl');
  if (!ctrl) return;
  document.body.classList.add('vv-pinned');
  // La barre passe hors flux : --ctrl-h doit tomber a 0. sync() a deja tourne une
  // premiere fois (avec la barre encore dans le flux) et aurait laisse une reserve.
  if (window.__syncCtrlH) window.__syncCtrlH();

  // Libelles raccourcis : sur une seule ligne, "Debut" et "Maintenant" font
  // deborder la barre. On ne garde que le pictogramme ; le titre reste comme
  // infobulle et pour l'accessibilite.
  (function () {
    var pairs = [['btnStart', '⏮'], ['btnEnd', '⏭']];
    for (var i = 0; i < pairs.length; i++) {
      var b = document.getElementById(pairs[i][0]);
      if (b) { b.setAttribute('aria-label', b.textContent.trim()); b.textContent = pairs[i][1]; }
    }
  })();

  // Marge au-dessus du bord bas du viewport visuel, en pixels ECRAN. Couvre la
  // zone ou iOS capte les swipes (home indicator ~34 px) avec un peu d'air.
  var GAP_SCREEN_PX = 20;

  var raf = 0;
  function place() {
    raf = 0;
    var scale = vv.scale || 1;
    // Coordonnees du viewport visuel, exprimees en pixels CSS du document.
    var visW = vv.width;
    var visH = vv.height;
    var left = vv.offsetLeft;
    var top  = vv.offsetTop;
    // La barre est mise a l'echelle inverse du zoom : sa hauteur reelle en
    // pixels CSS vaut donc h/scale. On la pose a GAP_SCREEN_PX du bas de
    // l'ecran, converti en pixels CSS (division par scale).
    var gapCss = GAP_SCREEN_PX / scale;
    var hCss = ctrl.offsetHeight;
    ctrl.style.width = (visW * scale) + 'px';           // largeur ecran, avant scale inverse
    ctrl.style.transform = 'scale(' + (1 / scale) + ')';
    ctrl.style.left = left + 'px';
    // transform-origin est en bas a gauche : le haut de l'element doit donc etre
    // positionne de facon que son BAS tombe au bon endroit apres mise a l'echelle.
    ctrl.style.top = (top + visH - gapCss - hCss) + 'px';
  }
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(place);
  }

  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
  window.addEventListener('orientationchange', function () { setTimeout(schedule, 250); });
  window.addEventListener('resize', schedule);
  // Le contenu de la barre change de hauteur quand les elements passent a la
  // ligne (flex-wrap) : on replace aussi apres coup.
  if (window.ResizeObserver) { new ResizeObserver(schedule).observe(ctrl); }
  schedule();
})();

// Enregistrement du service worker (PWA installable). Silencieux si non supporte
// ou en file:// : ne doit jamais bloquer l'affichage.
// EN DEVELOPPEMENT LOCAL (localhost/127.0.0.1) : on n'enregistre PAS le SW et on
// desenregistre tout SW existant + on purge ses caches, pour que chaque regeneration
// soit visible immediatement (pas de version cachee servie par le SW). En production
// (GitHub Pages), comportement PWA normal.
(function () {
  if (!('serviceWorker' in navigator)) return;
  var host = location.hostname;
  var isLocal = (host === 'localhost' || host === '127.0.0.1' || host === '[::1]');
  if (isLocal) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    }
    return;
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    window.location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { /* ignore */ });
  });
})();
