// (couleur, echelle, ordre de superposition) devrait etre reporte deux fois et les deux
// vues divergeraient.
//
// Grammaire, reprise de celle des ouvrages :
//   barres bleu pale  = pluie du pas de temps (p1) — quand il a plu
//   courbe bleue      = cumul 24 h glissant (p24) — echelle de GAUCHE, en mm
//   courbes orangees  = temperatures min et max   — echelle de DROITE, en °C
//   bande grise       = futur (au-dela de la frame courante)
//   trait rouge       = frame courante
// opts.axes : dessine les graduations chiffrees et les titres d'axes (modale seulement ;
// dans une sparkline de 42 px ils seraient illisibles).
function drawStationChart(cx2, s, x, y, w, h, sxu, opts) {
  opts = opts || {};
  const n = s.vals.length;
  if (!(w > 10 && h > 6 && n > 1)) return;
  const fsAx = opts.fsAxis || Math.max(7, Math.round(8 * sxu));
  const xOf = j => x + (j / (n - 1)) * w;

  // Echelle pluie (gauche) : de 0 au max de la fenetre.
  const pTop = Math.max(s.max, s.hMax || 0);
  const yP = v => y + h - (pTop > 0 ? (v / pTop) * h : 0);
  // Echelle temperature (droite) : bornes de la fenetre, elargies de 1 °C pour que les
  // extremes ne collent pas aux bords.
  let tLo = s.tMin, tHi = s.tMax;
  if (s.aTemp && tHi - tLo < 1) { tLo -= 1; tHi += 1; }   // serie plate : evite /0
  const yT = v => y + h - ((v - tLo) / Math.max(tHi - tLo, 0.0001)) * h;

  // Bande "futur".
  const xFut = xOf(Math.min(frame + 1, n - 1));
  if (xFut < x + w) {
    cx2.fillStyle = 'rgba(150,150,160,.12)';
    cx2.fillRect(xFut, y, x + w - xFut, h);
  }

  // Axes.
  cx2.strokeStyle = 'rgba(80,80,90,.6)';
  cx2.lineWidth = Math.max(0.8, 0.8 * sxu);
  cx2.beginPath();
  cx2.moveTo(x, y); cx2.lineTo(x, y + h); cx2.lineTo(x + w, y + h);
  cx2.stroke();

  // Barres de pluie horaire.
  if (s.hVals && pTop > 0) {
    cx2.fillStyle = 'rgba(150,175,205,.75)';
    const bw = Math.max(1, (w / n) * 0.8);
    for (let j = 0; j < n; j++) {
      const v = s.hVals[j];
      if (v == null || v <= 0) continue;
      const hh = (v / pTop) * h;
      cx2.fillRect(xOf(j) - bw / 2, y + h - hh, bw, hh);
    }
  }

  // Courbe de cumul 24 h.
  const trace = (arr, color, lw, dash) => {
    cx2.save();
    if (dash) cx2.setLineDash(dash);
    cx2.strokeStyle = color;
    cx2.lineWidth = Math.max(1, lw * sxu);
    cx2.beginPath();
    let started = false;
    for (let j = 0; j < n; j++) {
      const v = arr.vals[j];
      if (v == null) { started = false; continue; }
      const px = xOf(j), py = arr.y(v);
      if (!started) { cx2.moveTo(px, py); started = true; } else { cx2.lineTo(px, py); }
    }
    cx2.stroke();
    cx2.restore();
  };
  if (s.aPluie && pTop > 0) trace({ vals: s.vals, y: yP }, STA_AXIS_COL, 1.4);
  if (s.aTemp) {
    // Rouge : convention du thermometre. Le maximum en trait plein, le minimum dans la
    // meme teinte atténuée et tiretee — la forme distingue les deux, pas la couleur.
    trace({ vals: s.tmx, y: yT }, STA_TMAX_COL, 1.2);
    trace({ vals: s.tmn, y: yT }, STA_TMIN_COL, 1.2, [3 * sxu, 2 * sxu]);
  }

  // Repere de la frame courante. GRIS neutre et non rouge : depuis que les courbes de
  // temperature sont rouges, un repere rouge se lirait comme une donnee.
  const xCur = xOf(Math.min(frame, n - 1));
  cx2.strokeStyle = 'rgba(90,90,100,.55)';
  cx2.lineWidth = Math.max(1, 1 * sxu);
  cx2.beginPath();
  cx2.moveTo(xCur, y); cx2.lineTo(xCur, y + h);
  cx2.stroke();

  // Reperes d'echelle.
  cx2.font = fsAx + 'px "Segoe UI",Arial,sans-serif';
  cx2.textBaseline = 'top';
  if (opts.axes) {
    // Modale : graduations chiffrees des deux cotes.
    // Les DEUX axes dans la meme couleur (STA_AXIS_COL) : ils forment un seul cadre de
    // lecture. Une couleur differente par axe suggererait que la teinte code la grandeur,
    // ce que font deja les courbes elles-memes.
    cx2.fillStyle = STA_AXIS_COL;
    cx2.textAlign = 'right';
    if (s.aPluie && pTop > 0) {
      for (const f of [0, 0.5, 1]) {
        const v = pTop * f;
        cx2.fillText(fmt1(v), x - 4 * sxu, yP(v) - fsAx / 2);
      }
      cx2.fillText('mm', x - 4 * sxu, y - fsAx * 1.6);
    }
    cx2.textAlign = 'left';
    if (s.aTemp) {
      for (const f of [0, 0.5, 1]) {
        const v = tLo + (tHi - tLo) * f;
        cx2.fillText(fmt1(v), x + w + 4 * sxu, yT(v) - fsAx / 2);
      }
      cx2.fillText('°C', x + w + 4 * sxu, y - fsAx * 1.6);
    }
  } else {
    // Sparkline : un seul repere par grandeur, en haut, sans graduation. Meme couleur
    // d'axe des deux cotes, comme dans la modale.
    cx2.fillStyle = STA_AXIS_COL;
    if (s.aPluie && pTop > 0) {
      cx2.textAlign = 'left';
      cx2.fillText(fmt1(pTop) + ' mm', x + 2 * sxu, y);
    }
    if (s.aTemp) {
      cx2.textAlign = 'right';
      cx2.fillText(fmt1(tHi) + '°', x + w - 2 * sxu, y);
    }
  }
  cx2.textAlign = 'left';
}

function ratioColor(r) {
  // Couleur basee sur (current - min) / (max - min) en %
  //
  // Seuils cales sur le suivi de crue (et non en quartiles egaux) : un debit a
  // 75 % du range historique est courant, pas alarmant. Le rouge est reserve au
  // top 15 % du range, le vert couvre l'exploitation courante (< 40 %).
  if (r === null || r === undefined) return {f:'rgba(120,120,120,.88)',s:'#555'};
  if (r < 40) return {f:'rgba(46,160,67,.92)',  s:'#1a6e2a'};   // vert
  if (r < 65) return {f:'rgba(210,170,0,.92)',  s:'#7a6200'};   // jaune
  if (r < 85) return {f:'rgba(230,110,0,.92)',  s:'#7a3a00'};   // orange
  return            {f:'rgba(200,30,30,.92)',   s:'#6a0000'};   // rouge
}

function drawLeftSegments(ctx, segments, x, y, defaultFont) {
  // segments = [{text, color, font?} | {icon: name, size: px} | {gap: px}, ...]
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  let curX = x;
  for (const s of segments) {
    if (s.gap !== undefined) {
      curX += s.gap;
    } else if (s.icon) {
      const im = iconImgs[s.icon];
      const sz = Math.round(s.size);
      if (im && im.complete && im.naturalWidth > 0) {
        ctx.drawImage(im, curX, y - sz/2, sz, sz);
      }
      curX += sz + Math.round(2 * (s.size / 14));  // espacement proportionnel a la taille
    } else {
      ctx.font = s.font || defaultFont;
      ctx.fillStyle = s.color;
      ctx.fillText(s.text, curX, y);
      curX += ctx.measureText(s.text).width;
    }
  }
  return curX;
}

function fmt2(v) {
  // Formate un nombre avec 2 decimales et virgule (locale fr)
  return v.toFixed(2).replace('.', ',');
}

// Formate a 1 decimale, virgule decimale (public francophone, comme fmt2).
function fmt1(v) {
  return (v == null) ? null : v.toFixed(1).replace('.', ',');
}

// --- Stations meteo : icone + sigle + pluie 24 h + triangle -------------------
// Fonction separee de drawZonesMeteo pour la lisibilite, mais soumise a la MEME
// condition : les stations font partie du calque « Zones meteo » et n'apparaissent que
// s'il est coche. C'est le comportement d'origine, voulu — le calque est une aide de
// lecture ponctuelle, qu'on active quand on s'interesse a la meteo.
//
// Ordre de peinture : APRES les remplissages de zone (sinon une zone voile les icones)
// mais AVANT les etiquettes d'ouvrages, qui doivent passer devant.
const STA_TRI      = '▼';   // etiquette repliee : le clic la deplie
const STA_TRI_OPEN = '▲';   // etiquette depliee : le clic la replie

// Remontee de l'icone de station, en pixels IMAGE. Deux raisons cumulees :
//  - le bloc texte sous l'icone porte deux lignes (nom, puis pluie + triangle) ;
//  - il faut degager la hauteur de l'ANNEAU d'alerte, dont le rayon depasse l'icone de
//    ~48 % de sa demi-largeur (cf. STA_RING_K).
// Sans ce decalage l'ensemble descend sous la position geographique reelle de la station.
// Pendant de BARR_DY pour les barrages de reservoir.
const STA_ICON_DY = -16;

// Seuils d'alerte de la pluie 24 h, en mm. ABSOLUS (cf. commentaire dans
// drawStationsMeteo) : 20 mm ~ p95 des stations du bassin, 40 mm ~ p99.
const STA_PLUIE_ELEVEE = 20;   // anneau orange
const STA_PLUIE_FORTE  = 40;   // anneau rouge

// Rayon de l'anneau d'alerte, en fraction de la TAILLE de l'icone : demi-diagonale du
// carre (√2/2) majoree de 5 %, comme l'anneau des barrages de reservoir. Ce sont les
// COINS de l'icone qui sont les points les plus eloignes du centre, d'ou la diagonale et
// non la demi-largeur.
// Constante partagee par le TRACE de l'anneau et par le calcul de la place a lui laisser
// au-dessus du nom : les deux doivent bouger ensemble, sinon le texte remord l'anneau.
const STA_RING_K = Math.SQRT2 / 2 * 1.05;   // ~0,742

// File d'attente des etiquettes de station a dessiner AU PREMIER PLAN.
//
// Les marqueurs de station (icone + nom + pluie + triangle) appartiennent au calque de
// FOND : ils doivent rester sous les etiquettes d'ouvrages, comme les contours de zone.
// Mais une etiquette de station DEPLIEE est un objet ouvert a la demande : elle doit
// passer DEVANT tout le reste, sinon les icones et les valeurs des ouvrages se peignent
// par-dessus son cartouche et le rendent illisible.
//
// On collecte donc les etiquettes pendant la passe de fond et on les rend dans une
// seconde passe, appelee en fin de draw(). Un simple deplacement de l'appel ne suffirait
// pas : il ferait aussi passer les 11 marqueurs devant les ouvrages.
let staLabelQueue = [];

function drawStationsMeteo(sx, sy) {
  staBounds.length = 0;
  staLabelBounds.length = 0;
  staSparkBounds.length = 0;
  staLabelQueue = [];
  if (!zonesVisibles) return;
  if (!D.meteo || !D.meteo.stations || !D.meteo.stations.length) return;

  const staIm = iconImgs['station-meteo'];
  // MEME taille que l'icone barrage des reservoirs, pour que les deux familles de
  // marqueurs pesent pareil dans l'image.
  const staSz = Math.max(18, Math.round(30 * sx));
  const fsSta = Math.max(8, Math.round(10.5 * sx));
  // Ligne de mesure : legerement plus petite que le sigle et NON gras. Le contraste
  // gras/normal distingue l'identite de la mesure, comme les libelles de zone
  // distinguent le nom (gras) de la superficie (normal).
  const fsVal = Math.max(8, Math.round(fsSta * 0.92));

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round';               // sans ca, les angles du lisere bavent

  D.meteo.stations.forEach((st, k) => {
    // Icone remontee de STA_ICON_DY px image : le bloc texte sous elle a gagne une
    // ligne (nom + pluie + triangle), et sans ce decalage l'ensemble descendait sous la
    // position geographique de la station. Meme principe que BARR_DY pour les barrages
    // de reservoir, dont l'icone est calee au-dessus de son texte d'ancrage.
    const sx0 = st.x * sx, sy0 = st.y * sy + STA_ICON_DY * sy;

    // Valeur de pluie de la frame courante : sert a l'anneau d'alerte ci-dessous ET a
    // la ligne de texte plus bas. Lue une seule fois.
    const fr  = meteoStaFrame(frame, k);
    const mes = st.mes || { t: false, n: false, p: false };
    const p24 = (mes.p && fr && fr.p24 != null) ? fr.p24 : null;

    // Anneau d'alerte quand la pluie est ELEVEE ou FORTE, exactement comme l'anneau des
    // barrages de reservoir : meme epaisseur (4 * sx), meme rayon (demi-diagonale de
    // l'icone x 1,05, car ce sont les COINS de l'icone carree qui sont les plus eloignes
    // du centre), memes couleurs que ratioColor().
    //
    // Seuils ABSOLUS en mm/24h, et non un ratio du max de la station comme pour les
    // deversements. Deux raisons :
    //  - la distribution de la pluie est tres asymetrique (mediane ~0, p90 de 10-18 mm,
    //    maxima de 48 a 95 mm selon la station) : un ratio ferait de 31 mm une alerte a
    //    CMMW et pas a CMIM, alors que c'est la meme pluie ;
    //  - le max depend de la fenetre affichee, donc le seuil bougerait entre les vues
    //    Heure / Jour / Semaine / Mois.
    // 20 mm ~ p95 (episode notable), 40 mm ~ p99 (episode marquant).
    let staTint = null;
    if (p24 !== null) {
      if (p24 >= STA_PLUIE_FORTE)      staTint = ratioColor(95).f;   // rouge
      else if (p24 >= STA_PLUIE_ELEVEE) staTint = ratioColor(75).f;   // orange
    }
    if (staTint) {
      const ringR = staSz * STA_RING_K;
      ctx.save();
      ctx.beginPath();
      ctx.arc(sx0, sy0, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = staTint;
      ctx.lineWidth = Math.max(2.5, 4 * sx);
      ctx.stroke();
      ctx.restore();
    }

    // L'icone garde ses couleurs d'origine : c'est l'anneau qui porte l'alerte, comme
    // pour les barrages et les rosaces de centrale. La teinter en plus serait redondant.
    if (staIm && staIm.complete && staIm.naturalWidth) {
      ctx.drawImage(staIm, sx0 - staSz / 2, sy0 - staSz / 2, staSz, staSz);
    }

    // Sigle HQ sous l'icone. SANS cartouche : le rectangle blanc dessinait une
    // delimitation visible qui alourdissait l'image (11 stations + 12 centrales +
    // reservoirs). La lisibilite par-dessus le profil vient d'un lisere blanc autour
    // des lettres (strokeText avant fillText).
    //
    // labelDx/labelDy (px image, optionnels dans config/layout, champ stationsMeteo) :
    // decalent le BLOC TEXTE sans bouger l'icone, qui doit rester sur la position
    // geographique projetee. Sert a degager une etiquette d'ouvrage voisine — CMIX
    // tombe par exemple sous celle de Manouane-A. Reglage par station dans le layout
    // plutot qu'en dur ici : c'est deja la convention pour iconDx/iconDy des reservoirs.
    // tx0 : abscisse du BLOC TEXTE, distincte de sx0 (l'icone), qui reste sur la
    // position geographique projetee.
    const tx0 = sx0 + (st.labelDx || 0) * sx;
    // Le texte doit commencer sous l'ANNEAU, pas sous l'icone. L'anneau a pour rayon la
    // demi-DIAGONALE de l'icone carree (x 1,05), soit ~1,48 x sa demi-largeur : partir de
    // staSz / 2 laissait le lisere blanc du nom mordre l'anneau par le bas, qui
    // apparaissait alors incomplet. On derive la marge du rayon reel (STA_RING_K, la meme
    // constante que le trace) pour que les deux restent lies, et on ajoute la demi-
    // epaisseur du trait.
    const ringClear = staSz * STA_RING_K + Math.max(2.5, 4 * sx) / 2;
    const ty0 = sy0 + (st.labelDy || 0) * sy + ringClear + 2 * sy;
    // NOM en clair plutot que le sigle : « Windigo » se lit sans decodage, la ou CMRW
    // demande de connaitre la nomenclature HQ. Le sigle reste dans l'en-tete de
    // l'etiquette depliee, sous la forme « Windigo (CMRW) ».
    const nomSta = st.nom || st.code;
    ctx.font = 'bold ' + fsSta + 'px "Segoe UI",Arial,sans-serif';
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = Math.max(2, 3 * sx);
    ctx.strokeText(nomSta, tx0, ty0);
    ctx.fillStyle = '#000000';
    ctx.fillText(nomSta, tx0, ty0);

    // --- Ligne sous la station : PLUIE 24 h uniquement ---
    // Une seule grandeur, la meme que celle affichee sur les ouvrages (mm/24h) : le
    // lecteur compare ainsi directement la station a l'ouvrage qu'elle alimente. La
    // temperature vit dans l'etiquette depliable, pas ici.
    //
    // 'mes' dit ce que la station MESURE (cf. render-animation.ps1), ce qui distingue
    // « pas de capteur » (-> N/D permanent) d'une valeur ponctuellement absente
    // (-> rien). Les 4 stations sans pluviometre affichent donc N/D, ce qui garde une
    // presentation uniforme sur les 11 marqueurs.
    // fr / mes / p24 sont lus plus haut (l'anneau d'alerte en a besoin avant l'icone).
    const valTxt = mes.p
      ? ((p24 !== null) ? fmt1(p24) + ' mm/24h' : null)
      : 'N/D';

    const tyVal = ty0 + fsSta + 2 * sy;
    let triX = tx0, triY = tyVal;
    if (valTxt) {
      // GRAS : c'est la seule mesure affichee en permanence sous la station, elle doit
      // primer sur le nom. La police est posee ICI, avant measureText, car la largeur du
      // gras differe de celle du normal : la mesurer autrement decalerait le centrage et
      // la position du triangle.
      ctx.font = 'bold ' + fsVal + 'px "Segoe UI",Arial,sans-serif';
      // Le triangle est pose a DROITE du texte : on decale donc l'ensemble vers la
      // gauche de la demi-largeur du triangle pour que le bloc reste centre sur la
      // station (sinon il derive a droite et chevauche le voisin).
      const wVal = ctx.measureText(valTxt).width;
      const wTri = ctx.measureText(STA_TRI + ' ').width;
      const cx   = tx0 - wTri / 2;
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      // Lisere legerement plus epais que pour le texte normal : un gras pose sur le
      // trace du profil demande un peu plus de degagement pour rester detache.
      ctx.lineWidth = Math.max(2, 3 * sx);
      ctx.strokeText(valTxt, cx, tyVal);
      // Gris tres soutenu : en gras, le poids suffit a faire primer la mesure sur le nom,
      // sans avoir besoin d'un noir franc qui alourdirait 11 marqueurs.
      ctx.fillStyle = '#222222';
      ctx.fillText(valTxt, cx, tyVal);
      triX = cx + wVal / 2 + wTri / 2;
    }

    // --- Triangle : deplie / replie l'etiquette ---
    // Affiche pour TOUTES les stations, y compris celles sans pluviometre : la
    // coherence de presentation prime, et elles ont de toute facon une temperature a
    // montrer dans l'etiquette. Inerte seulement si la station ne mesure rien du tout.
    const actif = !!(mes.t || mes.p || mes.n);
    const ouvert = actif && staOuvertes.has(k);
    const glyph = ouvert ? STA_TRI_OPEN : STA_TRI;
    ctx.font = 'bold ' + fsVal + 'px "Segoe UI",Arial,sans-serif';
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = Math.max(2, 2.5 * sx);
    ctx.strokeText(glyph, triX, triY);
    ctx.fillStyle = actif ? 'rgba(40,70,110,.95)' : 'rgba(150,150,150,.75)';
    ctx.fillText(glyph, triX, triY);

    // Boite cliquable, enregistree PENDANT le dessin et en pixels IMAGE (division par
    // sx/sy). La recalculer dans le hitTest dupliquerait la geometrie : c'est
    // exactement ce qui a produit des zones cliquables decalees ailleurs dans ce
    // fichier. Ici la boite suit le dessin par construction.
    const wTri2 = ctx.measureText(glyph).width;
    staBounds[k] = actif ? {
      x0: (triX - wTri2 / 2 - 3 * sx) / sx,
      y0: (triY - 2 * sy) / sy,
      x1: (triX + wTri2 / 2 + 3 * sx) / sx,
      y1: (triY + fsVal + 2 * sy) / sy
    } : null;

    // --- Etiquette depliee : mise en file pour la passe de PREMIER PLAN ---
    // Ne pas la dessiner ici : elle serait recouverte par les etiquettes d'ouvrages,
    // dessinees plus loin dans draw(). Cf. staLabelQueue.
    if (ouvert) {
      staLabelQueue.push({ st: st, k: k, fr: fr, mes: mes,
                          cx: tx0, topY: triY + fsVal + 3 * sy, fsBase: fsVal });
    }
  });
  ctx.restore();
}

// Seconde passe : les etiquettes de station, PAR-DESSUS tout le reste (ouvrages, legende).
// Appelee en fin de draw().
function drawStationLabelsTop(sx, sy) {
  for (const q of staLabelQueue) {
    drawStationLabel(q.st, q.k, q.fr, q.mes, q.cx, q.topY, sx, sy, q.fsBase);
  }
}

// Etiquette d'une station depliee, au MEME style que celles des ouvrages :
// cartouche blanc borde, en-tete « icone + Nom (CODE) » avec le triangle de fermeture,
// separateur, lignes de mesures, puis sparkline de pluie en bas.
//
// Structure calquee sur l'etiquette de reservoir (fond + bordure rgba(80,80,80,.6),
// en-tete a 10 % de la hauteur, separateur a 22 %, sparkline dans le bas) pour que le
// lecteur reconnaisse immediatement le meme objet. Difference assumee : la geometrie est
// CALCULEE ici (largeur sur le texte le plus long, hauteur sur le nombre de lignes) au
// lieu d'etre lue dans label_width_res/label_height_res — une station porte 2 lignes,
// pas 4, et 11 cartouches au gabarit des reservoirs couvriraient le profil.
function drawStationLabel(st, k, fr, mes, cx, topY, sx, sy, fsBase) {
  // Metriques REPRISES TELLES QUELLES des etiquettes de centrales et de reservoirs
  // (cf. lignes fsName/fsTotal/fsIcon/fsDetail/fsArrow de leurs blocs respectifs) :
  // une station doit avoir le meme poids typographique qu'un ouvrage, sinon elle se lit
  // comme un objet de second rang. Les planchers (11, 12, 10, 18) sont ceux des ouvrages.
  const fsName = Math.max(11, Math.round(17 * sx));   // nom, en gras
  const fs     = Math.max(10, Math.round(16 * sx));   // lignes de valeurs (= fsDetail)
  const iconSz = Math.max(12, Math.round(30 * sx));   // icone de ligne (= fsIcon)
  const fsArw  = Math.max(18, Math.round(28 * sx));   // triangle (= fsArrow)
  const iconHd = Math.max(12, Math.round(fsName * 1.40));  // icone d'en-tete, comme les ouvrages
  // Gouttieres : 8 px a gauche comme les ouvrages (leftX = lx + 8 * sx).
  const padX   = Math.max(6, 8 * sx);
  const padY   = Math.max(5, 7 * sy);
  // Pas vertical : celui des reservoirs, dont les lignes sont espacees de ~0,150 x 228
  // = 34 px image. On reprend cette valeur a l'echelle, avec pour plancher la hauteur de
  // l'icone (30 px) plus 2 px, sinon deux lignes voisines se chevaucheraient.
  const lh     = Math.max(iconSz + 2 * sy, Math.round(34 * sy));

  const pTxt = mes.p
    ? ((fr && fr.p24 != null) ? fmt1(fr.p24) + ' mm/24h' : 'n/d')
    : 'N/D';
  const tTxt = mes.t
    ? ((fr && fr.tmn != null && fr.tmx != null) ? fmt1(fr.tmn) + ' / ' + fmt1(fr.tmx) + ' °C' : 'n/d')
    : 'N/D';

  // En-tete : nom en clair suivi du sigle HQ entre parentheses.
  const titre = (st.nom || st.code) + ' (' + st.code + ')';
  // Chaque ligne porte son icone, comme sur les etiquettes d'ouvrages ou aucune valeur
  // n'apparait sans pictogramme.
  const rows = [
    { icon: 'pluie',       txt: pTxt },
    { icon: 'temperature', txt: tTxt }
  ];

  // Sparkline : pluie ET temperature. Presente des qu'une des deux grandeurs existe sur
  // la fenetre — une station sans pluviometre garde donc un graphe de temperature.
  // Hauteur 45 px comme les sparklines de centrales et de reservoirs, plus la marge
  // basse de 4 px qu'elles utilisent aussi.
  const pl = serieStation(k);
  const sparkH = pl ? (45 * sy) : 0;
  const sparkMb = pl ? (4 * sy) : 0;

  ctx.save();
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';

  // --- Geometrie : largeur sur le contenu le plus large ---
  ctx.font = 'bold ' + fsName + 'px "Segoe UI",Arial,sans-serif';
  const wTitre = ctx.measureText(titre).width + iconHd + 4 * sx + fsArw;  // + place du triangle
  ctx.font = fs + 'px "Segoe UI",Arial,sans-serif';
  let wRows = 0;
  for (const r of rows) {
    const w = ctx.measureText(r.txt).width + (r.icon ? iconSz + 4 * sx : 0);
    if (w > wRows) wRows = w;
  }
  // Plancher a 150 px image : en dessous, la sparkline devient illisible et les deux
  // echelles se chevauchent.
  const boxW = Math.max(wTitre, wRows, 150 * sx) + padX * 2;
  const headH = iconHd + Math.max(5, 7 * sy);
  const boxH = headH + rows.length * lh + sparkH + sparkMb + padY * 2;

  // Centree sur la station, bornee au canvas pour ne pas sortir de l'image.
  const bx = Math.max(2, Math.min(cv.width - boxW - 2, cx - boxW / 2));
  const by = Math.max(2, Math.min(cv.height - boxH - 2, topY));

  // --- Cartouche : memes couleurs que les etiquettes d'ouvrages ---
  ctx.fillStyle = '#fff';
  ctx.fillRect(bx, by, boxW, boxH);
  ctx.strokeStyle = 'rgba(80,80,80,.6)';
  ctx.lineWidth = Math.max(1, 0.9 * sx);
  ctx.strokeRect(bx, by, boxW, boxH);

  const leftX = bx + padX;
  let y = by + padY;

  // --- En-tete : icone station + « Nom (CODE) » ---
  const hdIm = iconImgs['station-meteo'];
  let hx = leftX;
  if (hdIm && hdIm.complete && hdIm.naturalWidth) {
    ctx.drawImage(hdIm, hx, y, iconHd, iconHd);
    hx += iconHd + 4 * sx;
  }
  ctx.font = 'bold ' + fsName + 'px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle = '#111';
  ctx.fillText(titre, hx, y + (iconHd - fsName) / 2);

  // Triangle de fermeture, cadre a droite et a la MEME taille que celui des ouvrages
  // (fsArrow = 28 * sx), a 6 px du bord comme eux.
  ctx.font = 'bold ' + fsArw + 'px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle = '#1a1a2e';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('▴', bx + boxW - 6 * sx, y + iconHd / 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  y += headH;

  // --- Separateur ---
  ctx.beginPath();
  ctx.moveTo(leftX, y - Math.max(2, 3 * sy));
  ctx.lineTo(bx + boxW - 6 * sx, y - Math.max(2, 3 * sy));
  ctx.strokeStyle = 'rgba(120,120,120,.55)';
  ctx.lineWidth = Math.max(0.8, 0.8 * sx);
  ctx.stroke();

  // --- Lignes de mesures ---
  // Icone et texte centres sur la MEME ligne de base, comme le fait drawLeftSegments
  // pour les ouvrages : l'icone (30 px) est plus haute que le texte (16 px), donc le
  // texte se centre sur elle et non l'inverse.
  ctx.font = fs + 'px "Segoe UI",Arial,sans-serif';
  ctx.textBaseline = 'middle';
  for (const r of rows) {
    let x = leftX;
    const yMid = y + iconSz / 2;
    if (r.icon) {
      const im = iconImgs[r.icon];
      if (im && im.complete && im.naturalWidth) {
        ctx.drawImage(im, x, yMid - iconSz / 2, iconSz, iconSz);
      }
      x += iconSz + 4 * sx;
    }
    ctx.fillStyle = '#555';   // meme intensite que les valeurs des ouvrages
    ctx.fillText(r.txt, x, yMid);
    y += lh;
  }
  ctx.textBaseline = 'top';

  // --- Sparkline (pluie + temperature) ---
  // Trace par drawStationChart, la meme fonction que la modale agrandie : les deux vues
  // ne peuvent donc pas diverger.
  if (pl) {
    const plotX = leftX;
    const plotY = y + Math.max(2, 3 * sy);
    const plotW = boxW - padX * 2;
    const plotH = sparkH - Math.max(4, 6 * sy);
    drawStationChart(ctx, pl, plotX, plotY, plotW, plotH, sx, { fsAxis: Math.max(8, Math.round(10 * sx)) });
    // Zone cliquable du graphe : ouvre la modale agrandie, comme les sparklines
    // d'ouvrages. En pixels image.
    staSparkBounds[k] = {
      x0: plotX / sx, y0: plotY / sy,
      x1: (plotX + plotW) / sx, y1: (plotY + plotH) / sy
    };
  }

  ctx.restore();

  // Boite de l'etiquette : un clic dessus la referme (comme l'en-tete d'une etiquette
  // d'ouvrage). En pixels image, comme staBounds.
  staLabelBounds[k] = { x0: bx / sx, y0: by / sy, x1: (bx + boxW) / sx, y1: (by + boxH) / sy };
}

// --- Turbinage : configuration de groupes estimee ---------------------------
// HQ ne publie QUE le debit turbine TOTAL d'une centrale (pas par groupe). On
// reconstruit la configuration la plus plausible selon la conduite reelle (doc
// "economic dispatch" / "unit commitment") :
//   1. On choisit le NOMBRE de groupes en service (commitment) en visant une CHARGE
//      CIBLE OPTIMALE par groupe (~85 % du nominal = haut rendement). Un operateur
//      arrete des groupes pour garder les actifs dans leur zone optimale plutot que de
//      les laisser tourner juste au-dessus du plancher (rendement mediocre).
//   2. On REPARTIT LA CHARGE EGALEMENT entre les groupes en service : pour des groupes
//      identiques, l'optimum (coûts marginaux egaux) = meme charge sur chacun.
// Charge/groupe visee dans [plancher, ~cible] ; peut depasser 100 % en SURCHARGE quand
// tous les groupes tournent et que le debit excede encore le nominal (cas crue : on
// turbine au max avant de devoir deverser). Plancher : Francis 50 %, Kaplan 25 %.
// Retourne { charges: [..N..] (valeur reelle, peut etre > 1 en surcharge), k, pct,
//            surcharge: bool }.
// spec = { nb_groupes, cap, famille_turbine } (une centrale OU un sous-groupe).
function turbineConfig(spec, turb) {
  const N = spec.nb_groupes;
  if (!N || !spec.cap || turb === null || turb === undefined) return null;
  const plancher = (spec.famille_turbine === 'Francis') ? 0.50 : 0.25;
  const CIBLE = 0.85;                            // charge visee par groupe (zone optimale)
  const qmax = spec.cap / N;                     // debit nominal d'un groupe
  const pct = Math.max(0, turb / spec.cap);      // charge globale (non bornee : peut depasser 100 %)
  const charges = new Array(N).fill(0);
  if (turb <= 0.5) return { charges: charges, k: 0, pct: 0, surcharge: false };   // arret total
  // 1. Commitment : nb de groupes qui place chacun le plus pres possible de la cible.
  let k = Math.round(turb / (qmax * CIBLE));
  if (k < 1) k = 1;
  if (k > N) k = N;
  // Contrainte haute : on ajoute des groupes tant que la charge/groupe depasse 100 %,
  // MAIS si tous les groupes (k=N) sont deja en service et que ca depasse encore, c'est
  // une SURCHARGE legitime (on ne peut pas ajouter plus de groupes).
  while (k < N && (turb / (k * qmax)) > 1) k++;
  // Contrainte basse (rendement) : sous le plancher, on arrete un groupe.
  while (k > 1 && (turb / (k * qmax)) < plancher) k--;
  // 2. Repartition EGALE entre les k groupes en service (valeur reelle, peut etre > 1).
  const chargeEgale = Math.max(0, turb / (k * qmax));
  for (let g = 0; g < k; g++) charges[g] = chargeEgale;
  const surcharge = chargeEgale > 1.001;
  return { charges: charges, k: k, pct: pct, surcharge: surcharge };
}

// Position verticale (fraction de lh) de l'indicateur turbine compact dans l'etiquette,
// sous la ligne MW. Sert au rendu ET au hit-test du clic (doivent rester synchronises).
// Fraction de la hauteur d'etiquette ou s'affiche la ligne turbine. A rescaler en
// meme temps que les autres ratios lh*0.xxxx si label_height change (elle vaut 0.4495
// pour label_height = 275, soit ~123,6 px : position historique conservee).
const TURB_ROW_FRAC = 0.4495;
// Ratio de la ligne "niveau" dans l'etiquette RESERVOIR. Partage entre le dessin et
// le test de clic (hitTestReservoirNiveauArrow) : les deux se sont desynchronises une
// fois, la zone cliquable restant a 0.47 apres le passage du dessin a 0.432.
const RES_ROW_NIVEAU = 0.432;

// Liste des sous-unites de turbinage d'une centrale : ses sous_groupes (ex. Shawinigan-2/-3,
// debit reparti au prorata des cap) ou la centrale entiere. turb = debit turbine total.
// Retourne [{ label, spec:{nb_groupes,cap,famille_turbine}, turb }, ...].
function turbineUnits(c, turb) {
  if (c.sous_groupes && c.sous_groupes.length > 0) {
    const capTot = c.sous_groupes.reduce((s, sg) => s + sg.cap, 0) || c.cap;
    return c.sous_groupes.map(sg => ({
      label: sg.nom,
      spec: { nb_groupes: sg.nb_groupes, cap: sg.cap, famille_turbine: c.famille_turbine },
      turb: turb * (sg.cap / capTot)
    }));
  }
  return [{ label: null,
            spec: { nb_groupes: c.nb_groupes, cap: c.cap, famille_turbine: c.famille_turbine },
            turb: turb }];
}

// Agrege k/N/pct sur toutes les sous-unites (pour l'indicateur compact de l'etiquette).
function turbineAggregate(c, turb) {
  const units = turbineUnits(c, turb);
  let k = 0, N = 0;
  let surcharge = false;
  for (const u of units) {
    const cfg = turbineConfig(u.spec, u.turb);
    if (cfg) { k += cfg.k; N += u.spec.nb_groupes; if (cfg.surcharge) surcharge = true; }
  }
  const pct = c.cap ? Math.max(0, turb / c.cap) : 0;   // non borne : peut depasser 100 %
  return { k: k, N: N, pct: pct, surcharge: surcharge };
}

function draw(i) {
  const sx = cv.width  / img.naturalWidth;
  const sy = cv.height / img.naturalHeight;
  // Echelle pour les elements DOM (titre, date, lien "Mobile", habillage, selecteurs).
  // Distincte de sx : depuis le surechantillonnage du canvas, sx est exprime en pixels
  // de BACKING STORE (multiplie par devicePixelRatio et par le zoom pinch), ce qui est
  // voulu pour le tracé mais faux pour du DOM, qui raisonne en pixels CSS. On repart
  // donc de la taille AFFICHEE de l'image.
  const sxCss = img.offsetWidth / img.naturalWidth;
  ctx.clearRect(0,0,cv.width,cv.height);
  // Calque de fond : regroupements de pluie (voir drawZonesMeteo). Dessine ici,
  // avant la legende et les ouvrages, pour rester SOUS tout le reste.
  drawZonesMeteo(sx, sy);
  // Stations meteo : APRES les remplissages de zone (sinon une zone les voile), mais
  // toujours dans le calque de fond pour passer SOUS les etiquettes d'ouvrages.
  // Appel inconditionnel : contrairement aux contours, les stations et leur mesure ne
  // dependent pas de la case « Zones meteo ».
  drawStationsMeteo(sx, sy);
  const lw = D.labelW * sx;
  const lh = D.labelH * sy;

  // ---- LEGENDE : tableau opaque autonome ----
  // Remplace l'ancien assemblage de 3 blocs positionnes les uns par rapport aux autres
  // (lgResX = lgX - 340, colonne statuts calee sur la fin du texte "Turbine", etc.).
  // Ce montage devait en plus s'aligner sur le mot "LEGENDE" et la rosace "Centrale"
  // GRAVES dans gestion-reservoir.jpg, d'ou des decalages en cascade fragiles.
  //
  // Ici : un rectangle blanc opaque couvre toute la zone (donc masque le texte grave),
  // et tout est dessine relativement a ce rectangle. Une seule source de verite pour
  // la geometrie ; les colonnes, les lignes, le titre et les notes en decoulent.
  if (D.legend) {
    const lgFs = Math.max(10, Math.round(D.legend.fontSize * sx));
    const lgFont      = lgFs + 'px "Segoe UI",Arial,sans-serif';
    const lgFontBold  = 'bold ' + lgFs + 'px "Segoe UI",Arial,sans-serif';
    const lgFontTitle = 'bold ' + Math.round(lgFs * 1.3) + 'px "Segoe UI",Arial,sans-serif';
    // Note en pied a la MEME taille que le texte de la legende — donc que le bandeau
    // des faits saillants, qui est pilote par ce meme lgFs (cf. riverBox.style.fontSize).
    // Elle paraissait rapetissee a 0.8x.
    const lgFontNote  = lgFont;
    // Taille reduite reservee aux renvois "(1)" accoles a une mesure, en gras pour
    // qu'ils restent reperables malgre la petite taille.
    const lgFontExp   = 'bold ' + Math.max(9, Math.round(lgFs * 0.8)) + 'px "Segoe UI",Arial,sans-serif';
    const lgIs   = Math.max(14, Math.round(D.legend.iconSize * sx));
    // Interligne resserre (0.85x) : le tableau compte jusqu'a 5 lignes + titre + notes,
    // et doit tenir entre le texte grave du JPG et l'axe des distances.
    // Interligne a 1.02x lineHeight (etait 0.85) : les icones font icon_size px de
    // haut, soit AUTANT que lineHeight — a 0.85 l'interligne etait plus serre que
    // les icones elles-memes, et celles de deux lignes voisines se touchaient. Le
    // leger depassement au-dela de 1.0 donne le blanc de respiration.
    const lgLh   = Math.max(15, Math.round(D.legend.lineHeight * 1.02 * sy));
    const lgGap  = Math.max(6, Math.round(9 * sx));
    const lgCol  = '#1a3060';

    // Textes hors canvas alignes sur la taille du texte de la legende.
    //
    // ATTENTION : ces elements sont du DOM, donc en pixels CSS -> on utilise lgFsCss
    // (base sur sxCss) et NON lgFs, qui est en pixels de backing store depuis le
    // surechantillonnage du canvas. Utiliser lgFs ici les ferait grossir d'un facteur
    // devicePixelRatio x zoom-pinch par-dessus l'agrandissement optique du navigateur.
    const lgFsCss = Math.max(10, Math.round(D.legend.fontSize * sxCss));
    if (riverBox) riverBox.style.fontSize = lgFsCss + 'px';
    const discEl = document.getElementById('disclaimer');
    if (discEl) discEl.style.fontSize = lgFsCss + 'px';
    const genEl = document.getElementById('generatedAt');
    if (genEl) genEl.style.fontSize = lgFsCss + 'px';
    // Titre + horodatage : etaient pilotes par clamp(...vw...) en CSS.
    // 'vw' suit la largeur de FENETRE, alors que l'image de fond est contrainte par la
    // hauteur (max-height:calc(100vh - 54px)) et bouge donc peu au zoom navigateur :
    // les deux divergeaient, d'ou l'impression que "tout grossit sauf l'image".
    // On les indexe sur lgFsCss, qui suit la taille AFFICHEE de l'image, comme le
    // reste du canvas. Ratios reprenant les proportions CSS d'origine
    // (1.55vw et 1.22vw contre 0.95vw pour le texte de legende).
    const titreEl = document.getElementById('titre');
    if (titreEl) titreEl.style.fontSize = Math.round(lgFsCss * 1.63) + 'px';
    const tsEl = document.getElementById('ts');
    if (tsEl) tsEl.style.fontSize = Math.round(lgFsCss * 1.28) + 'px';
    // Bloc haut-droite ("Mobile · v2.x.x") : restait en clamp(...vw...), donc il
    // grossissait avec la fenetre au lieu de suivre l'image. Meme ratio que le
    // disclaimer, dont il partageait la regle CSS (0.95vw).
    const topREl = document.getElementById('topRight');
    if (topREl) topREl.style.fontSize = lgFsCss + 'px';
    // NB : la barre de controle n'est PAS indexee sur lgFsCss. Ces textes-ci sont
    // de l'habillage du SCHEMA et doivent suivre sa taille ; la barre, elle, est
    // un element d'interface pose sur le viewport, qui doit garder une taille
    // constante A L'ECRAN. L'y avoir indexee la faisait enfler avec l'image (a
    // 200 % en mode application, elle couvrait le bas du schema). Sa taille est
    // donc fixee en CSS via --ctrl-fs, hors de cette fonction.

    // --- Contenu declaratif : 4 colonnes (en-tete + lignes) ---
    const lgCols = [
      { titre: 'Réservoir', icone: 'barrage', lignes: [
          { icon: 'niveau',  text: 'Niveau (m)' },
          { icon: 'deverse', text: 'Déversé (m³/s)' }
        ] },
      { titre: 'Centrale', icone: 'centrale', lignes: [
          { icon: 'debit',        text: 'Débit total (m³/s)' },
          { icon: 'turbine-vert', text: 'Turbiné (m³/s)' },
          { icon: 'eclair',       text: 'Élec. générée (MW)' }
        ] },
      // Pas d'en-tete "Intensite" : les anneaux se lisent d'eux-memes et la colonne
      // demarre donc a la hauteur des en-tetes. 'N/D' plutot que 'Non disponible'
      // pour resserrer la largeur.
      // Les teintes sont lues via ratioColor() aux bornes de chaque palier, pour que
      // la legende suive automatiquement tout futur ajustement des seuils/couleurs
      // de statut au lieu de diverger silencieusement.
      { lignes: [
          { ring: ratioColor(0).f,    text: 'Bas' },
          { ring: ratioColor(50).f,   text: 'Modéré' },
          { ring: ratioColor(75).f,   text: 'Élevé' },
          { ring: ratioColor(95).f,   text: 'Fort' },
          { ring: ratioColor(null).f, text: 'N/D' }
        ] },
      // 'Apport naturel' n'est pas un en-tete de categorie (contrairement a Reservoir
      // et Centrale qui coiffent plusieurs mesures) : c'est une mesure au meme titre
      // que 'Pluie'. Les deux sont donc des lignes normales, sans gras.
      { lignes: [
          { icon: 'apport', text: 'Apport naturel (m³/s)', exp: '1' },
          // Pas de renvoi sur la pluie : le libelle « Pluie (mm/24h) » se suffit.
          // L'explication complete (stations de la zone, valeur commune aux ouvrages
          // d'une meme zone) vit dans les modales, cf. MODAL_NOTES.
          { icon: 'pluie',  text: 'Pluie (mm/24h)' },
          // Toujours affichee, y compris calque des zones masque : l'entree fait
          // partie du vocabulaire fixe de la legende, dont la composition ne doit
          // pas changer sous l'effet d'une case a cocher. Choix assume : quand le
          // calque est masque, elle designe un symbole alors absent de l'image.
          { icon: 'station-meteo', text: 'Station météo' },
          // Sous « Station meteo » : la temperature n'est lisible que dans l'etiquette
          // d'une station (min/max du pas de temps affiche), a la difference de la pluie
          // qui figure aussi sur les ouvrages.
          { icon: 'temperature', text: 'T° min/max (°C)' }
        ] }
    ];
    // La legende a desormais une composition FIXE : plus aucune entree n'apparait
    // ou ne disparait selon l'etat du calque des zones (le filtre zoneOnly qui se
    // trouvait ici est tombe avec sa derniere entree, « Station meteo »).
    // Si une entree conditionnelle redevenait necessaire, la filtrer ICI, avant
    // toute mesure : la hauteur du cadre se calcule sur le nombre de lignes, et
    // filtrer plus tard laisserait un blanc a la place de l'entree.

    // Note de legende volontairement raccourcie : le detail (publication 1x/jour,
    // hors manoeuvre HQ) est reporte dans les modales des centrales et reservoirs,
    // ou le lecteur regarde la serie de pres. Cf. MODAL_NOTES.
    const lgNotes = [
      { exp: '1', text: "Eau entrant dans l'ouvrage depuis son bassin versant (pluie, fonte, ruissellement)." }
    ];

    // --- Largeur de chaque colonne : mesuree sur son contenu reel ---
    const lgPad     = Math.round(14 * sx);            // marge interieure du cadre
    const lgColGap  = Math.round(22 * sx);            // espace entre colonnes
    const lgTitleH  = Math.round(lgLh * 1.5);         // bandeau titre "LEGENDE"
    const colW = lgCols.map(col => {
      let w = 0;
      if (col.titre) {
        ctx.font = lgFontBold;
        w = lgIs + lgGap + ctx.measureText(col.titre).width;
      }
      ctx.font = lgFont;
      for (const l of col.lignes) {
        const wl = lgIs + lgGap + ctx.measureText(l.text + (l.exp ? ' (' + l.exp + ')' : '')).width;
        if (wl > w) w = wl;
      }
      return Math.ceil(w);
    });

    // --- Hauteur : bandeau titre + en-tete + lignes max + notes ---
    // Hauteur en nombre de rangees : une colonne sans titre commence a la rangee 0,
    // donc elle occupe une rangee de moins qu'une colonne titree de meme longueur.
    const maxLignes = Math.max.apply(null, lgCols.map(c => c.lignes.length + (c.titre ? 1 : 0))) - 1;
    ctx.font = lgFontNote;
    const noteTxts = lgNotes.map(n => '(' + n.exp + ') ' + n.text);
    const boxW = lgPad * 2 + colW.reduce((a, b) => a + b, 0) + lgColGap * (lgCols.length - 1);
    const noteMaxW = boxW - lgPad * 2;
    // Retour a la ligne des notes : on decoupe par mots selon la largeur disponible.
    // Une ligne VIDE separe deux notes consecutives : accolees, leurs lignes se
    // confondaient et on ne voyait plus ou l'une finit et l'autre commence.
    const noteLines = [];
    noteTxts.forEach((t, ni) => {
      if (ni > 0) noteLines.push('');
      let cur = '';
      for (const mot of t.split(' ')) {
        const essai = cur ? cur + ' ' + mot : mot;
        if (ctx.measureText(essai).width > noteMaxW && cur) { noteLines.push(cur); cur = mot; }
        else { cur = essai; }
      }
      if (cur) noteLines.push(cur);
    });
    const lgNoteLh = Math.round(lgLh * 0.95);   // note en taille pleine : interligne quasi normal
    // Le 1.0 doit rester synchronise avec yNote0 plus bas (respiration tableau/notes),
    // sinon le cadre ne contient plus la derniere ligne de note.
    const boxH = lgTitleH + lgLh * (1 + maxLignes) + Math.round(lgLh * 1.0)
               + noteLines.length * lgNoteLh + lgPad;

    // --- Position : ancree sur D.legend, recentree pour couvrir la zone gravee ---
    // L'ancien code partait de lgX - 340 pour le bloc Reservoir : on reprend ce bord
    // gauche comme origine du cadre, et on remonte du bandeau titre pour recouvrir le
    // mot "LEGENDE" de l'image.
    // Le cadre doit couvrir le mot "LEGENDE" grave dans le JPG (vers y=833 px image)
    // ET la rosace "Centrale" gravee juste sous lui. On ancre donc le HAUT du cadre
    // au-dessus du texte grave, et on cale le bas pour ne pas mordre sur l'axe des
    // distances (~y=1050 px image). D.legend.y reste le point de reference configurable.
    // Decale vers la droite (-260 au lieu de -340) et remonte (-150 au lieu de -120) :
    // la note en taille pleine allonge le cadre, et il y a de la place libre a droite.
    const boxX = Math.round((D.legend.x - 260) * sx);
    // Remonte de 190 px image (au lieu de 150) : le cadre a raccourci depuis le
    // retrait de la ligne « Zone de pluie », et il restait bas dans l'image alors
    // que la place libre est au-dessus. Le remonter degage aussi le bandeau des
    // faits saillants, qui vit juste sous lui.
    const boxY = Math.round((D.legend.y - 190) * sy);

    // --- Cadre opaque ---
    ctx.save();
    // Fond gris pale = teinte exacte du fond de gestion-reservoir.jpg (#F0F4F5, mesuree
    // au pixel en plusieurs points). Le tableau se fond ainsi dans l'image au lieu de
    // ressortir comme un bloc blanc.
    // Reste 100 % OPAQUE (pas de rgba) : le cadre doit masquer le mot "LEGENDE" et la
    // rosace "Centrale" graves dans le JPG. Une transparence les laisserait reapparaitre.
    ctx.fillStyle = '#f0f4f5';
    ctx.strokeStyle = 'rgba(90,110,140,.35)';
    ctx.lineWidth = Math.max(1, Math.round(1.2 * sx));
    const r = Math.round(8 * sx);
    ctx.beginPath();
    ctx.moveTo(boxX + r, boxY);
    ctx.lineTo(boxX + boxW - r, boxY);
    ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
    ctx.lineTo(boxX + boxW, boxY + boxH - r);
    ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
    ctx.lineTo(boxX + r, boxY + boxH);
    ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
    ctx.lineTo(boxX, boxY + r);
    ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- Bandeau titre ---
    ctx.save();
    ctx.font = lgFontTitle;
    ctx.fillStyle = lgCol;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('LÉGENDE', boxX + boxW / 2, boxY + lgTitleH / 2);
    ctx.textAlign = 'left';
    // Filet sous le titre
    ctx.beginPath();
    ctx.moveTo(boxX + lgPad, boxY + lgTitleH);
    ctx.lineTo(boxX + boxW - lgPad, boxY + lgTitleH);
    ctx.strokeStyle = 'rgba(120,140,170,.35)';
    ctx.lineWidth = Math.max(1, Math.round(1 * sx));
    ctx.stroke();
    ctx.restore();

    // --- Colonnes ---
    let cx = boxX + lgPad;
    const yHead = boxY + lgTitleH + Math.round(lgLh * 0.75);
    lgCols.forEach((col, ci) => {
      // En-tete de colonne (optionnel). Sans titre, les lignes remontent d'un cran
      // pour demarrer a la hauteur des en-tetes des autres colonnes.
      if (col.titre) {
        const segsH = [];
        if (col.icone) { segsH.push({ icon: col.icone, size: lgIs }, { gap: lgGap }); }
        segsH.push({ text: col.titre, color: lgCol, font: lgFontBold });
        drawLeftSegments(ctx, segsH, cx, yHead, lgFontBold);
      }
      const rowOffset = col.titre ? 1 : 0;

      // Lignes de la colonne
      col.lignes.forEach((l, li) => {
        const y = yHead + (li + rowOffset) * lgLh;
        if (l.ring) {
          // Anneau de couleur (meme rendu que les rosaces de centrale)
          const rr = Math.max(6, Math.round(lgIs * 0.42));
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx + rr, y, rr, 0, Math.PI * 2);
          ctx.strokeStyle = l.ring;
          ctx.lineWidth = Math.max(2, Math.round(rr * 0.38));
          ctx.stroke();
          ctx.restore();
          ctx.font = lgFont;
          ctx.fillStyle = lgCol;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(l.text, cx + rr * 2 + lgGap, y);
        } else {
          const sz = (l.icon === 'deverse') ? Math.round(lgIs * 1.2) : lgIs;
          const segsL = [
            { icon: l.icon, size: sz },
            { gap: lgGap },
            { text: l.text, color: lgCol }
          ];
          // Renvoi vers une note de pied (ex. "(1)"), en plus petit.
          if (l.exp) {
            segsL.push({ text: ' (' + l.exp + ')', color: 'rgba(90,110,150,.95)',
                         font: lgFontExp });
          }
          drawLeftSegments(ctx, segsL, cx, y, lgFont);
        }
      });
      cx += colW[ci] + lgColGap;
    });

    // --- Notes en pied ---
    ctx.save();
    ctx.font = lgFontNote;
    ctx.fillStyle = 'rgba(80,95,125,.95)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    // + une interligne complete de respiration entre le tableau et les notes.
    const yNote0 = yHead + (maxLignes + 1) * lgLh + Math.round(lgLh * 1.0);
    noteLines.forEach((t, k) => {
      const y = yNote0 + k * lgNoteLh;
      // Le renvoi "(n)" en tete de note est mis en gras, comme celui accole a la
      // mesure : les deux doivent se repondre visuellement. On le dessine donc
      // separement du corps de la note.
      const m = t.match(/^(\(\d+\)\s*)(.*)$/);
      if (m) {
        ctx.font = 'bold ' + lgFontNote;
        ctx.fillText(m[1], boxX + lgPad, y);
        const wExp = ctx.measureText(m[1]).width;
        ctx.font = lgFontNote;
        ctx.fillText(m[2], boxX + lgPad + wExp, y);
      } else {
        ctx.font = lgFontNote;
        ctx.fillText(t, boxX + lgPad, y);
      }
    });

    ctx.restore();
  }

  // ---- CENTRALES ----
  for (const c of D.centrales) {
    const deb = c.debits[i];
    // Ratio min/max historique pour la couleur
    let ratio = null;
    if (deb !== null && c.minTotal !== null && c.maxTotal !== null && (c.maxTotal - c.minTotal) > 0) {
      ratio = Math.round((deb - c.minTotal) / (c.maxTotal - c.minTotal) * 100);
    }
    const col = ratioColor(ratio);
    const ix = c.iconX * sx, iy = c.iconY * sy;

    // Anneau coloré autour de la rosace du JPG de fond
    if (c.rosaceX !== null && c.rosaceY !== null) {
      const ringR = Math.round(D.legend.iconSize * sx * 0.62);
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.rosaceX * sx, c.rosaceY * sy, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = col.f;
      ctx.lineWidth = Math.max(2.5, 4 * sx);
      ctx.stroke();
      ctx.restore();
    }

    const lx = c.labelX * sx, ly = c.labelY * sy;
    // Largeur d'etiquette specifique a la centrale si definie (ex. nom long), sinon valeur par defaut.
    const lwC = (c.labelW || D.labelW) * sx;

    // Debit total + triangle toggle au cote du nom de la centrale.
    // Toujours dessine, independamment de l'etat de l'etiquette.
    const debMap = c.debitsEff[i];
    const ciPos = debitLabelPos('c', D.centrales.indexOf(c));
    if (debMap !== null && ciPos.x !== null && ciPos.y !== null) {
      const fsCap = Math.max(8, Math.round(13 * sx));
      const fsUnit = Math.max(6, Math.round(10 * sx));  // m³/s 25% plus petit que le chiffre
      ctx.save();
      if (c.debitsStale[i]) ctx.globalAlpha = 0.45;

      ctx.fillStyle = '#111';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const debX = ciPos.x * sx, debY = ciPos.y * sy;
      // Chiffre en grand
      ctx.font = 'bold ' + fsCap + 'px "Segoe UI",Arial,sans-serif';
      const numTxt = String(debMap);
      ctx.fillText(numTxt, debX, debY);
      const numW = ctx.measureText(numTxt).width;
      // Unite m³/s plus petite, alignee en bas avec le chiffre
      ctx.font = 'bold ' + fsUnit + 'px "Segoe UI",Arial,sans-serif';
      const unitTxt = ' m³/s';
      ctx.fillText(unitTxt, debX + numW, debY + (fsCap - fsUnit));
      const unitW = ctx.measureText(unitTxt).width;
      // Triangle toggle : meme taille que le triangle de l'etiquette (fsArrow = 28*sx).
      const debW = numW + unitW;
      const triChar = isVisible(c) ? '▴' : '▾';
      const fsTriMap = Math.max(18, Math.round(28 * sx));
      ctx.font = 'bold ' + fsTriMap + 'px "Segoe UI",Arial,sans-serif';
      ctx.fillStyle = isVisible(c) ? '#1a1a2e' : '#555577';
      const triX = debX + debW + 1 * sx;
      const triW = ctx.measureText(triChar).width;
      ctx.fillText(triChar, triX, debY + (fsCap - fsTriMap) * 0.5);
      ctx.restore();
      const ciIdx2 = D.centrales.indexOf(c);
      mapToggleBounds[ciIdx2] = {
        x0: triX / sx, y0: (debY - 2*sx) / sy,
        x1: (triX + triW + 6*sx) / sx, y1: (debY + fsCap + 2*sx) / sy
      };
    } else {
      const ciIdx2 = D.centrales.indexOf(c);
      mapToggleBounds[ciIdx2] = null;
    }

    // Icone info (i) sur la carte (toujours visible, independante de l'etiquette).
    const fsArrow = Math.max(18, Math.round(28 * sx));
    const fsInfo  = Math.max(14, Math.round(22 * sx));
    const infoSzC = fsInfo;
    const infoImC = iconImgs['info'];
    const ciIdx = D.centrales.indexOf(c);
    const infoPosC = infoLabelPos('ic', ciIdx);
    if (infoPosC.x !== null && infoImC && infoImC.complete) {
      const infoXC = infoPosC.x * sx, infoYC = infoPosC.y * sy;
      ctx.drawImage(infoImC, infoXC - infoSzC/2, infoYC - infoSzC/2, infoSzC, infoSzC);
      infoCentBounds[ciIdx] = { x: infoPosC.x, y: infoPosC.y, r: (infoSzC * 0.55) / sx };
    } else {
      infoCentBounds[ciIdx] = null;
    }

    // Etat : expanded = toujours pleine hauteur. Cache si alpha == 0.
    const expanded = isExpanded(c);
    const lhEff = lh;
    const alpha  = labelAlpha[c.id] !== undefined ? labelAlpha[c.id] : (expanded ? 1 : 0);
    if (alpha <= 0) continue;  // saute le rendu etiquette si completement cachee

    // Alpha fondu : applique sur toute l'etiquette + pointille + pastille.
    ctx.save();
    ctx.globalAlpha = alpha;

    // Ligne de rappel icon -> etiquette (pointillee).
    const lcx = lx + lwC/2, lcy = ly + lhEff/2;
    const dx = ix - lcx,   dy  = iy - lcy;
    let ex = lcx, ey = lcy;
    if (Math.abs(dx) > Math.abs(dy) * (lwC/lhEff)) { ex = dx>0 ? lx+lwC : lx; }
    else                                            { ey = dy>0 ? ly+lhEff : ly; }
    ctx.save();
    ctx.setLineDash([6*sx, 6*sx]);
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ix,iy);
    ctx.strokeStyle='rgba(50,50,50,.65)'; ctx.lineWidth=1.1*sx; ctx.stroke();
    ctx.restore();

    // Pastille icone
    ctx.beginPath(); ctx.arc(ix,iy,4*sx,0,2*Math.PI);
    ctx.fillStyle=col.f; ctx.fill();

    // Fond etiquette : utilise lhEff pour vraiment liberer de l'espace en mode compact.
    ctx.fillStyle='#fff';
    ctx.fillRect(lx,ly,lwC,lhEff);
    const barW = 0;
    // Bordure
    ctx.strokeStyle='rgba(80,80,80,.6)'; ctx.lineWidth=.9*sx;
    ctx.strokeRect(lx,ly,lwC,lhEff);

    const leftX = lx + barW + 6 * sx;
    const fsName      = Math.max(11, Math.round(17 * sx));
    const fsTotal     = Math.max(10, Math.round(17 * sx));
    const fsIcon      = Math.max(12, Math.round(30 * sx));
    const fsIconDev   = Math.max(14, Math.round(25 * sx));   // meme taille que sur les reservoirs
    const fsDetail    = Math.max(10, Math.round(16 * sx));
    const fsMw        = Math.max(10, Math.round(17 * sx));
    const fsTrend     = Math.max(10, Math.round(15 * sx));
    const fontName      = 'bold ' + fsName  + 'px "Segoe UI",Arial,sans-serif';
    const fontDetail    = fsDetail    + 'px "Segoe UI",Arial,sans-serif';
    const fontMw        = 'bold ' + fsMw    + 'px "Segoe UI",Arial,sans-serif';
    const fontTotal     = 'bold ' + fsTotal + 'px "Segoe UI",Arial,sans-serif';

    // Couleurs pour les valeurs : intensite reduite pour mettre le nom en evidence
    const valCol = '#555';

    // Ligne 0 : icone rosace + nom de la centrale en gras.
    const fsCentrIcon = Math.max(12, Math.round(fsName * 1.40));
    const nameEndX = drawLeftSegments(ctx, [
      { icon: 'centrale', size: fsCentrIcon },
      { text: c.nomAffiche || c.nom, color: '#111' }
    ], leftX, ly + lh*0.0556, fontName);

    // Indicateur fermeture dans le coin haut-droit : toujours ▴ (ferme l'etiquette).
    const arrowXC = lx + lwC - 6*sx;
    const rowYC = ly + lh*0.0556;
    ctx.font = 'bold ' + fsArrow + 'px "Segoe UI",Arial,sans-serif';
    ctx.fillStyle = '#1a1a2e';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('▴', arrowXC, rowYC);
    const sepY = ly + lh*0.1244;
    ctx.beginPath();
    ctx.moveTo(leftX, sepY);
    ctx.lineTo(lx + lwC - 6*sx, sepY);
    ctx.strokeStyle = 'rgba(120,120,120,.55)';
    ctx.lineWidth = 0.8*sx;
    ctx.stroke();

    // Ligne 1 : debit total (primaire) avec gouttes (icone PNG)
    // Si donnee fraiche absente, on affiche la derniere valeur connue avec opacite reduite.
    const debEff = c.debitsEff[i];
    if (debEff !== null) {
      ctx.save();
      if (c.debitsStale[i]) ctx.globalAlpha = 0.45;
      drawLeftSegments(ctx, [
        { icon: 'debit', size: fsIcon },
        { text: debEff + ' m³/s', color: valCol }
      ], leftX, ly + lh*0.1720, fontTotal);
      ctx.restore();
    }

    // Lignes 2-4 + sparkline : toujours visibles (plus de mode compact).
    if (true) {
      // Ligne 2 : detail (engrenage vert + valeur) + (verre + valeur), icones PNG
      const turbEff = c.turbsEff[i];
      const devEff  = c.devsEff[i];
      const turbStale = c.turbsStale[i];
      const devStale  = c.devsStale[i];
      if (turbEff !== null || devEff !== null) {
        const grayCol = 'rgba(110,110,110,.95)';
        ctx.save();
        const lineStale = (turbEff !== null && devEff !== null) ? (turbStale && devStale)
                         : (turbEff !== null ? turbStale : devStale);
        if (lineStale) ctx.globalAlpha = 0.45;
        drawLeftSegments(ctx, [
          { icon: 'turbine-vert', size: fsIcon },
          { text: (turbEff !== null ? turbEff : '-') + '   ', color: grayCol },
          { icon: 'deverse', size: fsIconDev },
          { text: (devEff  !== null ? devEff  : '-'), color: grayCol }
        ], leftX, ly + lh*0.2618, fontDetail);
        ctx.restore();
      }

      // Ligne 3 : MW calcule avec eclair (icone PNG)
      const mwEff = c.mwsEff[i];
      if (mwEff !== null) {
        const fsMwUnit = Math.max(8, Math.round(fsMw / 2));
        const fontMwUnit = fsMwUnit + 'px "Segoe UI",Arial,sans-serif';
        const segs = [
          { icon: 'eclair', size: fsIcon },
          { text: mwEff + ' ',  color: valCol },
          { text: 'MW ',        color: valCol, font: fontMwUnit }
        ];
        if (c.cap_mw !== null) {
          const mwR = Math.round(mwEff / c.cap_mw * 100);
          segs.push({ text: '(' + mwR + ' %)', color: valCol });
        }
        ctx.save();
        if (c.mwsStale[i]) ctx.globalAlpha = 0.45;
        drawLeftSegments(ctx, segs, leftX, ly + lh*0.3604, fontMw);
        ctx.restore();
      }

      // Ligne 3b : INDICATEUR turbine compact = 1 icone (du type) remplie selon la
      // charge globale + "k/N" (groupes en fonction / total). Le detail des N turbines
      // (empilement, charge par groupe) s'ouvre dans un modal au clic (cf. hitTestTurbineIcon).
      const turbForCfg = c.turbsEff[i];
      if (c.nb_groupes && turbForCfg !== null && turbForCfg !== undefined) {
        const agg = turbineAggregate(c, turbForCfg);   // { k, N, pct } combine (gere sous_groupes)
        const fam = c.famille_turbine;
        const name = (fam === 'Francis') ? 'turbine-francis' : 'turbine-kaplan';
        const sz = Math.round(fsIcon * 0.95);   // taille proche des autres icones de l'etiquette
        const yMid = ly + lh*TURB_ROW_FRAC;
        // Dans l'etiquette : icone PLEINE et NETTE (pas de jauge ni teinte verte).
        // La charge par turbine (jauge) est reservee au modal detaille.
        const turbIm = iconImgs[name];
        if (turbIm && turbIm.complete && turbIm.naturalWidth > 0) {
          ctx.save();
          if (c.turbsStale[i]) ctx.globalAlpha = 0.5;
          ctx.drawImage(turbIm, leftX, yMid - sz/2, sz, sz);
          ctx.restore();
        }
        // Texte "k/N" + chevron pour signaler le clic (modal), sur une seule ligne.
        // Meme police que la ligne MW (fontMw / fsMw) pour la coherence visuelle.
        ctx.font = fontMw;
        ctx.fillStyle = '#2a6a2a';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const lbl = (agg.k > 0) ? (agg.k + '/' + agg.N) : 'arrêt';
        ctx.fillText(lbl, leftX + sz + 6*sx, yMid);
        const wLbl = ctx.measureText(lbl).width;
        ctx.fillStyle = '#5a7a9a';
        ctx.fillText(' ▸', leftX + sz + 6*sx + wLbl, yMid);
      }

      // Ligne 4 : tendance
      const tr = c.trends[i];
      const fontTrend = fsTrend+'px "Segoe UI",Arial,sans-serif';
      const trUnit = D.trendUnit || '6h';
      if (tr === null) {
        drawLeftSegments(ctx, [{ text: '—', color: '#3a3a3a' }], leftX, ly + lh*0.7440, fontTrend);
      } else {
        const sign = tr >= 0 ? '+' : '';
        if (tr > 50) {
          drawLeftSegments(ctx, [
            { text: sign + tr + ' m³/s en ' + trUnit, color: '#a01818' }
          ], leftX, ly + lh*0.7440, fontTrend);
        } else if (tr < -50) {
          drawLeftSegments(ctx, [
            { text: sign + tr + ' m³/s en ' + trUnit, color: '#1a6e1a' }
          ], leftX, ly + lh*0.7440, fontTrend);
        } else {
          const sh = c.stables ? c.stables[i] : null;
          const stTxt = (sh === null || sh === undefined) ? 'stable'
                      : (typeof sh === 'string' ? 'stable depuis ' + sh
                                                : 'stable depuis ' + sh + (D.periode === 'horaire' ? 'h' : (D.periode === 'journalier' ? 'j' : 'sem')));
          drawLeftSegments(ctx, [
            { text: stTxt, color: '#3a3a3a' }
          ], leftX, ly + lh*0.7440, fontTrend);
        }
      }

      // --- Apport naturel + pluie 24 h (memes grandeurs que sur les reservoirs) ---
      // HQ publie 'Apport filtre' pour les centrales aussi (66 sites sur 94), pas
      // seulement pour les reservoirs : c'est l'eau naturelle qui arrive sur le tronçon,
      // hors manoeuvre. Donnee JOURNALIERE, donc affichee telle quelle sans interpolation.
      // La pluie vient de la zone meteo de rattachement (deduite du champ 'ouvrages'
      // de config/metadata/meteo-<bassin>.json).
      const cApport = (c.apportsEff && c.apportsEff[i] !== undefined) ? c.apportsEff[i] : null;
      if (cApport !== null) {
        // Pas de grisage : la valeur est pleinement lisible. Quand elle est reportee
        // d'une publication anterieure (apport = 1 valeur/jour), on ecrit la date de
        // cette publication en petit a cote — plus informatif qu'une opacite reduite,
        // qui signale l'anciennete sans la quantifier.
        const segs = [
          { icon: 'apport', size: fsIconDev },
          { text: cApport + ' m³/s', color: 'rgba(110,110,110,.95)' }
        ];
        if (c.apportsStale && c.apportsStale[i]) {
          const kReal = lastRealIdx(c.apports, i);
          const dTxt = (kReal >= 0 && D.timestamps) ? dateCourte(D.timestamps[kReal]) : '';
          if (dTxt) {
            const fsAge = Math.max(8, Math.round(fsDetail * 0.78));
            segs.push({ text: ' (' + dTxt + ')', color: 'rgba(150,150,150,.95)',
                        font: fsAge + 'px "Segoe UI",Arial,sans-serif' });
          }
        }
        drawLeftSegments(ctx, segs, leftX, ly + lh*0.5476, fontDetail);
      }
      let cPluie24 = null;
      if (c.zoneMeteo && D.meteo && D.meteo.zones) {
        const czFr = meteoZoneFrame(i);
        const czi = D.meteo.zones.findIndex(z => z.key === c.zoneMeteo);
        if (czFr && czi >= 0 && czFr[czi] && czFr[czi].p24 != null) {
          cPluie24 = czFr[czi].p24;
        }
      }
      if (cPluie24 !== null) {
        drawLeftSegments(ctx, [
          { icon: 'pluie', size: fsIconDev },
          { text: cPluie24 + ' mm/24h', color: 'rgba(110,110,110,.95)' }
        ], leftX, ly + lh*0.6458, fontDetail);
      }

      // Sparkline minimaliste avec axes X (temps) et Y (debit min/max).
      // Reserve de la place pour les labels : 3 caracteres a droite (axe Y), 1 ligne en bas (axe X).
      const sparkH = 45 * sy;
      const sparkBottomMargin = 4 * sy;
      // Espaces reserves pour les labels (en pixels CANVAS, donc deja scales).
      const fsAxis = Math.max(8, Math.round(10 * sx));
      const yLabelW = fsAxis * 2.6;     // largeur reservee a droite pour les chiffres min/max
      const xLabelH = fsAxis * 1.4;     // hauteur reservee en bas pour la date
      // Zone reelle de tracage de la courbe (apres soustraction des marges axes).
      const plotX = lx + barW + 4 * sx;
      const plotY = ly + lh - sparkH - sparkBottomMargin;
      const plotW = lwC - barW - 8 * sx - yLabelW;
      const plotH = sparkH - xLabelH;
      // Min/max combine sur les 3 series (debit total, turbine, deverse) pour
      // que les 3 courbes partagent la meme echelle Y. On part du min/max
      // historique du debit total (qui est souvent dominant) puis on etend
      // si turbine/deverse depassent dans la fenetre courante.
      let yMinC = c.minTotal, yMaxC = c.maxTotal;
      if (yMinC === null || yMaxC === null) { yMinC = 0; yMaxC = 1; }
      for (const v of c.turbs) { if (v === null) continue; if (v < yMinC) yMinC = v; if (v > yMaxC) yMaxC = v; }
      for (const v of c.devs)  { if (v === null) continue; if (v < yMinC) yMinC = v; if (v > yMaxC) yMaxC = v; }
      // Garder 0 comme borne basse si toutes les series sont positives — sinon
      // les courbes deverse (souvent ~0) seraient ecrasees au bas de l'axe.
      if (yMinC > 0) yMinC = 0;
      if (plotH > 6 && plotW > 10 && yMaxC > yMinC) {
        const range = yMaxC - yMinC;
        const yOf = v => plotY + plotH - ((v - yMinC) / Math.max(range, 1)) * plotH;
        // Bande "futur" en gris pale.
        const xFuture = plotX + ((i + 1) / (N - 1)) * plotW;
        if (xFuture < plotX + plotW) {
          ctx.fillStyle = 'rgba(150,150,160,.12)';
          ctx.fillRect(xFuture, plotY, plotX + plotW - xFuture, plotH);
        }
        // Axes : trait Y a gauche, trait X en bas.
        ctx.strokeStyle = 'rgba(80,80,90,.6)';
        ctx.lineWidth = 0.8 * sx;
        ctx.beginPath();
        ctx.moveTo(plotX, plotY);
        ctx.lineTo(plotX, plotY + plotH);
        ctx.lineTo(plotX + plotW, plotY + plotH);
        ctx.stroke();
        // Labels axe Y (max en haut, min en bas), aligne a droite, juste apres la zone de plot.
        ctx.font = fsAxis + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillStyle = 'rgba(60,60,70,.85)';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(Math.round(yMaxC), plotX + plotW + 3 * sx, plotY);
        ctx.textBaseline = 'bottom';
        ctx.fillText(Math.round(yMinC), plotX + plotW + 3 * sx, plotY + plotH);
        // Labels axe X : date debut a gauche, date fin a droite (sous l'axe).
        ctx.fillStyle = 'rgba(60,60,70,.75)';
        ctx.textBaseline = 'top';
        const xAxisY = plotY + plotH + 2 * sy;
        const tsFirst = D.timestamps[0] || '';
        const tsLast  = D.timestamps[D.timestamps.length - 1] || '';
        // Format compact : pour Heure '04-04 06:00' -> '04-04' ; pour Jour '2026-04-04' -> '04-04' ;
        // pour Semaine '2026-04-04 -> ...' -> '04-04' ; pour Mois '2026-04' -> '04'.
        const compactX = (s) => {
          if (!s) return '';
          if (D.periode === 'mensuel') return s.split('-')[1] || s;
          // Sinon prend la date 'AAAA-MM-JJ' et garde 'MM-JJ'.
          const datePart = s.split(' ')[0];
          const m = datePart.match(/^\d{4}-(\d{2})-(\d{2})/);
          return m ? (m[1] + '-' + m[2]) : datePart;
        };
        ctx.textAlign = 'left';
        ctx.fillText(compactX(tsFirst), plotX + 1 * sx, xAxisY);
        ctx.textAlign = 'right';
        ctx.fillText(compactX(tsLast), plotX + plotW - 1 * sx, xAxisY);
        // NB : la PLUIE n'est volontairement PAS tracee dans la sparkline. Elle est
        // en mm (pas en m3/s), donc elle exigerait une 3e echelle dans un graphe de
        // 31 px de haut ou l'apport en occupe deja une 2e — illisible. La pluie est
        // affichee en clair sur la ligne texte ci-dessus, et tracee dans la MODALE
        // (panneau dedie sous le graphe des debits), ou la place existe.

        // ---- APPORT NATUREL (cyan, stem-plot, echelle Y PROPRE) ----
        // Trace ensuite : fond de decor du bas, les debits passent dessus.
        //
        // Pourquoi une echelle separee : l'apport et le debit sont tous deux en m3/s,
        // mais leur rapport varie de 0,5 % (Shawinigan) a 97 % (Chute-Allard) selon le
        // site. Sur l'axe partage des debits, l'apport serait ecrase sur la ligne du bas
        // pour la moitie des centrales et confondu avec la courbe de debit pour l'autre.
        // On le normalise donc sur son propre max historique (c.maxApport, calcule au
        // render sur tout l'historique) et on le plafonne a 40 % de la hauteur du plot :
        // il occupe le bas du graphe sans jamais masquer les debits.
        //
        // Consequence assumee : un 2e axe implicite, non etiquete (31 px de tracage ne
        // permettent pas d'etiqueter deux axes). La lecture quantitative existe deja
        // au-dessus, sur la ligne texte 'apport N m3/s' de l'etiquette — la sparkline
        // ne sert ici qu'a montrer le RYTHME des arrivees d'eau.
        //
        // On lit c.apports (brut) et non c.apportsEff (dernier connu reporte) : l'apport
        // est publie 1x/jour, donc apportsEff donnerait 24 barres identiques cote a cote
        // pour une seule mesure reelle. Le stem doit marquer la mesure, pas sa persistance.
        if (c.apports && c.maxApport) {
          const apBandH = plotH * 0.40;
          const apBaseY = plotY + plotH;          // pose sur l'axe X
          ctx.strokeStyle = SERIES.apport.line;
          ctx.lineWidth = stemWidth(plotW, N, 1.3 * sx);
          ctx.beginPath();
          for (let k = 0; k < N; k++) {
            const v = c.apports[k];
            if (v === null || v === undefined || v <= 0) continue;
            const xx = plotX + (k / (N - 1)) * plotW;
            const hh = Math.min(1, v / c.maxApport) * apBandH;
            ctx.moveTo(xx, apBaseY);
            ctx.lineTo(xx, apBaseY - hh);
          }
          ctx.stroke();
        }

        // Trace turbine (vert) puis deverse (bleu) en arriere-plan, puis le
        // debit total (couleur statut) par-dessus pour qu'il reste lisible.
        const drawSeries = (series, color, lw) => {
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = lw;
          let st = false;
          for (let k = 0; k < N; k++) {
            const v = series[k];
            if (v === null) { st = false; continue; }
            const xx = plotX + (k / (N - 1)) * plotW;
            const yy = yOf(v);
            if (!st) { ctx.moveTo(xx, yy); st = true; } else { ctx.lineTo(xx, yy); }
          }
          ctx.stroke();
        };
        drawSeries(c.turbs, SERIES.turbine.line, 1.2 * sx);
        drawSeries(c.devs,  SERIES.deverse.line, 1.2 * sx);

        // Construire les points debit total (en sautant les nulls).
        const pts = [];
        for (let k = 0; k < N; k++) {
          const v = c.debits[k];
          if (v === null) { pts.push(null); }
          else { pts.push({ x: plotX + (k / (N - 1)) * plotW, y: yOf(v) }); }
        }
        // Courbe debit total (couleur du statut, trait epais — dominante).
        ctx.beginPath();
        ctx.strokeStyle = col.s;
        ctx.lineWidth = 1.5 * sx;
        let started = false;
        for (const p of pts) {
          if (p === null) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else { ctx.lineTo(p.x, p.y); }
        }
        ctx.stroke();
        // Point sur la valeur courante (halo blanc + remplissage couleur).
        const cur = pts[i];
        if (cur) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cur.x, cur.y, 3.5 * sx, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = col.s;
          ctx.beginPath(); ctx.arc(cur.x, cur.y, 2.5 * sx, 0, 2 * Math.PI); ctx.fill();
        }
      }
    }
    ctx.restore();  // fin du globalAlpha pour cette etiquette
  }

  // ---- RESERVOIRS ----
  if (D.reservoirs && D.reservoirs.length) {
    const lwr = D.labelWRes * sx;
    const lhrFull = D.labelHRes * sy;
    // 'accent' = teinte du deversement (serie principale des reservoirs), tiree de
    // la palette SERIES pour rester identique au deverse des centrales.
    // 'grayAcc' = neutre, utilise quand la donnee est absente.
    const accent = SERIES.deverse.line;
    const grayAcc = SERIES.neutre.line;

    for (const r of D.reservoirs) {
      if (r.iconX === null || r.iconY === null || r.labelX === null || r.labelY === null) continue;
      const nivEff    = r.niveauxEff[i];
      const nivStale  = r.niveauxStale[i];
      const devEff    = r.devsEff[i];
      const devStale  = r.devsStale[i];
      const apportEff   = r.apportsEff[i];
      const apportStale = r.apportsStale[i];

      // Pluie 24 h glissantes de la zone meteo a laquelle ce reservoir est rattache
      // (champ zoneMeteo dans config/layout). Null si pas de zone, pas de donnee
      // meteo dans cette vue, ou aucune pluie mesuree sur la fenetre.
      let pluie24 = null;
      if (r.zoneMeteo && D.meteo && D.meteo.zones) {
        const rzFr = meteoZoneFrame(i);
        const zi = D.meteo.zones.findIndex(z => z.key === r.zoneMeteo);
        if (rzFr && zi >= 0 && rzFr[zi] && rzFr[zi].p24 != null) {
          pluie24 = rzFr[zi].p24;
        }
      }

      const ix = r.iconX * sx, iy = r.iconY * sy;
      const lx = r.labelX * sx, ly = r.labelY * sy;

      const fsName  = Math.max(11, Math.round(17 * sx));
      const fsTotal = Math.max(10, Math.round(17 * sx));
      const fsIcon  = Math.max(12, Math.round(30 * sx));
      const fsDetail = Math.max(10, Math.round(16 * sx));
      const fontName  = 'bold ' + fsName  + 'px "Segoe UI",Arial,sans-serif';
      const fontTotal = 'bold ' + fsTotal + 'px "Segoe UI",Arial,sans-serif';
      const fontDetail = fsDetail + 'px "Segoe UI",Arial,sans-serif';
      const fsArrow = Math.max(18, Math.round(28 * sx));
      const fsCap   = Math.max(8,  Math.round(13 * sx));  // meme taille que les centrales
      const fsUnit  = Math.max(6,  Math.round(10 * sx));

      // Texte deversement + triangle toggle sur la carte (toujours visible).
      const riIdx = D.reservoirs.indexOf(r);
      const riPos = debitLabelPos('r', riIdx);
      if (devEff !== null && riPos.x !== null && riPos.y !== null) {
        const devMapX = riPos.x * sx, devMapY = riPos.y * sy;
        ctx.save();
        if (devStale) ctx.globalAlpha = 0.45;
        ctx.fillStyle = '#111';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        const devNumTxt = String(devEff);
        ctx.font = 'bold ' + fsCap + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillText(devNumTxt, devMapX, devMapY);
        const devNumW = ctx.measureText(devNumTxt).width;
        ctx.font = 'bold ' + fsUnit + 'px "Segoe UI",Arial,sans-serif';
        const devUnitTxt = ' m³/s';
        ctx.fillText(devUnitTxt, devMapX + devNumW, devMapY + (fsCap - fsUnit));
        const devUnitW = ctx.measureText(devUnitTxt).width;
        const triCharR = isVisibleRes(r) ? '▴' : '▾';
        ctx.font = 'bold ' + fsArrow + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillStyle = isVisibleRes(r) ? '#1a1a2e' : '#555577';
        const triRX = devMapX + devNumW + devUnitW + 1 * sx;
        const triRW = ctx.measureText(triCharR).width;
        ctx.fillText(triCharR, triRX, devMapY + (fsCap - fsArrow) * 0.5);
        ctx.restore();
        mapToggleBoundsRes[riIdx] = {
          x0: triRX / sx, y0: (devMapY - 2*sx) / sy,
          x1: (triRX + triRW + 6*sx) / sx, y1: (devMapY + fsCap + 2*sx) / sy
        };
      } else {
        mapToggleBoundsRes[riIdx] = null;
      }

      // Icone info (i) sur la carte (toujours visible, independante de l'etiquette).
      const fsInfo  = Math.max(14, Math.round(22 * sx));
      const infoSzR = fsInfo;
      const infoImR = iconImgs['info'];
      const infoPosR = infoLabelPos('ir', riIdx);
      if (infoPosR.x !== null && infoImR && infoImR.complete) {
        const infoXR2 = infoPosR.x * sx, infoYR2 = infoPosR.y * sy;
        ctx.drawImage(infoImR, infoXR2 - infoSzR/2, infoYR2 - infoSzR/2, infoSzR, infoSzR);
        infoResBounds[riIdx] = { x: infoPosR.x, y: infoPosR.y, r: (infoSzR * 0.55) / sx };
      } else {
        infoResBounds[riIdx] = null;
      }

      // Icone barrage sur la carte (toujours visible, independante de l'etiquette).
      // Dessinee avant le 'continue' du fondu pour rester affichee etiquette repliee.
      //
      // Ancrage sur debitLabel (le texte "214 m³/s") plutot que sur icon.x/y :
      // les noms de reservoirs sont graves dans le JPG de fond, donc non mesurables,
      // mais debitLabel est cale juste sous le nom et cadre a gauche comme lui.
      // C'est donc le meilleur repere disponible pour centrer l'icone sur le nom.
      // BARR_DX/BARR_DY = reglages globaux en pixels image. Un reservoir peut les
      // surcharger via iconDx/iconDy dans config/layout/<bassin>.json (ex. Mekinac,
      // dont le nom est decale par rapport aux autres dans l'image de fond).
      const BARR_DX = 26;
      const BARR_DY = -42;
      const barrDx = (r.iconDx !== null && r.iconDx !== undefined) ? r.iconDx : BARR_DX;
      const barrDy = (r.iconDy !== null && r.iconDy !== undefined) ? r.iconDy : BARR_DY;
      const barrSzR = Math.max(18, Math.round(30 * sx));
      const barrPos = debitLabelPos('r', riIdx);
      const barrAncX = barrPos.x !== null ? barrPos.x * sx : ix;
      const barrAncY = barrPos.y !== null ? barrPos.y * sy : iy;

      // Teinte d'alerte selon l'intensite du deversement. Les pourcentages et les
      // couleurs sont EXACTEMENT ceux des rosaces de centrales : on appelle la meme
      // fonction ratioColor(), donc une recalibration des seuils suit des deux cotes.
      //   < 40 : bas (vert) | 40-65 : modere (jaune) | 65-85 : ELEVE (orange) | >= 85 : FORT (rouge)
      //
      // Seule difference : le point d'entree. Les reservoirs ne colorent qu'a partir
      // d'ELEVE (65 %), bas et modere restant neutres. L'analyse de l'episode du
      // 3 aout 2026 a montre que les deversements pesent peu sur le debit aval
      // (+115 m3/s de deversement pour +1100 m3/s d'apport naturel) : colorer des
      // 40 % marquait la moitie des reservoirs sans valeur d'information.
      const BARR_SEUIL = 65;   // = borne "eleve" de ratioColor
      let barrTint = null;
      if (devEff !== null && !devStale &&
          r.minDev !== null && r.minDev !== undefined &&
          r.maxDev !== null && r.maxDev !== undefined &&
          (r.maxDev - r.minDev) > 0) {
        // Math.round comme pour les centrales, pour un comportement identique aux bornes.
        const devRatio = Math.round((devEff - r.minDev) / (r.maxDev - r.minDev) * 100);
        if (devRatio >= BARR_SEUIL) barrTint = ratioColor(devRatio).f;   // orange / rouge
      }

      const barrImR = iconImgs['barrage'];

      if (barrImR && barrImR.complete) {
        const bx = barrAncX + barrDx * sx - barrSzR/2;
        const by = barrAncY + barrDy * sy - barrSzR/2;

        // Anneau d'alerte, meme principe et meme epaisseur que celui des rosaces de
        // centrale (lineWidth = 4 * sx) : le lecteur reconnait deja ce code visuel.
        //
        // Pourquoi un anneau et pas une icone aux traits epaissis : l'icone source fait
        // 512 px et est affichee a ~30 px, soit une reduction d'un facteur 17. Une
        // dilatation de 7 px dans le fichier ne donne que ~0,4 px a l'ecran, invisible
        // face aux 4 px de l'anneau des centrales. Il aurait fallu dilater de ~68 px,
        // ce qui empaterait completement le dessin.
        //
        // Rayon = demi-diagonale de l'icone x 1.05 : l'icone est carree, donc ce sont
        // ses COINS qui sont les points les plus eloignes du centre. Se baser sur la
        // demi-largeur les ferait depasser de l'anneau.
        if (barrTint) {
          const ringRB = (barrSzR * Math.SQRT2 / 2) * 1.05;
          ctx.save();
          ctx.beginPath();
          ctx.arc(bx + barrSzR/2, by + barrSzR/2, ringRB, 0, Math.PI * 2);
          ctx.strokeStyle = barrTint;
          ctx.lineWidth = Math.max(2.5, 4 * sx);
          ctx.stroke();
          ctx.restore();
        }

        // L'icone garde ses couleurs d'origine : c'est l'anneau qui porte l'alerte,
        // comme pour les rosaces de centrale. Teinter l'icone en plus serait redondant.
        ctx.save();
        if (devEff === null) ctx.globalAlpha = 0.5;
        ctx.drawImage(barrImR, bx, by, barrSzR, barrSzR);
        ctx.restore();
      }

      // Alpha fondu reservoir.
      const resKey = 'res:' + r.nom;
      const alphaR = labelAlpha[resKey] !== undefined ? labelAlpha[resKey] : (isExpandedRes(r) ? 1 : 0);
      if (alphaR <= 0) continue;

      ctx.save();
      ctx.globalAlpha = alphaR;

      // Ligne de rappel pointillee bleue.
      const lcx = lx + lwr/2, lcy = ly + lhrFull/2;
      const dx = ix - lcx, dy = iy - lcy;
      let ex = lcx, ey = lcy;
