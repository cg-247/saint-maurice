    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('▴', arrowXC, rowYC);
    const sepY = ly + lh*0.1244;
    ctx.beginPath();
    ctx.moveTo(leftX, sepY);
    ctx.lineTo(lx + lwC - 6*sx, sepY);
    ctx.strokeStyle = 'rgba(120,120,120,.55)';
    ctx.lineWidth = 0.8*sx;
    ctx.stroke();

    // Ligne 1 : debit total (primaire) avec gouttes (icone PNG)
    // Si donnee fraiche absente, on affiche la derniere valeur connue avec opacite reduite.
    const debEff = c.debitsEff[i];
    if (debEff !== null) {
      ctx.save();
      if (c.debitsStale[i]) ctx.globalAlpha = 0.45;
      drawLeftSegments(ctx, [
        { icon: 'debit', size: fsIcon },
        { text: debEff + ' m³/s', color: valCol }
      ], leftX, ly + lh*0.1720, fontTotal);
      ctx.restore();
    }

    // Lignes 2-4 + sparkline : toujours visibles (plus de mode compact).
    if (true) {
      // Ligne 2 : detail (engrenage vert + valeur) + (verre + valeur), icones PNG
      const turbEff = c.turbsEff[i];
      const devEff  = c.devsEff[i];
      const turbStale = c.turbsStale[i];
      const devStale  = c.devsStale[i];
      if (turbEff !== null || devEff !== null) {
        const grayCol = 'rgba(110,110,110,.95)';
        ctx.save();
        const lineStale = (turbEff !== null && devEff !== null) ? (turbStale && devStale)
                         : (turbEff !== null ? turbStale : devStale);
        if (lineStale) ctx.globalAlpha = 0.45;
        drawLeftSegments(ctx, [
          { icon: 'turbine-vert', size: fsIcon },
          { text: (turbEff !== null ? turbEff : '-') + '   ', color: grayCol },
          { icon: 'deverse', size: fsIconDev },
          { text: (devEff  !== null ? devEff  : '-'), color: grayCol }
        ], leftX, ly + lh*0.2618, fontDetail);
        ctx.restore();
      }

      // Ligne 3 : MW calcule avec eclair (icone PNG)
      const mwEff = c.mwsEff[i];
      if (mwEff !== null) {
        const fsMwUnit = Math.max(8, Math.round(fsMw / 2));
        const fontMwUnit = fsMwUnit + 'px "Segoe UI",Arial,sans-serif';
        const segs = [
          { icon: 'eclair', size: fsIcon },
          { text: mwEff + ' ',  color: valCol },
          { text: 'MW ',        color: valCol, font: fontMwUnit }
        ];
        if (c.cap_mw !== null) {
          const mwR = Math.round(mwEff / c.cap_mw * 100);
          segs.push({ text: '(' + mwR + ' %)', color: valCol });
        }
        ctx.save();
        if (c.mwsStale[i]) ctx.globalAlpha = 0.45;
        drawLeftSegments(ctx, segs, leftX, ly + lh*0.3604, fontMw);
        ctx.restore();
      }

      // Ligne 3b : INDICATEUR turbine compact = 1 icone (du type) remplie selon la
      // charge globale + "k/N" (groupes en fonction / total). Le detail des N turbines
      // (empilement, charge par groupe) s'ouvre dans un modal au clic (cf. hitTestTurbineIcon).
      const turbForCfg = c.turbsEff[i];
      if (c.nb_groupes && turbForCfg !== null && turbForCfg !== undefined) {
        const agg = turbineAggregate(c, turbForCfg);   // { k, N, pct } combine (gere sous_groupes)
        const fam = c.famille_turbine;
        const name = (fam === 'Francis') ? 'turbine-francis' : 'turbine-kaplan';
        const sz = Math.round(fsIcon * 0.95);   // taille proche des autres icones de l'etiquette
        const yMid = ly + lh*TURB_ROW_FRAC;
        // Dans l'etiquette : icone PLEINE et NETTE (pas de jauge ni teinte verte).
        // La charge par turbine (jauge) est reservee au modal detaille.
        const turbIm = iconImgs[name];
        if (turbIm && turbIm.complete && turbIm.naturalWidth > 0) {
          ctx.save();
          if (c.turbsStale[i]) ctx.globalAlpha = 0.5;
          ctx.drawImage(turbIm, leftX, yMid - sz/2, sz, sz);
          ctx.restore();
        }
        // Texte "k/N" + chevron pour signaler le clic (modal), sur une seule ligne.
        // Meme police que la ligne MW (fontMw / fsMw) pour la coherence visuelle.
        ctx.font = fontMw;
        ctx.fillStyle = '#2a6a2a';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        const lbl = (agg.k > 0) ? (agg.k + '/' + agg.N) : 'arrêt';
        ctx.fillText(lbl, leftX + sz + 6*sx, yMid);
        const wLbl = ctx.measureText(lbl).width;
        ctx.fillStyle = '#5a7a9a';
        ctx.fillText(' ▸', leftX + sz + 6*sx + wLbl, yMid);
      }

      // Ligne 4 : tendance
      const tr = c.trends[i];
      const fontTrend = fsTrend+'px "Segoe UI",Arial,sans-serif';
      const trUnit = D.trendUnit || '6h';
      if (tr === null) {
        drawLeftSegments(ctx, [{ text: '—', color: '#3a3a3a' }], leftX, ly + lh*0.7440, fontTrend);
      } else {
        const sign = tr >= 0 ? '+' : '';
        if (tr > 50) {
          drawLeftSegments(ctx, [
            { text: sign + tr + ' m³/s en ' + trUnit, color: '#a01818' }
          ], leftX, ly + lh*0.7440, fontTrend);
        } else if (tr < -50) {
          drawLeftSegments(ctx, [
            { text: sign + tr + ' m³/s en ' + trUnit, color: '#1a6e1a' }
          ], leftX, ly + lh*0.7440, fontTrend);
        } else {
          const sh = c.stables ? c.stables[i] : null;
          const stTxt = (sh === null || sh === undefined) ? 'stable'
                      : (typeof sh === 'string' ? 'stable depuis ' + sh
                                                : 'stable depuis ' + sh + (D.periode === 'horaire' ? 'h' : (D.periode === 'journalier' ? 'j' : 'sem')));
          drawLeftSegments(ctx, [
            { text: stTxt, color: '#3a3a3a' }
          ], leftX, ly + lh*0.7440, fontTrend);
        }
      }

      // --- Apport naturel + pluie 24 h (memes grandeurs que sur les reservoirs) ---
      // HQ publie 'Apport filtre' pour les centrales aussi (66 sites sur 94), pas
      // seulement pour les reservoirs : c'est l'eau naturelle qui arrive sur le tronçon,
      // hors manoeuvre. Donnee JOURNALIERE, donc affichee telle quelle sans interpolation.
      // La pluie vient de la zone meteo de rattachement (deduite du champ 'ouvrages'
      // de config/metadata/meteo-<bassin>.json).
      const cApport = (c.apportsEff && c.apportsEff[i] !== undefined) ? c.apportsEff[i] : null;
      if (cApport !== null) {
        // Pas de grisage : la valeur est pleinement lisible. Quand elle est reportee
        // d'une publication anterieure (apport = 1 valeur/jour), on ecrit la date de
        // cette publication en petit a cote — plus informatif qu'une opacite reduite,
        // qui signale l'anciennete sans la quantifier.
        const segs = [
          { icon: 'apport', size: fsIconDev },
          { text: cApport + ' m³/s', color: 'rgba(110,110,110,.95)' }
        ];
        if (c.apportsStale && c.apportsStale[i]) {
          const kReal = lastRealIdx(c.apports, i);
          const dTxt = (kReal >= 0 && D.timestamps) ? dateCourte(D.timestamps[kReal]) : '';
          if (dTxt) {
            const fsAge = Math.max(8, Math.round(fsDetail * 0.78));
            segs.push({ text: ' (' + dTxt + ')', color: 'rgba(150,150,150,.95)',
                        font: fsAge + 'px "Segoe UI",Arial,sans-serif' });
          }
        }
        drawLeftSegments(ctx, segs, leftX, ly + lh*0.5476, fontDetail);
      }
      let cPluie24 = null;
      if (c.zoneMeteo && D.meteo && D.meteo.zones && D.meteo.frames && D.meteo.frames[i]) {
        const czi = D.meteo.zones.findIndex(z => z.key === c.zoneMeteo);
        if (czi >= 0 && D.meteo.frames[i][czi] && D.meteo.frames[i][czi].p24 != null) {
          cPluie24 = D.meteo.frames[i][czi].p24;
        }
      }
      if (cPluie24 !== null) {
        drawLeftSegments(ctx, [
          { icon: 'pluie', size: fsIconDev },
          { text: cPluie24 + ' mm/24h', color: 'rgba(110,110,110,.95)' }
        ], leftX, ly + lh*0.6458, fontDetail);
      }

      // Sparkline minimaliste avec axes X (temps) et Y (debit min/max).
      // Reserve de la place pour les labels : 3 caracteres a droite (axe Y), 1 ligne en bas (axe X).
      const sparkH = 45 * sy;
      const sparkBottomMargin = 4 * sy;
      // Espaces reserves pour les labels (en pixels CANVAS, donc deja scales).
      const fsAxis = Math.max(8, Math.round(10 * sx));
      const yLabelW = fsAxis * 2.6;     // largeur reservee a droite pour les chiffres min/max
      const xLabelH = fsAxis * 1.4;     // hauteur reservee en bas pour la date
      // Zone reelle de tracage de la courbe (apres soustraction des marges axes).
      const plotX = lx + barW + 4 * sx;
      const plotY = ly + lh - sparkH - sparkBottomMargin;
      const plotW = lwC - barW - 8 * sx - yLabelW;
      const plotH = sparkH - xLabelH;
      // Min/max combine sur les 3 series (debit total, turbine, deverse) pour
      // que les 3 courbes partagent la meme echelle Y. On part du min/max
      // historique du debit total (qui est souvent dominant) puis on etend
      // si turbine/deverse depassent dans la fenetre courante.
      let yMinC = c.minTotal, yMaxC = c.maxTotal;
      if (yMinC === null || yMaxC === null) { yMinC = 0; yMaxC = 1; }
      for (const v of c.turbs) { if (v === null) continue; if (v < yMinC) yMinC = v; if (v > yMaxC) yMaxC = v; }
      for (const v of c.devs)  { if (v === null) continue; if (v < yMinC) yMinC = v; if (v > yMaxC) yMaxC = v; }
      // Garder 0 comme borne basse si toutes les series sont positives — sinon
      // les courbes deverse (souvent ~0) seraient ecrasees au bas de l'axe.
      if (yMinC > 0) yMinC = 0;
      if (plotH > 6 && plotW > 10 && yMaxC > yMinC) {
        const range = yMaxC - yMinC;
        const yOf = v => plotY + plotH - ((v - yMinC) / Math.max(range, 1)) * plotH;
        // Bande "futur" en gris pale.
        const xFuture = plotX + ((i + 1) / (N - 1)) * plotW;
        if (xFuture < plotX + plotW) {
          ctx.fillStyle = 'rgba(150,150,160,.12)';
          ctx.fillRect(xFuture, plotY, plotX + plotW - xFuture, plotH);
        }
        // Axes : trait Y a gauche, trait X en bas.
        ctx.strokeStyle = 'rgba(80,80,90,.6)';
        ctx.lineWidth = 0.8 * sx;
        ctx.beginPath();
        ctx.moveTo(plotX, plotY);
        ctx.lineTo(plotX, plotY + plotH);
        ctx.lineTo(plotX + plotW, plotY + plotH);
        ctx.stroke();
        // Labels axe Y (max en haut, min en bas), aligne a droite, juste apres la zone de plot.
        ctx.font = fsAxis + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillStyle = 'rgba(60,60,70,.85)';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(Math.round(yMaxC), plotX + plotW + 3 * sx, plotY);
        ctx.textBaseline = 'bottom';
        ctx.fillText(Math.round(yMinC), plotX + plotW + 3 * sx, plotY + plotH);
        // Labels axe X : date debut a gauche, date fin a droite (sous l'axe).
        ctx.fillStyle = 'rgba(60,60,70,.75)';
        ctx.textBaseline = 'top';
        const xAxisY = plotY + plotH + 2 * sy;
        const tsFirst = D.timestamps[0] || '';
        const tsLast  = D.timestamps[D.timestamps.length - 1] || '';
        // Format compact : pour Heure '04-04 06:00' -> '04-04' ; pour Jour '2026-04-04' -> '04-04' ;
        // pour Semaine '2026-04-04 -> ...' -> '04-04' ; pour Mois '2026-04' -> '04'.
        const compactX = (s) => {
          if (!s) return '';
          if (D.periode === 'mensuel') return s.split('-')[1] || s;
          // Sinon prend la date 'AAAA-MM-JJ' et garde 'MM-JJ'.
          const datePart = s.split(' ')[0];
          const m = datePart.match(/^\d{4}-(\d{2})-(\d{2})/);
          return m ? (m[1] + '-' + m[2]) : datePart;
        };
        ctx.textAlign = 'left';
        ctx.fillText(compactX(tsFirst), plotX + 1 * sx, xAxisY);
        ctx.textAlign = 'right';
        ctx.fillText(compactX(tsLast), plotX + plotW - 1 * sx, xAxisY);
        // NB : la PLUIE n'est volontairement PAS tracee dans la sparkline. Elle est
        // en mm (pas en m3/s), donc elle exigerait une 3e echelle dans un graphe de
        // 31 px de haut ou l'apport en occupe deja une 2e — illisible. La pluie est
        // affichee en clair sur la ligne texte ci-dessus, et tracee dans la MODALE
        // (panneau dedie sous le graphe des debits), ou la place existe.

        // ---- APPORT NATUREL (cyan, stem-plot, echelle Y PROPRE) ----
        // Trace ensuite : fond de decor du bas, les debits passent dessus.
        //
        // Pourquoi une echelle separee : l'apport et le debit sont tous deux en m3/s,
        // mais leur rapport varie de 0,5 % (Shawinigan) a 97 % (Chute-Allard) selon le
        // site. Sur l'axe partage des debits, l'apport serait ecrase sur la ligne du bas
        // pour la moitie des centrales et confondu avec la courbe de debit pour l'autre.
        // On le normalise donc sur son propre max historique (c.maxApport, calcule au
        // render sur tout l'historique) et on le plafonne a 40 % de la hauteur du plot :
        // il occupe le bas du graphe sans jamais masquer les debits.
        //
        // Consequence assumee : un 2e axe implicite, non etiquete (31 px de tracage ne
        // permettent pas d'etiqueter deux axes). La lecture quantitative existe deja
        // au-dessus, sur la ligne texte 'apport N m3/s' de l'etiquette — la sparkline
        // ne sert ici qu'a montrer le RYTHME des arrivees d'eau.
        //
        // On lit c.apports (brut) et non c.apportsEff (dernier connu reporte) : l'apport
        // est publie 1x/jour, donc apportsEff donnerait 24 barres identiques cote a cote
        // pour une seule mesure reelle. Le stem doit marquer la mesure, pas sa persistance.
        if (c.apports && c.maxApport) {
          const apBandH = plotH * 0.40;
          const apBaseY = plotY + plotH;          // pose sur l'axe X
          ctx.strokeStyle = SERIES.apport.line;
          ctx.lineWidth = stemWidth(plotW, N, 1.3 * sx);
          ctx.beginPath();
          for (let k = 0; k < N; k++) {
            const v = c.apports[k];
            if (v === null || v === undefined || v <= 0) continue;
            const xx = plotX + (k / (N - 1)) * plotW;
            const hh = Math.min(1, v / c.maxApport) * apBandH;
            ctx.moveTo(xx, apBaseY);
            ctx.lineTo(xx, apBaseY - hh);
          }
          ctx.stroke();
        }

        // Trace turbine (vert) puis deverse (bleu) en arriere-plan, puis le
        // debit total (couleur statut) par-dessus pour qu'il reste lisible.
        const drawSeries = (series, color, lw) => {
          ctx.beginPath();
          ctx.strokeStyle = color;
          ctx.lineWidth = lw;
          let st = false;
          for (let k = 0; k < N; k++) {
            const v = series[k];
            if (v === null) { st = false; continue; }
            const xx = plotX + (k / (N - 1)) * plotW;
            const yy = yOf(v);
            if (!st) { ctx.moveTo(xx, yy); st = true; } else { ctx.lineTo(xx, yy); }
          }
          ctx.stroke();
        };
        drawSeries(c.turbs, SERIES.turbine.line, 1.2 * sx);
        drawSeries(c.devs,  SERIES.deverse.line, 1.2 * sx);

        // Construire les points debit total (en sautant les nulls).
        const pts = [];
        for (let k = 0; k < N; k++) {
          const v = c.debits[k];
          if (v === null) { pts.push(null); }
          else { pts.push({ x: plotX + (k / (N - 1)) * plotW, y: yOf(v) }); }
        }
        // Courbe debit total (couleur du statut, trait epais — dominante).
        ctx.beginPath();
        ctx.strokeStyle = col.s;
        ctx.lineWidth = 1.5 * sx;
        let started = false;
        for (const p of pts) {
          if (p === null) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else { ctx.lineTo(p.x, p.y); }
        }
        ctx.stroke();
        // Point sur la valeur courante (halo blanc + remplissage couleur).
        const cur = pts[i];
        if (cur) {
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(cur.x, cur.y, 3.5 * sx, 0, 2 * Math.PI); ctx.fill();
          ctx.fillStyle = col.s;
          ctx.beginPath(); ctx.arc(cur.x, cur.y, 2.5 * sx, 0, 2 * Math.PI); ctx.fill();
        }
      }
    }
    ctx.restore();  // fin du globalAlpha pour cette etiquette
  }

  // ---- RESERVOIRS ----
  if (D.reservoirs && D.reservoirs.length) {
    const lwr = D.labelWRes * sx;
    const lhrFull = D.labelHRes * sy;
    // 'accent' = teinte du deversement (serie principale des reservoirs), tiree de
    // la palette SERIES pour rester identique au deverse des centrales.
    // 'grayAcc' = neutre, utilise quand la donnee est absente.
    const accent = SERIES.deverse.line;
    const grayAcc = SERIES.neutre.line;

    for (const r of D.reservoirs) {
      if (r.iconX === null || r.iconY === null || r.labelX === null || r.labelY === null) continue;
      const nivEff    = r.niveauxEff[i];
      const nivStale  = r.niveauxStale[i];
      const devEff    = r.devsEff[i];
      const devStale  = r.devsStale[i];
      const apportEff   = r.apportsEff[i];
      const apportStale = r.apportsStale[i];

      // Pluie 24 h glissantes de la zone meteo a laquelle ce reservoir est rattache
      // (champ zoneMeteo dans config/layout). Null si pas de zone, pas de donnee
      // meteo dans cette vue, ou aucune pluie mesuree sur la fenetre.
      let pluie24 = null;
      if (r.zoneMeteo && D.meteo && D.meteo.zones && D.meteo.frames && D.meteo.frames[i]) {
        const zi = D.meteo.zones.findIndex(z => z.key === r.zoneMeteo);
        if (zi >= 0 && D.meteo.frames[i][zi] && D.meteo.frames[i][zi].p24 != null) {
          pluie24 = D.meteo.frames[i][zi].p24;
        }
      }

      const ix = r.iconX * sx, iy = r.iconY * sy;
      const lx = r.labelX * sx, ly = r.labelY * sy;

      const fsName  = Math.max(11, Math.round(17 * sx));
      const fsTotal = Math.max(10, Math.round(17 * sx));
      const fsIcon  = Math.max(12, Math.round(30 * sx));
      const fsDetail = Math.max(10, Math.round(16 * sx));
      const fontName  = 'bold ' + fsName  + 'px "Segoe UI",Arial,sans-serif';
      const fontTotal = 'bold ' + fsTotal + 'px "Segoe UI",Arial,sans-serif';
      const fontDetail = fsDetail + 'px "Segoe UI",Arial,sans-serif';
      const fsArrow = Math.max(18, Math.round(28 * sx));
      const fsCap   = Math.max(8,  Math.round(13 * sx));  // meme taille que les centrales
      const fsUnit  = Math.max(6,  Math.round(10 * sx));

      // Texte deversement + triangle toggle sur la carte (toujours visible).
      const riIdx = D.reservoirs.indexOf(r);
      const riPos = debitLabelPos('r', riIdx);
      if (devEff !== null && riPos.x !== null && riPos.y !== null) {
        const devMapX = riPos.x * sx, devMapY = riPos.y * sy;
        ctx.save();
        if (devStale) ctx.globalAlpha = 0.45;
        ctx.fillStyle = '#111';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        const devNumTxt = String(devEff);
        ctx.font = 'bold ' + fsCap + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillText(devNumTxt, devMapX, devMapY);
        const devNumW = ctx.measureText(devNumTxt).width;
        ctx.font = 'bold ' + fsUnit + 'px "Segoe UI",Arial,sans-serif';
        const devUnitTxt = ' m³/s';
        ctx.fillText(devUnitTxt, devMapX + devNumW, devMapY + (fsCap - fsUnit));
        const devUnitW = ctx.measureText(devUnitTxt).width;
        const triCharR = isVisibleRes(r) ? '▴' : '▾';
        ctx.font = 'bold ' + fsArrow + 'px "Segoe UI",Arial,sans-serif';
        ctx.fillStyle = isVisibleRes(r) ? '#1a1a2e' : '#555577';
        const triRX = devMapX + devNumW + devUnitW + 1 * sx;
        const triRW = ctx.measureText(triCharR).width;
        ctx.fillText(triCharR, triRX, devMapY + (fsCap - fsArrow) * 0.5);
        ctx.restore();
        mapToggleBoundsRes[riIdx] = {
          x0: triRX / sx, y0: (devMapY - 2*sx) / sy,
          x1: (triRX + triRW + 6*sx) / sx, y1: (devMapY + fsCap + 2*sx) / sy
        };
      } else {
        mapToggleBoundsRes[riIdx] = null;
      }

      // Icone info (i) sur la carte (toujours visible, independante de l'etiquette).
      const fsInfo  = Math.max(14, Math.round(22 * sx));
      const infoSzR = fsInfo;
      const infoImR = iconImgs['info'];
      const infoPosR = infoLabelPos('ir', riIdx);
      if (infoPosR.x !== null && infoImR && infoImR.complete) {
        const infoXR2 = infoPosR.x * sx, infoYR2 = infoPosR.y * sy;
        ctx.drawImage(infoImR, infoXR2 - infoSzR/2, infoYR2 - infoSzR/2, infoSzR, infoSzR);
        infoResBounds[riIdx] = { x: infoPosR.x, y: infoPosR.y, r: (infoSzR * 0.55) / sx };
      } else {
        infoResBounds[riIdx] = null;
      }

      // Icone barrage sur la carte (toujours visible, independante de l'etiquette).
      // Dessinee avant le 'continue' du fondu pour rester affichee etiquette repliee.
      //
      // Ancrage sur debitLabel (le texte "214 m³/s") plutot que sur icon.x/y :
      // les noms de reservoirs sont graves dans le JPG de fond, donc non mesurables,
      // mais debitLabel est cale juste sous le nom et cadre a gauche comme lui.
      // C'est donc le meilleur repere disponible pour centrer l'icone sur le nom.
      // BARR_DX/BARR_DY = reglages globaux en pixels image. Un reservoir peut les
      // surcharger via iconDx/iconDy dans config/layout/<bassin>.json (ex. Mekinac,
      // dont le nom est decale par rapport aux autres dans l'image de fond).
      const BARR_DX = 26;
      const BARR_DY = -42;
      const barrDx = (r.iconDx !== null && r.iconDx !== undefined) ? r.iconDx : BARR_DX;
      const barrDy = (r.iconDy !== null && r.iconDy !== undefined) ? r.iconDy : BARR_DY;
      const barrSzR = Math.max(18, Math.round(30 * sx));
      const barrPos = debitLabelPos('r', riIdx);
      const barrAncX = barrPos.x !== null ? barrPos.x * sx : ix;
      const barrAncY = barrPos.y !== null ? barrPos.y * sy : iy;

      // Teinte d'alerte selon l'intensite du deversement. Les pourcentages et les
      // couleurs sont EXACTEMENT ceux des rosaces de centrales : on appelle la meme
      // fonction ratioColor(), donc une recalibration des seuils suit des deux cotes.
      //   < 40 : bas (vert) | 40-65 : modere (jaune) | 65-85 : ELEVE (orange) | >= 85 : FORT (rouge)
      //
      // Seule difference : le point d'entree. Les reservoirs ne colorent qu'a partir
      // d'ELEVE (65 %), bas et modere restant neutres. L'analyse de l'episode du
      // 3 aout 2026 a montre que les deversements pesent peu sur le debit aval
      // (+115 m3/s de deversement pour +1100 m3/s d'apport naturel) : colorer des
      // 40 % marquait la moitie des reservoirs sans valeur d'information.
      const BARR_SEUIL = 65;   // = borne "eleve" de ratioColor
      let barrTint = null;
      if (devEff !== null && !devStale &&
          r.minDev !== null && r.minDev !== undefined &&
          r.maxDev !== null && r.maxDev !== undefined &&
          (r.maxDev - r.minDev) > 0) {
        // Math.round comme pour les centrales, pour un comportement identique aux bornes.
        const devRatio = Math.round((devEff - r.minDev) / (r.maxDev - r.minDev) * 100);
        if (devRatio >= BARR_SEUIL) barrTint = ratioColor(devRatio).f;   // orange / rouge
      }

      const barrImR = iconImgs['barrage'];

      if (barrImR && barrImR.complete) {
        const bx = barrAncX + barrDx * sx - barrSzR/2;
        const by = barrAncY + barrDy * sy - barrSzR/2;

        // Anneau d'alerte, meme principe et meme epaisseur que celui des rosaces de
        // centrale (lineWidth = 4 * sx) : le lecteur reconnait deja ce code visuel.
        //
        // Pourquoi un anneau et pas une icone aux traits epaissis : l'icone source fait
        // 512 px et est affichee a ~30 px, soit une reduction d'un facteur 17. Une
        // dilatation de 7 px dans le fichier ne donne que ~0,4 px a l'ecran, invisible
        // face aux 4 px de l'anneau des centrales. Il aurait fallu dilater de ~68 px,
        // ce qui empaterait completement le dessin.
        //
        // Rayon = demi-diagonale de l'icone x 1.05 : l'icone est carree, donc ce sont
        // ses COINS qui sont les points les plus eloignes du centre. Se baser sur la
        // demi-largeur les ferait depasser de l'anneau.
        if (barrTint) {
          const ringRB = (barrSzR * Math.SQRT2 / 2) * 1.05;
          ctx.save();
          ctx.beginPath();
          ctx.arc(bx + barrSzR/2, by + barrSzR/2, ringRB, 0, Math.PI * 2);
          ctx.strokeStyle = barrTint;
          ctx.lineWidth = Math.max(2.5, 4 * sx);
          ctx.stroke();
          ctx.restore();
        }

        // L'icone garde ses couleurs d'origine : c'est l'anneau qui porte l'alerte,
        // comme pour les rosaces de centrale. Teinter l'icone en plus serait redondant.
        ctx.save();
        if (devEff === null) ctx.globalAlpha = 0.5;
        ctx.drawImage(barrImR, bx, by, barrSzR, barrSzR);
        ctx.restore();
      }

      // Alpha fondu reservoir.
      const resKey = 'res:' + r.nom;
      const alphaR = labelAlpha[resKey] !== undefined ? labelAlpha[resKey] : (isExpandedRes(r) ? 1 : 0);
      if (alphaR <= 0) continue;

      ctx.save();
      ctx.globalAlpha = alphaR;

      // Ligne de rappel pointillee bleue.
      const lcx = lx + lwr/2, lcy = ly + lhrFull/2;
      const dx = ix - lcx, dy = iy - lcy;
      let ex = lcx, ey = lcy;
      if (Math.abs(dx) > Math.abs(dy) * (lwr/lhrFull)) { ex = dx>0 ? lx+lwr : lx; }
      else                                              { ey = dy>0 ? ly+lhrFull : ly; }
      ctx.save();
      ctx.setLineDash([3*sx, 3*sx]);
      ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ix,iy);
      ctx.strokeStyle = devEff === null ? grayAcc : accent;
      ctx.lineWidth = 1.2*sx;
      ctx.stroke();
      ctx.restore();

      // (Pastille remplacee par l'icone barrage dessinee plus haut, hors fondu.)

      // Fond etiquette + bordure (toujours pleine hauteur).
      ctx.fillStyle='#fff';
      ctx.fillRect(lx, ly, lwr, lhrFull);
      ctx.strokeStyle = 'rgba(80,80,80,.6)'; ctx.lineWidth = .9*sx;
      ctx.strokeRect(lx, ly, lwr, lhrFull);

      const barW = 0;
      const leftX = lx + 8 * sx;

      // Nom + icone barrage.
      const fsResIcon = Math.max(12, Math.round(fsName * 1.40));
      drawLeftSegments(ctx, [
        { icon: 'barrage', size: fsResIcon },
        { text: r.nom, color: '#111' }
      ], leftX, ly + lhrFull*0.10, fontName);

      // Triangle fermeture (toujours ▴).
      const arrowXR = lx + lwr - 6*sx;
      const rowYR = ly + lhrFull*0.10;
      ctx.font = 'bold ' + fsArrow + 'px "Segoe UI",Arial,sans-serif';
      ctx.fillStyle = '#1a1a2e';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('▴', arrowXR, rowYR);
      const sepY = ly + lhrFull*0.22;
      ctx.beginPath();
      ctx.moveTo(leftX, sepY);
      ctx.lineTo(lx + lwr - 6*sx, sepY);
      ctx.strokeStyle = 'rgba(120,120,120,.55)';
      ctx.lineWidth = 0.8*sx;
      ctx.stroke();

      // Ligne 1 : deversement.
      if (devEff !== null) {
        const devTxt = devStale ? 'n/d' : (devEff + ' m³/s');
        drawLeftSegments(ctx, [
          { icon: 'deverse', size: fsIcon },
          { text: devTxt, color: '#555' }
        ], leftX, ly + lhrFull*0.281, fontTotal);
      }

      // Lignes 2+ (apport, niveau, sparkline) : toujours visibles (plus de compact).
      if (true) {
        // Ligne 2 : niveau amont.
        if (nivEff !== null) {
          const nivTxt = nivStale ? 'n/d' : (nivEff.toFixed(2) + ' m');
          const nivEndX = drawLeftSegments(ctx, [
            { icon: 'niveau', size: fsIcon },
            { text: nivTxt, color: 'rgba(110,110,110,.95)' }
          ], leftX, ly + lhrFull*RES_ROW_NIVEAU, fontDetail);
          ctx.font = 'bold ' + fsName + 'px "Segoe UI",Arial,sans-serif';
          ctx.fillStyle = '#5a7a9a';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText(' ▸', nivEndX, ly + lhrFull*RES_ROW_NIVEAU);
        }

        // Ligne 3 : apport.
        if (apportEff !== null) {
          // Meme traitement que les centrales : pas de grisage, date de publication
          // en petit quand la valeur est reportee (apport = 1 valeur/jour).
          const segsA = [
            { icon: 'apport', size: fsIcon },
            { text: apportEff + ' m³/s', color: 'rgba(110,110,110,.95)' }
          ];
          if (apportStale) {
            const kRealR = lastRealIdx(r.apports, i);
            const dTxtR = (kRealR >= 0 && D.timestamps) ? dateCourte(D.timestamps[kRealR]) : '';
            if (dTxtR) {
              const fsAgeR = Math.max(8, Math.round(fsDetail * 0.78));
              segsA.push({ text: ' (' + dTxtR + ')', color: 'rgba(150,150,150,.95)',
                           font: fsAgeR + 'px "Segoe UI",Arial,sans-serif' });
            }
          }
          drawLeftSegments(ctx, segsA, leftX, ly + lhrFull*0.582, fontDetail);
        }

        // Ligne 4 : pluie 24 h de la zone meteo de rattachement.
        //
        // Ratios des 4 lignes de donnees (0.281 / 0.432 / 0.582 / 0.732) : repartition
        // reguliere entre le separateur (0.22) et le haut de la sparkline. Celle-ci
        // occupe les 49 derniers px (sparkH 45 + marge 4), soit a partir de 0.785 pour
        // label_height_res = 228. La 4e ligne doit rester sous 0.737 pour que la
        // demi-hauteur du texte n'empiete pas sur le graphe. Si on ajoute une 5e ligne
        // ou qu'on change label_height_res, il faut refaire ce calcul.
        // Distincte de l'apport : la pluie est la CAUSE (mm tombes, mesures au
        // pluviometre, horaire) et l'apport la CONSEQUENCE (m3/s entrant dans le
        // reservoir, publie une fois par jour). La pluie precede donc la reaction
        // du debit de plusieurs heures — c'est ce qui la rend utile en anticipation.
        if (pluie24 !== null) {
          drawLeftSegments(ctx, [
            { icon: 'pluie', size: fsIcon },
            { text: pluie24 + ' mm/24h', color: 'rgba(110,110,110,.95)' }
          ], leftX, ly + lhrFull*0.732, fontDetail);
        }

        // Sparkline DEVERSEMENT (bleu) + APPORT (cyan), meme hauteur que les centrales.
        const sparkH = 45 * sy;
        const sparkBottomMargin = 4 * sy;
        const fsAxis = Math.max(8, Math.round(10 * sx));
        const yLabelW = fsAxis * 2.6;
        const xLabelH = fsAxis * 1.4;
        const plotX = lx + barW + 4 * sx;
        const plotY = ly + lhrFull - sparkH - sparkBottomMargin;
        const plotW = lwr - barW - 8 * sx - yLabelW;
        const plotH = sparkH - xLabelH;
        // Min/max combine (deversement + apport) pour partager l'echelle Y.
        let yMin = Infinity, yMax = -Infinity;
        for (const v of r.devs)    { if (v === null) continue; if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
        for (const v of r.apports) { if (v === null) continue; if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
        if (plotH > 6 && plotW > 10 && isFinite(yMin) && isFinite(yMax) && yMax > yMin) {
          const range = yMax - yMin;
          const yOf = v => plotY + plotH - ((v - yMin) / Math.max(range, 0.0001)) * plotH;
          // Bande "futur" en gris pale.
          const xFuture = plotX + ((i + 1) / (N - 1)) * plotW;
          if (xFuture < plotX + plotW) {
            ctx.fillStyle = 'rgba(150,150,160,.12)';
            ctx.fillRect(xFuture, plotY, plotX + plotW - xFuture, plotH);
          }
          // Axes Y et X.
          ctx.strokeStyle = 'rgba(80,80,90,.6)';
          ctx.lineWidth = 0.8 * sx;
          ctx.beginPath();
          ctx.moveTo(plotX, plotY);
          ctx.lineTo(plotX, plotY + plotH);
          ctx.lineTo(plotX + plotW, plotY + plotH);
          ctx.stroke();
          // Labels Y (max/min combines).
          ctx.font = fsAxis + 'px "Segoe UI",Arial,sans-serif';
          ctx.fillStyle = 'rgba(60,60,70,.85)';
          ctx.textAlign = 'left'; ctx.textBaseline = 'top';
          ctx.fillText(Math.round(yMax), plotX + plotW + 3 * sx, plotY);
          ctx.textBaseline = 'bottom';
          ctx.fillText(Math.round(yMin), plotX + plotW + 3 * sx, plotY + plotH);
          // Labels X (dates compactes).
          ctx.fillStyle = 'rgba(60,60,70,.75)';
          ctx.textBaseline = 'top';
          const xAxisY = plotY + plotH + 2 * sy;
          const tsFirst = D.timestamps[0] || '';
          const tsLast  = D.timestamps[D.timestamps.length - 1] || '';
          const compactX = (s) => {
            if (!s) return '';
            if (D.periode === 'mensuel') return s.split('-')[1] || s;
            const datePart = s.split(' ')[0];
            const m = datePart.match(/^\d{4}-(\d{2})-(\d{2})/);
            return m ? (m[1] + '-' + m[2]) : datePart;
          };
          ctx.textAlign = 'left';
          ctx.fillText(compactX(tsFirst), plotX + 1 * sx, xAxisY);
          ctx.textAlign = 'right';
          ctx.fillText(compactX(tsLast), plotX + plotW - 1 * sx, xAxisY);
          // NB : la PLUIE n'est pas tracee ici (meme raison que pour les centrales :
          // unite en mm, 3e echelle impossible dans 31 px). Elle est sur la ligne
          // texte ci-dessus, et tracee dans la modale reservoir.
          // ---- Courbe APPORT (cyan) — stem-plot ----
          // L'apport est une donnee meteo/journaliere discrete (1 valeur publiee par
          // jour par HQ). On la trace comme un trait vertical de la base (0) jusqu'a
          // la valeur, separement pour chaque mesure. Pas de connexion entre les
          // mesures — sinon le canvas interpole et suggere une evolution continue
          // que la donnee n'a pas. Idem rendu pour les 4 vues (Heure/Jour/Sem/Mois).
          // Trace en arriere-plan pour que la courbe deversement passe par-dessus.
          const y0 = yOf(yMin);   // base de l'echelle (souvent 0)
          ctx.strokeStyle = SERIES.apport.line;
          ctx.lineWidth = stemWidth(plotW, N, 1.3 * sx);
          ctx.beginPath();
          for (let k = 0; k < N; k++) {
            const v = r.apports[k];
            if (v == null || v <= 0) continue;
            const xx = plotX + (k / (N - 1)) * plotW;
            ctx.moveTo(xx, y0);
            ctx.lineTo(xx, yOf(v));
          }
          ctx.stroke();
          // ---- Courbe DEVERSEMENT (bleu, par-dessus) ----
          const ptsDev = [];
          for (let k = 0; k < N; k++) {
            const v = r.devs[k];
            if (v === null) { ptsDev.push(null); }
            else { ptsDev.push({ x: plotX + (k / (N - 1)) * plotW, y: yOf(v) }); }
          }
          ctx.beginPath();
          ctx.strokeStyle = accent;
          ctx.lineWidth = 1.5 * sx;
          let started = false;
          for (const p of ptsDev) {
            if (p === null) { started = false; continue; }
            if (!started) { ctx.moveTo(p.x, p.y); started = true; } else { ctx.lineTo(p.x, p.y); }
          }
          ctx.stroke();
          // Point sur la valeur courante (deversement).
          const cur = ptsDev[i];
          if (cur) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cur.x, cur.y, 3.5 * sx, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = accent;
            ctx.beginPath(); ctx.arc(cur.x, cur.y, 2.5 * sx, 0, 2 * Math.PI); ctx.fill();
          }
        }
      }
      ctx.restore();  // fin globalAlpha etiquette reservoir
    }
  }

}

// Facteur de rasterisation du calque #ov. Le canvas est etire en CSS a 100 % de
// l'image (cf. regle #ov) ; ce qu'on choisit ici, c'est la DENSITE du bitmap.
//
// Deux effets s'additionnent et doivent etre pris en compte :
//  - devicePixelRatio : un ecran Windows a 150 % rend 1 px CSS sur 1,5 px physique.
//    Rasteriser a offsetWidth (px CSS) donnait donc un calque deja sous-echantillonne
//    par rapport au JPG de fond, que le navigateur affiche lui a sa resolution native.
//  - visualViewport.scale : le pinch-zoom (trackpad, ecran tactile) agrandit le
//    viewport VISUEL sans toucher au viewport de mise en page. Ni 100vh ni
//    offsetWidth ne bougent, donc aucun 'resize' classique ne part : le compositeur
//    se contente d'etirer le bitmap deja rasterise -> traits flous et epaissis, alors
//    que le JPG de fond, lui, garde sa nettete. C'est l'ecart visuel signale
//    ("l'image de base ne change pas, ce qui est ajoute grossit et se deforme").
//
// On plafonne le produit : au-dela de 3x le gain visuel est nul et la surface a
// redessiner croit au carre (un 1800x1196 a 4x = 34 Mpx par frame d'animation).
const MAX_RASTER_SCALE = 3;
function rasterScale() {
  const dpr = window.devicePixelRatio || 1;
  const vvs = (window.visualViewport && window.visualViewport.scale) || 1;
  return Math.min(MAX_RASTER_SCALE, dpr * vvs);
}

function resize() {
  const w = img.offsetWidth, h = img.offsetHeight;
  if (!w || !h) return;   // image pas encore mise en page
  const rs = rasterScale();
  const nw = Math.round(w * rs), nh = Math.round(h * rs);
  // Ne rien faire si la geometrie est inchangee : resize() est appele aussi sur
  // les evenements visualViewport (scroll compris), qui sont tres frequents, et
  // reaffecter cv.width efface le canvas meme pour une valeur identique.
  if (cv.width === nw && cv.height === nh) return;
  cv.width  = nw;
  cv.height = nh;
  // Taille CSS explicite : sans elle, un canvas dont le backing store depasse
  // l'espace dispo se laisserait contraindre par max-width et se desalignerait
  // du JPG. On la fixe a la taille exacte de l'image affichee.
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  // draw() derive toute sa geometrie de sx = cv.width / img.naturalWidth : le
  // surechantillonnage se propage donc seul aux polices, icones et epaisseurs.
  // Aucun ctx.scale() a appliquer ici — il ferait double emploi.
  //
  // Changer cv.width/height reinitialise l'etat du contexte : il faut re-armer
  // le filtrage haute qualite, sinon les icones redeviennent floues au resize.
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (D) draw(frame);
}

function go(i) {
  if (!D) return;
  frame = Math.max(0, Math.min(N-1, i));
  slider.value = frame;
  const ts = D.timestamps[frame];
  // Lazy load du mois precedent quand l'utilisateur s'approche du debut en vue Heure.
  // Seuil : dans les 10 % de gauche du slider, ou les 24 premieres frames.
  if (D.periode === 'horaire' && manifest && !isFetching) {
    const threshold = Math.max(24, Math.floor(N * 0.1));
    if (frame < threshold) maybeLoadPreviousMonth();
  }
  tsLabel.textContent = ts;
  // Mini-label au-dessus du slider : utile quand on a defile et que l'entete
  // n'est plus a l'ecran. Affiche la meme info que le titre, en plus discret.
  if (sliderTs) sliderTs.textContent = ts;
  fi.textContent = (frame+1)+' / '+N;
  draw(frame);
  // Bandeau resume general de la riviere (4 vues, change avec la frame).
  // Pas d'en-tete : la date est deja visible dans la barre de controle et le
  // texte commence par une accroche en gras, qui joue le role de titre.
  if (riverBox && D.riverSummaries) {
    const txt = D.riverSummaries[frame];
    riverBox.innerHTML = _renderInlineMarkdown(txt || '');
  }
  if (typeof modalIdx !== 'undefined' && modalIdx >= 0 && typeof drawBigChart === 'function') {
    drawBigChart();
  }
  if (typeof modalResIdx !== 'undefined' && modalResIdx >= 0 && typeof drawBigChartRes === 'function') {
    drawBigChartRes();
  }
  if (typeof modalNivResIdx !== 'undefined' && modalNivResIdx >= 0 && typeof drawBigChartNivRes === 'function') {
    drawBigChartNivRes();
  }
  if (typeof modalTurbIdx !== 'undefined' && modalTurbIdx >= 0 && typeof drawTurbineModal === 'function') {
    drawTurbineModal();
  }
}

// Pinch-zoom : le viewport de MISE EN PAGE ne bouge pas, donc 'resize' ci-dessus
// ne part jamais et le calque #ov resterait rasterise a la densite d'avant zoom
// (etire par le compositeur -> flou, alors que le JPG de fond reste net). On
// reagit donc aussi aux evenements du viewport VISUEL.
//
// Ces evenements arrivent en rafale pendant un pinch ou un defilement zoome, et
// draw() repeint tout le schema : on coalesce sur une frame. resize() sort tot
// si la geometrie n'a pas change, donc un 'scroll' sans zoom ne coute rien.
//
// Le zoom navigateur (Ctrl+molette) modifie lui devicePixelRatio ET le viewport
// de mise en page : il passe par les deux chemins, et le garde d'egalite dans
// resize() evite le double repaint.
(function () {
  var vv = window.visualViewport;
  if (!vv) return;
  var raf = 0;
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(function () { raf = 0; resize(); });
  }
  vv.addEventListener('resize', schedule);
  vv.addEventListener('scroll', schedule);
})();

img.addEventListener('load',()=>{ resize(); if (D) go(N-1); });
if(img.complete) { resize(); if (D) go(N-1); }

// ----- Modal grand graphique au clic sur le sparkline d'une centrale -----
const hoverLayer = document.getElementById('hover-layer');
const modal      = document.getElementById('modal');
const modalCard  = document.getElementById('modal-card');
const modalClose = document.getElementById('modal-close');
const modalTitle = document.getElementById('modal-title');
const modalStats = document.getElementById('modal-stats');
const modalNote  = document.getElementById('modal-note');

const modalInfoEl    = document.getElementById('modal-info');

const modalInfoClose = document.getElementById('modal-info-close');

function imgCoordsFromEv(ev) {
  const r = img.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (img.naturalWidth  / r.width),
    y: (ev.clientY - r.top)  * (img.naturalHeight / r.height)
  };
}
// Renvoie l'index centrale dont le rectangle sparkline contient (xImg, yImg), sinon -1.
// Sparkline = 45 px de haut, 4 px de marge en bas (cf. draw()).
function hitTestSparkline(xImg, yImg) {
  const lh = D.labelH;
  const barW = 12;
  const sparkH = 45;
  const sparkBottomMargin = 4;
  for (let k = 0; k < D.centrales.length; k++) {
    const c = D.centrales[k];
    const lwC = c.labelW || D.labelW;
    const x0 = c.labelX + barW + 4;
    const x1 = c.labelX + lwC - 4;
    const y0 = c.labelY + lh - sparkH - sparkBottomMargin;
    const y1 = c.labelY + lh - sparkBottomMargin;
    if (xImg >= x0 && xImg <= x1 && yImg >= y0 && yImg <= y1) return k;
  }
  return -1;
}
// Zone cliquable de l'indicateur turbine (centrale etendue) -> ouvre le modal turbines.
// Doit rester synchronisee avec le rendu (TURB_ROW_FRAC, leftX, taille).
function hitTestTurbineIcon(xImg, yImg) {
  const lh = D.labelH;
  const barW = 12;
  for (let k = 0; k < D.centrales.length; k++) {
    const c = D.centrales[k];
    if (!isExpanded(c) || !c.nb_groupes) continue;  // garde : etiquette visible + config turbine
    const lwC = c.labelW || D.labelW;
    const x0 = c.labelX + barW + 4;
    const x1 = c.labelX + lwC - 4;             // toute la largeur de la ligne indicateur
    const yMid = c.labelY + lh * TURB_ROW_FRAC;
    const half = lh * 0.085;                    // bande verticale autour de l'indicateur
    if (xImg >= x0 && xImg <= x1 && yImg >= yMid - half && yImg <= yMid + half) return k;
  }
  return -1;
}
// Zone cliquable pour fermer l'etiquette : toute la zone du header (nom).
function hitTestLabelHeader(xImg, yImg) {
  const lh = D.labelH;
  for (let k = 0; k < D.centrales.length; k++) {
    const c = D.centrales[k];
    if (!isVisible(c)) continue;
    const lwC = c.labelW || D.labelW;
    if (xImg >= c.labelX && xImg <= c.labelX + lwC &&
        yImg >= c.labelY && yImg <= c.labelY + lh * 0.20) {
      return k;
    }
  }
  return -1;
}
// Triangle toggle sur la carte (apres m3/s) : ouvre ou ferme l'etiquette.
function hitTestMapToggle(xImg, yImg) {
  for (let k = 0; k < D.centrales.length; k++) {
    const b = mapToggleBounds[k];
    if (!b) continue;
    if (xImg >= b.x0 && xImg <= b.x1 && yImg >= b.y0 && yImg <= b.y1) return k;
  }
  return -1;
}
// Pour les reservoirs : zone TOTALE de l'etiquette (compact ou etendu) cliquable.
// Comme le rectangle change de hauteur selon l'etat, on prend la zone visible reelle.
// Hit-test icone info des centrales (cercle de rayon r en coords image).
function hitTestInfoCentrale(xImg, yImg) {
  if (!D || !D.centrales) return -1;
  for (let k = 0; k < D.centrales.length; k++) {
    const b = infoCentBounds[k];
    if (!b) continue;
    const dx = xImg - b.x, dy = yImg - b.y;
    if (Math.sqrt(dx*dx + dy*dy) <= b.r) return k;
  }
  return -1;
}
// Hit-test icone info des reservoirs.
function hitTestInfoReservoir(xImg, yImg) {
  if (!D || !D.reservoirs) return -1;
  for (let k = 0; k < D.reservoirs.length; k++) {
    const b = infoResBounds[k];
    if (!b) continue;
    const dx = xImg - b.x, dy = yImg - b.y;
    if (Math.sqrt(dx*dx + dy*dy) <= b.r) return k;
  }
  return -1;
}

function hitTestReservoirHeader(xImg, yImg) {
  if (!D.reservoirs) return -1;
  const lwr = D.labelWRes, lhrFull = D.labelHRes;
  for (let k = 0; k < D.reservoirs.length; k++) {
    const r = D.reservoirs[k];
    if (r.iconX === null || r.iconY === null || r.labelX === null || r.labelY === null) continue;
    if (!isVisibleRes(r)) continue;
    const hitH = lhrFull * 0.22;
    if (xImg >= r.labelX && xImg <= r.labelX + lwr &&
        yImg >= r.labelY && yImg <= r.labelY + hitH) {
      return k;
    }
  }
  return -1;
}
// Triangle toggle sur la carte pour les reservoirs.
function hitTestMapToggleRes(xImg, yImg) {
  for (let k = 0; k < D.reservoirs.length; k++) {
    const b = mapToggleBoundsRes[k];
    if (!b) continue;
    if (xImg >= b.x0 && xImg <= b.x1 && yImg >= b.y0 && yImg <= b.y1) return k;
  }
  return -1;
}
// Zone sparkline d'un reservoir etendu (45 px de haut, 4 px marge bas).
function hitTestReservoirNiveauArrow(xImg, yImg) {
  if (!D.reservoirs) return -1;
  const lwr = D.labelWRes, lhrFull = D.labelHRes;
  for (let k = 0; k < D.reservoirs.length; k++) {
    const r = D.reservoirs[k];
    if (r.labelX === null || r.labelY === null) continue;
    if (!isExpandedRes(r)) continue;
    if (r.minNiv == null) continue;
    // Doit rester synchronise avec le ratio de dessin de la ligne niveau
    // (RES_ROW_NIVEAU). Le ratio etait reste a 0.47 alors que le dessin est passe
    // a 0.432 lors de l'ajout de la ligne pluie : la zone cliquable etait decalee
    // de ~9 px vers le bas, donc pas centree sur le chiffre ni sur le triangle.
    const lineY = r.labelY + lhrFull * RES_ROW_NIVEAU;
    const x0 = r.labelX, x1 = r.labelX + lwr;
    const y0 = lineY - 11, y1 = lineY + 11;
    if (xImg >= x0 && xImg <= x1 && yImg >= y0 && yImg <= y1) return k;
  }
  return -1;
}
function hitTestReservoirSparkline(xImg, yImg) {
  if (!D.reservoirs) return -1;
  const lwr = D.labelWRes, lhrFull = D.labelHRes;
  const sparkH = 45;
  const sparkBottomMargin = 4;
  for (let k = 0; k < D.reservoirs.length; k++) {
    const r = D.reservoirs[k];
    if (r.iconX === null || r.iconY === null || r.labelX === null || r.labelY === null) continue;
    if (!isExpandedRes(r)) continue;   // sparkline visible seulement si etendu
    const x0 = r.labelX + 4;
    const x1 = r.labelX + lwr - 4;
    const y0 = r.labelY + lhrFull - sparkH - sparkBottomMargin;
    const y1 = r.labelY + lhrFull - sparkBottomMargin;
    if (xImg >= x0 && xImg <= x1 && yImg >= y0 && yImg <= y1) return k;
  }
  return -1;
}
hoverLayer.addEventListener('mousemove', (ev)=>{
  // Survol d'un lien d'habillage joignable : curseur main, comme un vrai lien.
  // Meme regle que pour le clic (voir linkAtClientPoint) : ignore si une
  // etiquette depliee recouvre le lien.
  if (linkAtClientPoint(ev)) { hoverLayer.style.cursor = 'pointer'; return; }
  if (!D) { hoverLayer.style.cursor = 'default'; return; }
  const { x, y } = imgCoordsFromEv(ev);
  let cursor = 'default';
  if (hitTestInfoCentrale(x, y) !== -1)            { cursor = 'pointer'; }
  else if (hitTestInfoReservoir(x, y) !== -1)      { cursor = 'pointer'; }
  else if (hitTestMapToggle(x, y) !== -1)          { cursor = 'pointer'; }
  else if (hitTestMapToggleRes(x, y) !== -1)       { cursor = 'pointer'; }
  else if (hitTestLabelHeader(x, y) !== -1)        { cursor = 'pointer'; }
  else if (hitTestReservoirHeader(x, y) !== -1)    { cursor = 'pointer'; }
  else if (hitTestTurbineIcon(x, y) !== -1)      { cursor = 'pointer'; }

// --- Clics sur les liens d'habillage ("Mobile", "Details & sources", ...) ---
// #hover-layer couvre tout le schema a z-index 5 et passe devant ces liens
// (z-index 1 depuis 2.11.2), qui restaient visibles mais inertes.
// Corriger ca par z-index obligerait a remonter leur bloc parent au-dessus du
// canvas, ce qui ramenerait le bug que 2.11.2 a corrige : le disclaimer
// repasserait devant le detail deplie de Grand-Mere. On garde donc l'ordre de
// peinture intact et on reroute uniquement le CLIC : si les coordonnees du
// pointeur tombent sur un <a> de l'habillage, on l'active et on s'arrete la.
// (hitTest en geometrie plutot qu'en elementFromPoint : la couche masque les
// liens, donc elementFromPoint retournerait toujours #hover-layer.)

// visuellement le lien (le canvas est peint par-dessus l'habillage depuis

function linkAtClientPoint(ev) {

    if (r.width === 0 || r.height === 0) continue;
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
      // Lien recouvert par une etiquette depliee -> on laisse passer au schema.
      const p = imgCoordsFromEv(ev);

hoverLayer.addEventListener('click', (ev)=>{

  // "if (!D)" pour que les liens marchent meme si les donnees n'ont pas charge.
  const a = linkAtClientPoint(ev);

    ev.preventDefault();

    a.click();

  if (kInfoR !== -1) { openInfoModalReservoir(kInfoR); return; }

  // Priorite 0b : clic sur le triangle toggle sur la carte -> ouvre ou ferme l'etiquette.
  const kToggle = hitTestMapToggle(x, y);
  if (kToggle !== -1) {
    const c = D.centrales[kToggle];
    setLabelState(c, isVisible(c) ? 'hidden' : 'expanded');
    return;
  }
  // Priorite 1 : clic sur l'en-tete de l'etiquette -> ferme l'etiquette.
  const kHeader = hitTestLabelHeader(x, y);
  if (kHeader !== -1) {
    const c = D.centrales[kHeader];
    setLabelState(c, 'hidden');
    return;
  }
  // Priorite 1b : clic sur le triangle toggle reservoir sur la carte.
  const kToggleRes = hitTestMapToggleRes(x, y);
  if (kToggleRes !== -1) {
    setLabelState(D.reservoirs[kToggleRes], isVisibleRes(D.reservoirs[kToggleRes]) ? 'hidden' : 'expanded');

  const kRes = hitTestReservoirHeader(x, y);

    return;

  const kTurb = hitTestTurbineIcon(x, y);
  if (kTurb !== -1) { openTurbineModal(kTurb); return; }
  // Priorite 3b : clic sur triangle niveau d'un reservoir etendu -> modal niveau.
  const kNivArrow = hitTestReservoirNiveauArrow(x, y);
  if (kNivArrow !== -1) { openModalNivRes(kNivArrow); return; }

  const kSpark = hitTestSparkline(x, y);

function fmtInt(v) { return (v == null) ? '—' : Math.round(v); }
function computeStats(arr) {
  let mn = Infinity, mx = -Infinity, sum = 0, n = 0;
  for (const v of arr) { if (v == null) continue; if (v < mn) mn = v; if (v > mx) mx = v; sum += v; n++; }
  return { min: n ? mn : null, max: n ? mx : null, avg: n ? sum / n : null, n };
}
// Choisit, parmi les 4 coins d'une zone de trace, celui ou un bloc (boxW x boxH)
// masque le MOINS de donnees. Les series a eviter sont passees en `series` (tableau
// de tableaux de valeurs) avec leur convertisseur Y.
//
// Une legende posee dans un coin fixe finit toujours par tomber sur la courbe : selon
// la centrale et la periode affichee, les donnees occupent le haut (crue), le bas
// (etiage) ou la droite (pic recent). D'ou le choix a chaque rendu.
//
// `avoidX` (optionnel) : abscisse a fuir a score egal — typiquement le curseur, pour
// ne pas masquer la valeur que l'utilisateur est en train de lire.
function pickCorner(zone, boxW, boxH, series, yOf, xOf, avoidX) {
  const { x0, y0, w, h } = zone;
  // 6 positions candidates : les 4 coins + les 2 CENTRES (haut et bas). Sur un
  // hydrogramme, le centre haut est souvent la zone la plus degagee (les courbes
  // culminent a la crue puis redescendent, laissant un creux au milieu) et les coins
  // forcaient la legende contre une courbe alors qu'il y avait de la place au centre.
  const cx0 = x0 + (w - boxW) / 2;
  const cands = [
    { x: x0 + 4,             y: y0 + 4 },
    { x: cx0,                y: y0 + 4 },
    { x: x0 + w - boxW - 4,  y: y0 + 4 },
    { x: x0 + 4,             y: y0 + h - boxH - 4 },
    { x: cx0,                y: y0 + h - boxH - 4 },
    { x: x0 + w - boxW - 4,  y: y0 + h - boxH - 4 }
  ];
  const margin = 8;
  for (const co of cands) {
    let score = 0;
    const bx0 = co.x - margin, bx1 = co.x + boxW + margin;
    const by0 = co.y - margin, by1 = co.y + boxH + margin;
    for (const serie of series) {
      if (!serie) continue;
      for (let i = 0; i < serie.length; i++) {
        const v = serie[i];
        if (v == null) continue;
        const px = xOf(i), py = yOf(v);
        if (px >= bx0 && px <= bx1 && py >= by0 && py <= by1) score++;
      }
    }
    co.score = score;
    co.distX = (avoidX == null) ? 0 : Math.abs((co.x + boxW / 2) - avoidX);
  }
  // Score croissant (moins de chevauchement), puis le plus loin de avoidX.
  cands.sort((a, b) => (a.score - b.score) || (b.distX - a.distX));
  return cands[0];
}

// Dessine le panneau PLUIE (1/3 du bas) d'une modale : cadre, axe Y, titre, legende,
// barres, curseur. Factorise parce que les deux modales (centrale et reservoir) ont
// exactement le meme panneau — le dupliquer garantissait qu'elles divergent.
//
// Orientation NORMALE (barres du bas vers le haut, 0 en bas) : l'inversion facon
// hyetogramme n'a plus de raison d'etre depuis que la pluie a son cadre propre — elle
// servait a la distinguer des debits quand les deux partageaient un seul graphe.
function drawRainPanel(cx, pl, geo) {
  const { pad, innerW, rainTop, rainInnerH, xCur, xFut, frame, N } = geo;
  if (!pl || rainInnerH <= 10) return;
  const topY = rainTop;                    // haut du cadre = valeur max
  const base = rainTop + rainInnerH;       // bas du cadre = 0, origine des barres

  // Bande "futur", alignee sur celle du panneau des debits.
  if (xFut < pad.l + innerW) {
    cx.fillStyle = 'rgba(150,150,160,.18)';
    cx.fillRect(xFut, topY, pad.l + innerW - xFut, rainInnerH);
  }
  // Cadre haut/bas.
  cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
  cx.beginPath();
  cx.moveTo(pad.l, topY); cx.lineTo(pad.l + innerW, topY);
  cx.moveTo(pad.l, base); cx.lineTo(pad.l + innerW, base);
  cx.stroke();
  // Axe Y : max en haut, 0 en bas. Le label du max est descendu d'un cran
  // (textBaseline 'top' au lieu de 'middle') pour ne pas chevaucher le titre,
  // qui occupe la ligne juste au-dessus du cadre.
  cx.fillStyle = '#666'; cx.font = '11px "Segoe UI",Arial';
  cx.textAlign = 'right';
  cx.textBaseline = 'top';
  cx.fillText(pl.max + ' mm', pad.l - 6, topY + 1);
  cx.textBaseline = 'middle';
  cx.fillText('0 mm', pad.l - 6, base);
  // Titre du panneau, au-dessus du cadre (hors zone de trace).
  cx.fillStyle = '#1a1a2e'; cx.font = 'bold 12px "Segoe UI",Arial';
  cx.textAlign = 'left'; cx.textBaseline = 'bottom';
  cx.fillText('Pluie (mm/24h)', pad.l, topY - 5);
  // Barres, du bas vers le haut.
  cx.strokeStyle = SERIES.pluie.line;
  cx.lineWidth = stemWidth(innerW, N, 3);
  cx.beginPath();
  for (let i = 0; i < N; i++) {
    const v = pl.vals[i];
    if (v == null || v <= 0) continue;
    const xx = pad.l + (i / geo.xSpan) * innerW;
    cx.moveTo(xx, base);
    cx.lineTo(xx, base - Math.min(1, v / pl.max) * rainInnerH);
  }
  cx.stroke();
  // Curseur, prolonge depuis le panneau du haut pour lier les deux lectures.
  cx.strokeStyle = 'rgba(200,40,40,.85)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(xCur, topY); cx.lineTo(xCur, base); cx.stroke();
  // Valeur courante, si averse en cours.
  const pCur = pl.vals[frame];
  if (pCur != null && pCur > 0) {
    const yP = base - Math.min(1, pCur / pl.max) * rainInnerH;
    cx.fillStyle = SERIES.pluie.solid;
    cx.beginPath(); cx.arc(xCur, yP, 3.5, 0, 2 * Math.PI); cx.fill();
    cx.font = 'bold 11px "Segoe UI",Arial';
    const pTxt = pCur + ' mm';
    const fitsR = (xCur + 6 + cx.measureText(pTxt).width) <= (pad.l + innerW - 2);
    cx.textAlign = fitsR ? 'left' : 'right';
    cx.textBaseline = 'bottom';
    cx.fillText(pTxt, xCur + (fitsR ? 6 : -6), yP - 3);
  }
  // Legende encadree, meme format que celle du panneau des debits. Coin choisi
  // dynamiquement pour ne pas se poser sur les barres (une averse forte peut occuper
  // n'importe quelle partie de la fenetre selon la periode affichee).
  cx.font = '12px "Segoe UI",Arial';
  const lbTxt = 'Pluie 24 h';
  const swW = 22, swH = 7, padX = 8, padY = 6;
  const bw = cx.measureText(lbTxt).width + swW + 8 + 2 * padX;
  const bh = 18 + 2 * padY;
  const rainYOf = v => base - Math.min(1, v / pl.max) * rainInnerH;
  const rainXOf = i => pad.l + (i / geo.xSpan) * innerW;
  const co = pickCorner({ x0: pad.l, y0: topY, w: innerW, h: rainInnerH },
                        bw, bh, [pl.vals], rainYOf, rainXOf, xCur);
  cx.fillStyle = 'rgba(255,255,255,.88)';
  cx.fillRect(co.x, co.y, bw, bh);
  cx.strokeStyle = '#dde'; cx.lineWidth = 1;
  cx.strokeRect(co.x, co.y, bw, bh);
  cx.fillStyle = SERIES.pluie.line;
  cx.fillRect(co.x + padX, co.y + padY + 3, swW, swH);
  cx.fillStyle = '#333';
  cx.textAlign = 'left'; cx.textBaseline = 'top';
  cx.fillText(lbTxt, co.x + padX + swW + 8, co.y + padY);
}

function drawBigChart() {
  if (modalIdx < 0) return;
  const c = D.centrales[modalIdx];
  const arr = c.debits;
  const w = modalCv.width  = modalCv.clientWidth;
  const h = modalCv.height = modalCv.clientHeight;
  const cx = modalCtx;
  // Marge droite elargie quand on a un apport a tracer : contrairement a la
  // sparkline (31 px de haut, aucune place), la modale peut etiqueter un 2e axe —
  // donc on le fait ici, c'est l'endroit ou l'apport se lit quantitativement.
  const hasApport = !!(c.apports && c.maxApport);
  const pad = { l: 60, r: hasApport ? 62 : 20, t: 10, b: 36 };
  cx.clearRect(0, 0, w, h);

  // --- Deux panneaux empiles : DEBITS (2/3) en haut, PLUIE (1/3) en bas ---
  // La pluie est en mm, les debits en m3/s : les superposer imposerait une 2e echelle
  // dans le meme cadre, avec un risque de lecture croisee. Deux panneaux distincts
  // partageant le meme axe X laissent chaque grandeur sur une echelle sans ambiguite,
  // tout en gardant la comparaison temporelle immediate — c'est la convention des
  // hydrogrammes (debit) surmontes d'un hyetogramme (pluie) en hydrologie.
  const plMod = pluieSerie(c.zoneMeteo);
  const rainH = plMod ? 0.33 : 0;         // part de la hauteur utile pour la pluie
  const rainGap = plMod ? 34 : 0;         // espace entre panneaux (titre du panneau bas)

  // Echelle Y : max combine des 3 series (debit total, turbine, deverse) +
  // tampon ~5 % pour laisser de la place aux labels en haut.
  let yMaxRaw = (c.maxTotal && c.maxTotal > 0 ? c.maxTotal : 1);
  for (const v of c.turbs) { if (v != null && v > yMaxRaw) yMaxRaw = v; }
  for (const v of c.devs)  { if (v != null && v > yMaxRaw) yMaxRaw = v; }
  const yMax = yMaxRaw + Math.max(50, yMaxRaw * 0.05);
  // Echelle X : N frames + 3h "tampon" a droite pour laisser de la place aux labels
  const xPad = 3; // heures vides a droite
  const xSpan = (N - 1) + xPad;
  const innerW = w - pad.l - pad.r;
  // Hauteur utile totale, puis repartition 2/3 - 1/3 (moins l'espace inter-panneaux).
  const totalH = h - pad.t - pad.b;
  const innerH = Math.round((totalH - rainGap) * (1 - rainH));
  const rainTop = pad.t + innerH + rainGap;
  const rainInnerH = Math.max(0, totalH - innerH - rainGap);
  const xOf = i => pad.l + (i / xSpan) * innerW;
  const yOf = v => pad.t + (1 - v / yMax) * innerH;

  // Bande "futur" (i+1 .. N-1) en gris pale
  const xFut = xOf(frame + 1);
  if (xFut < pad.l + innerW) {
    cx.fillStyle = 'rgba(150,150,160,.18)';
    cx.fillRect(xFut, pad.t, pad.l + innerW - xFut, innerH);
  }

  // Grille horizontale (5 lignes) + ticks Y
  cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
  cx.fillStyle = '#666'; cx.font = '11px "Segoe UI",Arial';
  cx.textAlign = 'right'; cx.textBaseline = 'middle';
  for (let g = 0; g <= 5; g++) {
    const y = pad.t + (g / 5) * innerH;
    cx.beginPath(); cx.moveTo(pad.l, y); cx.lineTo(pad.l + innerW, y); cx.stroke();
    cx.fillText(Math.round(yMax * (1 - g / 5)) + ' m³/s', pad.l - 6, y);
  }
  // Titre du panneau (symetrique de celui du panneau pluie en bas). Affiche seulement
  // quand le 2e panneau existe : sans lui il n'y a rien a distinguer, et le titre de
  // la modale dit deja "<centrale> — debit total".
  if (plMod) {
    cx.fillStyle = '#1a1a2e'; cx.font = 'bold 12px "Segoe UI",Arial';
    cx.textAlign = 'left'; cx.textBaseline = 'top';
    cx.fillText('Débits (m³/s)', pad.l, pad.t + 2);
  }

  // Ticks X : 5 dates reparties. Les deux extremes sont alignes sur le bord
  // (left/right) au lieu d'etre centres : le dernier libelle porte le suffixe
  // '— jusqu'a HH:mm' en journee partielle et debordait hors du canvas.
  cx.fillStyle = '#666';
  cx.textBaseline = 'top';
  for (let g = 0; g <= 4; g++) {
    const i = Math.round((g / 4) * (N - 1));
    cx.textAlign = (g === 0) ? 'left' : (g === 4 ? 'right' : 'center');
    const xt = (g === 0) ? pad.l : (g === 4 ? pad.l + innerW : xOf(i));
    cx.fillText(D.timestamps[i], xt, h - pad.b + 6);
  }

  // Couleur de la courbe = couleur statut courant (basee sur ratio min/max)
  let ratio = null;
  const dCur = arr[frame];
  if (dCur != null && c.minTotal != null && c.maxTotal != null && (c.maxTotal - c.minTotal) > 0) {
    ratio = (dCur - c.minTotal) / (c.maxTotal - c.minTotal) * 100;
  }
  let stroke = '#555';
  if (ratio != null) {
    if (ratio < 25) stroke = '#1a6e2a';
    else if (ratio < 50) stroke = '#7a6200';
    else if (ratio < 75) stroke = '#7a3a00';
    else stroke = '#6a0000';
  }

  // Couleurs des series, tirees de la palette centrale (cf. SERIES).
  const turbCol = SERIES.turbine.line;
  const devCol  = SERIES.deverse.line;
  const drawSeriesBig = (series, color, lw) => {
    cx.beginPath();
    cx.strokeStyle = color; cx.lineWidth = lw;
    let st = false;
    for (let i = 0; i < N; i++) {
      const v = series[i]; if (v == null) { st = false; continue; }
      const xx = xOf(i), yy = yOf(v);
      if (!st) { cx.moveTo(xx, yy); st = true; } else { cx.lineTo(xx, yy); }
    }
    cx.stroke();
  };
  // ---- APPORT NATUREL (cyan, stem-plot, 2e axe a DROITE) ----
  // Meme raison qu'en sparkline : echelle propre, parce que le rapport apport/debit
  // va de 0,5 % a 97 % selon la centrale. Ici on a la place d'etiqueter cet axe,
  // donc la valeur est lisible (contrairement a la sparkline, volontairement muette).
  // Bande basse a 40 % de la hauteur pour ne pas masquer les debits.
  // c.apports (brut) et non apportsEff : 1 barre = 1 mesure reelle publiee.
  if (hasApport) {
    const apBandH = innerH * 0.40;
    const apBaseY = pad.t + innerH;
    const apOf = v => apBaseY - Math.min(1, v / c.maxApport) * apBandH;
    cx.strokeStyle = SERIES.apport.line; cx.lineWidth = stemWidth(innerW, N, 2.2);
    cx.beginPath();
    for (let i = 0; i < N; i++) {
      const v = c.apports[i];
      if (v == null || v <= 0) continue;
      const xx = xOf(i);
      cx.moveTo(xx, apBaseY);
      cx.lineTo(xx, apOf(v));
    }
    cx.stroke();
    // Axe droit : 0 en bas, maxApport au sommet de la bande. Teinte de la serie
    // (et non le gris des ticks de gauche) pour que le rattachement soit evident.
    cx.fillStyle = SERIES.apport.solid;
    cx.font = '11px "Segoe UI",Arial';
    cx.textAlign = 'left'; cx.textBaseline = 'middle';
    const axX = pad.l + innerW + 6;
    cx.fillText('0', axX, apBaseY);
    cx.fillText(Math.round(c.maxApport) + ' m³/s', axX, apOf(c.maxApport));
    // Graduation a mi-bande, pour donner l'echelle sans surcharger.
    cx.fillText(Math.round(c.maxApport / 2), axX, apOf(c.maxApport / 2));
  }

  // Trace turbine puis deverse en arriere-plan, puis le debit total dominant par-dessus.
  drawSeriesBig(c.turbs, turbCol, 2.2);
  drawSeriesBig(c.devs,  devCol,  2.2);

  // Courbe debit total (couleur statut, dominante)
  cx.beginPath();
  cx.strokeStyle = stroke; cx.lineWidth = 2.6;
  let started = false;
  for (let i = 0; i < N; i++) {
    const v = arr[i]; if (v == null) { started = false; continue; }
    const xx = xOf(i), yy = yOf(v);
    if (!started) { cx.moveTo(xx, yy); started = true; } else { cx.lineTo(xx, yy); }
  }
  cx.stroke();

  // Curseur vertical = frame courant
  const xCur = xOf(frame);
  cx.strokeStyle = 'rgba(200,40,40,.85)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(xCur, pad.t); cx.lineTo(xCur, pad.t + innerH); cx.stroke();
  // Point sur la courbe
  if (dCur != null) {
    cx.fillStyle = stroke;
    cx.beginPath(); cx.arc(xCur, yOf(dCur), 4, 0, 2 * Math.PI); cx.fill();
    cx.fillStyle = '#222'; cx.font = 'bold 12px "Segoe UI",Arial';
    const valTxt = Math.round(dCur) + ' m³/s';
    const txtW = cx.measureText(valTxt).width;
    // Si le label depasse a droite, on le met a gauche du point
    const fitsRight = (xCur + 6 + txtW) <= (pad.l + innerW - 2);
    cx.textAlign = fitsRight ? 'left' : 'right';
    cx.textBaseline = 'bottom';
    cx.fillText(valTxt, xCur + (fitsRight ? 6 : -6), yOf(dCur) - 4);
  }

  // ===== PANNEAU DU BAS : PLUIE 24 h (1/3 de la hauteur) =====
  // Hyetogramme classique : barres verticales depuis le HAUT du panneau, l'usage en
  // hydrologie (la pluie tombe du ciel). Axe X partage avec le panneau des debits,
  // donc une averse se lit directement au-dessus de la reaction du debit qu'elle
  // provoque 24-48 h plus tard (cf. point 29 de BESOIN.md).
  drawRainPanel(cx, plMod, { pad, innerW, rainTop, rainInnerH, xCur, xFut, frame, N, xSpan });

  // Legende dynamique : choisir le coin (HG/HD/BG/BD) qui chevauche le moins
  // la courbe debit total. Mesure les dimensions du bloc, puis compte combien
  // de points de la courbe tombent dans chaque coin candidat.
  const lgGapY = 18, lgSwW = 22, lgSwH = 7, lgPadX = 8, lgPadY = 6;
  const noteTxt = 'Débit total = turbiné + déversé.';
  cx.font = '12px "Segoe UI",Arial';
  const wTotal = cx.measureText('Débit total').width;
  const wTurb  = cx.measureText('Turbiné').width;
  const wDev   = cx.measureText('Déversé').width;
  // Entrees conditionnelles : apport (66 sites HQ sur 94) et pluie (selon zone meteo).
  const lgApTxt = SERIES.apport.label + ' (échelle de droite)';
  const wAp    = hasApport ? cx.measureText(lgApTxt).width : 0;
  // La pluie a son propre panneau titre en bas : pas besoin d'une entree de legende
  // ici, qui ferait doublon. On garde uniquement les series du panneau des debits.
  const wPl = 0;
  cx.font = 'italic 11px "Segoe UI",Arial';
  const wNote  = cx.measureText(noteTxt).width;
  const lgNbLignes = 3 + (hasApport ? 1 : 0);
  const lgInnerW = Math.max(wTotal, wTurb, wDev, wAp, wPl) + lgSwW + 8;
  const boxW = Math.max(lgInnerW, wNote) + 2 * lgPadX;
  const boxH = lgNbLignes * lgGapY + 14 + 2 * lgPadY; // lignes legende + 1 ligne note
  // Coin choisi dynamiquement pour masquer le moins de donnees possible.
  // On teste les 3 series du panneau (total, turbine, deverse) et non le seul debit
  // total comme avant : depuis que le deverse est passe en bleu vif, une legende
  // posee "au-dessus du total" pouvait tomber en plein sur la courbe de deversement.
  // Le titre du panneau occupant le coin haut-gauche quand il y a 2 panneaux, la
  // zone de recherche demarre plus bas dans ce cas.
  const lgTop = plMod ? pad.t + 18 : pad.t;
  const best = pickCorner({ x0: pad.l, y0: lgTop, w: innerW, h: pad.t + innerH - lgTop },
                          boxW, boxH, [c.debits, c.turbs, c.devs], yOf, xOf, xCur);
  // Fond opaque sous le bloc : le choix du coin minimise le chevauchement mais ne
  // l'elimine pas (avec 4-5 series, tous les coins sont parfois traverses). Sans
  // fond, le texte de la legende se melait aux courbes et devenait illisible.
  cx.fillStyle = 'rgba(255,255,255,.88)';
  cx.fillRect(best.x, best.y, boxW, boxH);
  cx.strokeStyle = '#dde'; cx.lineWidth = 1;
  cx.strokeRect(best.x, best.y, boxW, boxH);
  // Tracage du bloc.
  const lgX = best.x + lgPadX;
  const lgY0 = best.y + lgPadY;
  const lgTxtX = lgX + lgSwW + 8;
  cx.font = '12px "Segoe UI",Arial';
  cx.textAlign = 'left'; cx.textBaseline = 'top';
  // Lignes numerotees dynamiquement : apport et pluie sont optionnels selon le site.
  const lgItems = [
    { col: stroke,  txt: 'Débit total' },
    { col: turbCol, txt: 'Turbiné' },
    { col: devCol,  txt: 'Déversé' }
  ];
  if (hasApport) lgItems.push({ col: SERIES.apport.line, txt: lgApTxt });
  lgItems.forEach((it, li) => {
    cx.fillStyle = it.col; cx.fillRect(lgX, lgY0 + li*lgGapY + 3, lgSwW, lgSwH);
    cx.fillStyle = '#333'; cx.fillText(it.txt, lgTxtX, lgY0 + li*lgGapY);
  });
  cx.font = 'italic 11px "Segoe UI",Arial';
  cx.fillStyle = '#666';
  cx.fillText(noteTxt, lgX, lgY0 + lgNbLignes*lgGapY + 2);
}

// ===== MODALE INFO CEHQ (centrales et reservoirs) =====
function buildCehqTable(src) {
  const tdL = 'style="padding:3px 14px 3px 0;color:#555;font-size:13px;white-space:nowrap;vertical-align:top"';
  const tdV = 'style="padding:3px 18px 3px 0;font-weight:600;color:#1a1a2e;font-size:13px;vertical-align:top"';
  const tdNote = 'style="padding:1px 0 5px;color:#888;font-size:11px;font-style:italic" colspan="4"';
  const secH = 'style="font-size:13px;font-weight:700;color:#1a1a2e;' +
               'padding:20px 0 5px;border-top:2px solid #ddd"';
  const row2 = (l1, v1, l2, v2) =>
    '<tr><td ' + tdL + '>' + l1 + '</td><td ' + tdV + '>' + v1 + '</td>' +
         '<td ' + tdL + '>' + l2 + '</td><td ' + tdV + '>' + v2 + '</td></tr>';
  const row1 = (l1, v1) =>
    '<tr><td ' + tdL + '>' + l1 + '</td><td ' + tdV + ' colspan="3">' + v1 + '</td></tr>';
  const noteRow = (txt) => '<tr><td ' + tdNote + '>' + txt + '</td></tr>';
  const secRow = (label) => '<tr><td ' + secH + ' colspan="4">' + label + '</td></tr>';
  const fmtMillion = v => v != null ? (v / 1e6).toFixed(1).replace('.', ',') + ' Mm³' : '—';
  const fmtHa = v => v != null ? v.toLocaleString('fr-CA') + ' ha' : '—';
  const fmtKm2 = v => v != null ? v.toLocaleString('fr-CA') + ' km²' : '—';
  const fmtM = v => v != null ? String(v).replace('.', ',') + ' m' : '—';
  const fmtStr = v => v || '—';
  const classeDesc = {
    'A': 'Grande hauteur ou grande capacité',
    'B': 'Hauteur ou capacité importante',
    'C': 'Hauteur ou capacité modérée',
    'D': 'Petit ouvrage'
  };
  const conseqDesc = {
    'Tres important': 'Pertes de vies probables, dommages majeurs en aval',
    'Considerable':   'Pertes de vies possibles, dommages significatifs',
    'Important':      'Pertes de vies peu probables, dommages notables',
    'Moyen':          'Aucune perte de vie anticipée, dommages limités'
  };
  const entries = src.barrages ? src.barrages : [src];
  const multi = entries.length > 1;
  // Helpers pills (définis une seule fois hors du forEach)
  const classeKeys = ['A','B','C','D'];
  const classeColors = { 'A':'#b91c1c', 'B':'#c2410c', 'C':'#0369a1', 'D':'#15803d' };
  const conseqKeys = ['Tres important','Considerable','Important','Moyen'];
  const conseqLabels = { 'Tres important':'Très important', 'Considerable':'Considérable', 'Important':'Important', 'Moyen':'Moyen' };
  const conseqColors = { 'Tres important':'#7f1d1d', 'Considerable':'#b91c1c', 'Important':'#d97706', 'Moyen':'#15803d' };
  const pillBase = 'display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;margin:2px 3px 2px 0;';
  const pillActive = (col) => pillBase + 'background:' + col + ';color:#fff;';
  const pillInactive = pillBase + 'background:#f0f0f0;color:#aaa;';
  const pillRow = (label, pills, note) =>
    '<tr><td style="padding:12px 10px 4px 0;color:#555;font-size:13px;white-space:nowrap;vertical-align:middle">' + label + '</td>' +
    '<td colspan="3" style="padding:10px 0 6px">' + pills +
    (note ? '<div style="font-size:11px;color:#666;font-style:italic;margin-top:2px">' + note + '</div>' : '') +
    '</td></tr>';
  // Génère le contenu d'un panneau barrage
  function barragePanel(b) {
    const annee = b.annee_construction != null
      ? (b.annee_modification != null ? b.annee_construction + ' (mod. ' + b.annee_modification + ')' : String(b.annee_construction))
      : '—';
    const municipalite = b.municipalite || src.municipalite || null;
    const classeVal = b.classe || '';
    const conseqVal = b.niveau_consequences || '';
    let classePills = '';
    classeKeys.forEach(function(k) {
      const col = classeColors[k] || '#555';
      classePills += '<span style="' + (k === classeVal ? pillActive(col) : pillInactive) + '">' + k + '</span>';
    });
    let conseqPills = '';
    conseqKeys.forEach(function(k) {
      const col = conseqColors[k] || '#555';
      const label = conseqLabels[k] || k;
      conseqPills += '<span style="' + (k === conseqVal ? pillActive(col) : pillInactive) + '">' + label + '</span>';
    });
    return '<table style="border-collapse:collapse;width:100%">' +
      secRow('Général') +
      row2('Année construction', annee, 'Municipalité', fmtStr(municipalite)) +

      pillRow('Classe', classePills, classeDesc[classeVal] || '') +
      pillRow('Conséquences rupture', conseqPills, conseqDesc[conseqVal] || '') +
      '<tr><td colspan="4" style="padding-bottom:10px"></td></tr>' +
      secRow('Technique') +
      row2('Hauteur du barrage', fmtM(b.hauteur_aval_m), 'Largeur du barrage', fmtM(b.longueur_m)) +
      (b.hauteur_retenue_m != null ? row1('Hauteur retenue', fmtM(b.hauteur_retenue_m)) : '') +
      row2('Bassin versant', fmtKm2(b.sup_bassin_km2), 'Superficie réservoir', fmtHa(b.sup_reservoir_ha)) +
      row1('Capacité retenue', fmtMillion(b.capacite_retenue_m3)) +
      '</table>';
  }
  // ID unique pour isoler les onglets (évite collisions si deux modales ouvertes)
  const tabNs = 'cehq-tab-' + Math.random().toString(36).slice(2, 7);
  let html = '';
  if (!multi) {
    html = barragePanel(entries[0]);
  } else {
    // Barre d'onglets
    const tabBarStyle = 'display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid #e5e7eb;padding-bottom:0;';
    const tabActiveStyle = 'padding:7px 16px;border-radius:6px 6px 0 0;font-size:13px;font-weight:700;cursor:pointer;background:#1a1a2e;color:#fff;border:none;margin-bottom:-2px;';
    const tabInactiveStyle = 'padding:7px 16px;border-radius:6px 6px 0 0;font-size:13px;font-weight:600;cursor:pointer;background:#f3f4f6;color:#555;border:none;margin-bottom:-2px;';
    let tabs = '<div style="' + tabBarStyle + '">';
    let panels = '';
    entries.forEach(function(b, bi) {
      const label = b.nom_barrage || ('Barrage ' + (bi + 1));
      const panelId = tabNs + '-panel-' + bi;
      const btnId   = tabNs + '-btn-'   + bi;
      const isFirst = bi === 0;
      tabs += '<button id="' + btnId + '" onclick="(function(){'  +
        'var ns=\'' + tabNs + '\',n=' + entries.length + ';' +
        'for(var i=0;i<n;i++){' +
          'document.getElementById(ns+\'-panel-\'+i).style.display=i===' + bi + '?\'block\':\'none\';' +
          'document.getElementById(ns+\'-btn-\'+i).style.cssText=i===' + bi + '?\'' + tabActiveStyle.replace(/'/g, "\\'") + '\':\'' + tabInactiveStyle.replace(/'/g, "\\'") + '\';}' +
        '})()" style="' + (isFirst ? tabActiveStyle : tabInactiveStyle) + '">' + label + '</button>';
      panels += '<div id="' + panelId + '" style="display:' + (isFirst ? 'block' : 'none') + '">' + barragePanel(b) + '</div>';
    });
    tabs += '</div>';
    html = tabs + panels;
  }
  return html;
}
