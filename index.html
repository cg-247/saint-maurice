<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Saint-Maurice</title>
<script>
// Redirection mobile : si la largeur de l'ecran fait <=768px, on bascule vers la page
// mobile. L'utilisateur peut forcer le desktop via le lien "Version bureau" depuis
// la page mobile, qui ajoute ?desktop=1 -> on memorise ce choix dans localStorage et
// on ne redirige plus.
//
// Detection mobile : on calcule la largeur en CSS pixels independamment du navigateur.
// - iOS Safari sans <meta viewport> : innerWidth = 980 (virtuel), screen.width = CSS pixels reels.
// - Android Chrome sans <meta viewport> : screen.width = pixels physiques (ex. 1080 sur Galaxy S),
//   il faut diviser par devicePixelRatio pour obtenir les CSS pixels (ex. 1080/2.625 = 411).
// On prend le minimum des deux methodes apres normalisation -> fiable sur iOS et Android.
(function () {
  try {
    var params = new URLSearchParams(location.search);
    var STORE = 'hq-prefer-desktop';
    if (params.has('desktop')) {
      localStorage.setItem(STORE, '1');
      return; // pas de redirection cette fois, et plus jamais (tant que la clef existe)
    }
    if (localStorage.getItem(STORE) === '1') return;
    var dpr = window.devicePixelRatio || 1;
    var sw  = (screen.width  || 9999) / dpr;
    var iw  = (window.innerWidth || 9999) / dpr;
    var w   = Math.min(sw, iw);
    if (w > 768) return;
    // En local on a animation-centrales.html (mobile = animation-mobile.html),
    // sur GitHub Pages on a index.html (mobile = mobile.html). Le serveur local
    // sert animation-centrales.html aussi via "/" (path qui se termine par "/"),
    // d'ou la double condition.
    var p = location.pathname;
    var isLocal = p.endsWith('animation-centrales.html') || (location.hostname === 'localhost' && p.endsWith('/'));
    location.replace(isLocal ? 'animation-mobile.html' : 'mobile.html');
  } catch (e) { /* localStorage indisponible (mode prive ?) : pas de redirection */ }
})();

// Zone sure iOS (encoche + "home indicator") pour la version BUREAU consultee sur
// telephone. Probleme corrige : la barre de controle est en position:fixed
// bottom:0, donc elle tombe dans la bande de ~34 px que iOS reserve au home
// indicator. Dans cette bande, le systeme capte les swipes en priorite -> le
// slider "bloque" ou, pire, le geste ferme l'application.
//
// Les CSS env(safe-area-inset-*) ne renvoient une valeur non nulle QUE si le
// viewport declare viewport-fit=cover. Or on ne veut pas de <meta viewport>
// statique : sans lui, iOS Safari utilise une largeur virtuelle de 980 px, ce qui
// permet justement de pincer pour zoomer et de se deplacer dans le schema. Ajouter
// width=device-width casserait la mise en page bureau.
//
// Solution : on injecte le meta seulement sur ecran tactile, en reprenant
// explicitement la largeur virtuelle de 980 px (au lieu de device-width) et en
// autorisant le zoom jusqu'a 10x. On garde donc le comportement actuel, avec
// viewport-fit=cover en plus pour activer les env().
(function () {
  try {
    if (document.querySelector('meta[name="viewport"]')) return;
    // Critere = TAILLE D'ECRAN, pas type de pointeur. Les media queries de
    // pointage sont peu fiables : un poste sans ecran tactile peut rapporter
    // any-pointer:coarse et maxTouchPoints>0 (cas observe sur ce projet en Edge
    // headless), ce qui appliquerait le mode tactile au vrai bureau.
    //
    // On exige que les DEUX mesures soient petites, et non leur minimum : en
    // environnement de test, screen.width peut etre une valeur fictive figee
    // (800 en Edge headless quelle que soit la fenetre) alors que innerWidth
    // reflete la vraie largeur. Un seul signal bas ne doit donc pas suffire.
    // Sur un vrai telephone les deux sont bas ; sur un bureau, innerWidth est
    // large et desamorce l'injection.
    var dpr2 = window.devicePixelRatio || 1;
    var wScr = (screen.width || 9999) / dpr2;
    var wWin = (window.innerWidth || 9999) / dpr2;
    if (wScr > 900 || wWin > 1100) return;
    var m = document.createElement('meta');
    m.name = 'viewport';
    m.content = 'width=980, initial-scale=1, minimum-scale=0.2, maximum-scale=10, user-scalable=yes, viewport-fit=cover';
    document.head.appendChild(m);
  } catch (e) { /* pas de viewport dynamique : on retombe sur bottom:0 */ }
})();
</script>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">

<meta name="theme-color" content="#1a1a2e">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Hauteur reelle de la barre de controle, mesuree en JS (voir syncCtrlHeight).
   Valeur de repli = hauteur nominale sur une seule ligne. La barre est en
   position:fixed, donc hors flux : sans reservation explicite, le contenu centre
   par justify-content passe DESSOUS et se fait masquer. */
:root{--ctrl-h:48px}
/* padding-bottom (et non une soustraction sur height) : le centrage vertical
   s'opere ainsi dans l'espace RESTANT, au-dessus de la barre. C'est ce qui
   manquait — l'image etait centree sur toute la hauteur de fenetre, donc son bas
   passait derriere la barre des que sa taille etait limitee par la LARGEUR et
   non par max-height (cas le plus courant en 16:9, ou la reserve de 54px de
   #img ne s'appliquait tout simplement jamais). */
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Segoe UI",Arial,sans-serif;color:#eee;padding:0 0 var(--ctrl-h);height:100vh;overflow:hidden}
/* L'en-tete ne compte plus que 2 lignes ("Saint-Maurice" + date) depuis le
   retrait de la periode et du sous-titre "Debit max atteint sur la periode".
   Le decalage negatif de 1cm servait a compenser la 3e ligne : on le reduit
   pour que le bloc descende a la place qu'occupait le sous-titre. */
#titlebox{position:absolute;top:calc(7.4% - 0.35cm);left:50%;transform:translateX(-50%);
          text-align:center;color:#1a1a2e;pointer-events:none;z-index:2;width:90%}
#titlebox h1{font-size:clamp(16px, 1.55vw, 28px);letter-spacing:.3px;font-weight:700}
#titlebox #ts{font-size:clamp(13px, 1.22vw, 22px);color:#000;font-weight:600;margin-top:4px;min-height:24px}
/* max-height:100% + min-height:0 : donne a #img une reference de hauteur a
   laquelle se contraindre. Sans ca, un inline-block s'etire a la taille de son
   contenu et le max-height:100% de l'image n'a rien a quoi se rapporter.
   min-height:0 leve la taille minimale automatique des enfants flex, qui sinon
   empeche #wrap de se reduire sous la hauteur naturelle de l'image. */
#wrap{position:relative;display:inline-block;max-width:100%;max-height:100%;min-height:0}
/* La reserve pour la barre est desormais portee par le padding-bottom du body :
   la hauteur disponible ici est donc deja nette de la barre, et max-height:100%
   suffit. (Avant : calc(100vh - 54px), constante en dur qui ne correspondait plus
   a la hauteur reelle et, surtout, restait sans effet quand l'image etait limitee
   par la largeur.) */
#img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hover-layer{position:absolute;top:0;left:0;width:100%;height:100%;cursor:default;z-index:3}
#modal{position:fixed;inset:0;background:rgba(10,10,20,.78);z-index:100;
       display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal.open{display:flex}
#modal-card{position:relative;background:#fff;border-radius:8px;padding:18px 22px 22px;
            width:min(90vw, 1200px);height:min(78vh, 700px);
            box-shadow:0 10px 40px rgba(0,0,0,.55);display:flex;flex-direction:column}
#modal-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
#modal-stats{font-size:15px;color:#333;margin-bottom:8px}
#modal-canvas{flex:1 1 auto;display:block;width:100%;cursor:crosshair}
#modal-note{font-size:12px;color:#888;text-align:left;margin-top:8px;line-height:1.4}
#modal-note:empty{display:none}
#modal-note b{color:#555}
#modal-table{font-size:13px;margin-bottom:6px}
#modal-close{position:absolute;top:8px;right:12px;background:transparent;border:none;
             font-size:24px;color:#666;cursor:pointer;line-height:1;padding:4px 10px}
#modal-close:hover{color:#000}
#modal-info{position:fixed;inset:0;background:rgba(10,10,20,.78);z-index:101;
            display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal-info.open{display:flex}
#modal-info-card{position:relative;background:#fff;border-radius:8px;padding:20px 24px 24px;
                 width:min(90vw,640px);max-height:min(80vh,700px);overflow-y:auto;
                 box-shadow:0 10px 40px rgba(0,0,0,.55)}
#modal-info-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:14px;padding-right:32px}
#modal-info-close{position:absolute;top:8px;right:12px;background:transparent;border:none;
                  font-size:24px;color:#666;cursor:pointer;line-height:1;padding:4px 10px}
#modal-info-close:hover{color:#000}
#modal-info-body{font-size:13px}
/* Barre de controle collee en bas. Sur iPhone (et Android a barre gestuelle), les
   ~34 px du bas sont reserves au "home indicator" : iOS y capte les swipes en
   priorite, donc un slider pose a bottom:0 se retrouve dans une zone ou le geste
   ferme l'app au lieu de deplacer le curseur. On decale donc la barre de la
   hauteur de la zone sure (env(safe-area-inset-bottom), 0 sur desktop) et on
   ajoute un padding-bottom equivalent pour que le fond couvre toujours le bord.
   Necessite viewport-fit=cover, ajoute dynamiquement en JS (voir plus bas) : on
   ne met PAS de <meta viewport> statique, sinon on perdrait le pinch-zoom qui
   sert a consulter la version bureau sur telephone. */
#ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
      position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(26,26,46,.92);
      padding:8px 12px;border-top:1px solid #2a2a4e;box-shadow:0 -2px 8px rgba(0,0,0,.4);
      backdrop-filter:blur(4px)}
/* Bouton Actualiser : en PWA installee (display:standalone) il n'y a plus de
   barre d'adresse, donc plus de bouton recharger du navigateur. Ce bouton
   rejoue exactement autoRefresh() (re-fetch manifest + donnees si changement).
   L'etat .busy fait tourner le chevron pendant le re-fetch ; .ok/.same donnent
   un retour immediat meme quand rien n'a change (sinon un clic sans effet
   visible passe pour un bug). */
#btnRefresh .ico{display:inline-block}
#btnRefresh.busy{opacity:.75;pointer-events:none}
#btnRefresh.busy .ico{animation:spinRefresh .8s linear infinite}
@keyframes spinRefresh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  #btnRefresh.busy .ico{animation:none}
}
/* Toast de retour : discret, au-dessus de la barre, disparait tout seul. */
#refreshToast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);
  z-index:30;background:rgba(26,26,46,.96);color:#e8e8f0;border:1px solid #2a2a4e;
  border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
#refreshToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#refreshToast.err{border-color:#7a3a3a;color:#ffbdbd}
/* Mode "barre ancree au viewport visuel" (voir pinVisualViewport plus bas).
   Active uniquement sur telephone : la barre passe en position absolue dans le
   document et c'est le JS qui la repositionne a chaque zoom/scroll, car
   position:fixed suit le viewport de MISE EN PAGE sur iOS Safari, pas le
   viewport VISUEL -> des qu'on pince pour zoomer, la barre sort de l'ecran.
   transform-origin bottom left + scale compensent le zoom pour que la barre
   garde une taille lisible a l'ecran quel que soit le facteur. */
body.vv-pinned #ctrl{position:absolute;left:0;right:auto;bottom:auto;
                     transform-origin:0 100%;will-change:transform,top,width}
/* Meme compensation de zoom, mais pour le BUREAU (pinch trackpad / ecran tactile).
   Volontairement distincte de .vv-pinned, qui embarque en plus une mise en page
   compacte propre au telephone (nowrap, masquage de #speed / #fi / #btnRefresh) :
   l'appliquer au bureau ferait disparaitre le selecteur de vue.
   Ici on ne touche QUE a l'echelle et au positionnement — la barre garde tous ses
   controles et sa taille apparente a l'ecran quel que soit le facteur de zoom. */
body.vv-zoomfix #ctrl{position:absolute;left:0;right:auto;bottom:auto;
                      transform-origin:0 100%;will-change:transform,top,width}
@supports (padding: env(safe-area-inset-bottom)) {
  #ctrl{bottom:env(safe-area-inset-bottom);
        padding-bottom:calc(8px + env(safe-area-inset-bottom) * .35)}
  /* En mode epingle, c'est GAP_SCREEN_PX (en JS) qui degage la zone gestuelle :
     le padding lie a la safe-area ferait double emploi et epaissirait la barre. */
  body.vv-pinned #ctrl{padding-bottom:8px}
}
/* Taille de police stable en mode epingle : la barre est mise a l'echelle
   inverse du zoom par le JS, donc les tailles CSS doivent etre fixes en px et
   non dependre du viewport (sinon l'apparence change entre portrait et paysage,
   ou la largeur virtuelle est rendue a un facteur different). */
body.vv-pinned #ctrl{font-size:13px}
/* Barre compacte en mode epingle : elle est superposee au schema, donc elle doit
   rester basse. Sans ca, le slider fixe a 360 px force le retour a la ligne des
   7 controles et la barre atteint ~200 px de haut sur un ecran de 390 px.
   Le slider devient fluide et occupe la largeur restante. On garde tous les
   boutons de navigation (c'est le geste principal : reculer dans les dates) mais
   on reduit "Debut" et "Maintenant" a leur seul pictogramme, et on retire le
   selecteur de vitesse, sans objet quand on navigue au doigt. Le mini-horodatage
   reste : c'est lui qui indique la date pendant qu'on deplace le curseur. */
body.vv-pinned #ctrl{gap:6px;padding:6px 8px;flex-wrap:nowrap}
body.vv-pinned #sliderWrap{flex:1 1 auto;min-width:0}
body.vv-pinned #slider{width:100%;min-width:0}
body.vv-pinned #ctrl button{padding:8px 10px;font-size:14px;white-space:nowrap}
body.vv-pinned #fi{display:none}
body.vv-pinned #speed{display:none}
/* Pas de bouton Actualiser en mode epingle : sur telephone c'est le
   pull-to-refresh qui remplit ce role, et la barre manque de place. */
body.vv-pinned #btnRefresh{display:none}
/* Boutons extremes reduits a leur pictogramme : le libelle est remplace en JS
   (le texte et l'icone sont dans le meme noeud, un simple font-size:0 masquerait
   aussi le pictogramme). Voir pinVisualViewport. */
/* Cible tactile des controles : 44 px est le minimum recommande par Apple. Le
   slider a 16 px de haut etait difficile a saisir, surtout pres du bord bas.
   touch-action:none sur le slider : sans ca, iOS interprete le glissement
   horizontal comme un pan/scroll de la page et le curseur ne suit pas le doigt.
   Condition combinee (pointeur grossier ET petit ecran ET fenetre etroite) :
   any-pointer:coarse seul se declenche sur des postes de bureau sans ecran
   tactile. On ajoute max-width (largeur du viewport) en plus de max-device-width
   (largeur de l'ecran) car cette derniere peut etre une valeur fictive figee
   dans certains environnements. Le seuil de 1100px tient compte de la largeur
   virtuelle de 980 px qu'iOS applique en l'absence de meta viewport. */
@media (any-pointer: coarse) and (max-device-width: 900px) and (max-width: 1100px) {
  #slider{height:28px;touch-action:none}
  #ctrl button{padding:9px 18px}
  #ctrl select{padding:8px 10px}
  #ctrl{gap:12px}
}
button{padding:5px 16px;font-size:13px;border-radius:6px;border:none;cursor:pointer;
       background:#4a6fa5;color:#fff;transition:background .15s}
button:hover{background:#5a82bf}
#sliderWrap{display:flex;flex-direction:column;align-items:center;gap:2px}
#sliderTs{font-size:11px;color:#aab;line-height:1;min-height:13px;letter-spacing:.2px}
#slider{width:360px;cursor:pointer;accent-color:#4a9aff}
select{padding:4px 8px;font-size:12px;border-radius:5px;background:#2a2a4e;
       color:#eee;border:1px solid #555;cursor:pointer}
#fi{font-size:12px;color:#778;min-width:80px;text-align:right}
/* Disclaimer : pose en bas-gauche, sous #generatedAt, avec 1 ligne vide entre
   les deux. #generatedAt est ancre a 85.4% (meme hauteur que la 1re ligne des
   faits saillants) ; on descend donc de 2 lignes (sa ligne + 1 vide) a
   line-height 1.3, soit ~1.7% de la hauteur de #wrap par ligne : 85.4 + 3.5 = 88.9%
   (valeur ajustee a la mesure pour tomber sur exactement 1 ligne vide).
   font-size : repli seulement, la taille reelle est imposee en JS (= lgFs, la
   taille du texte courant de la legende). Idem pour #generatedAt plus bas. */
#disclaimer{position:absolute;left:1.5%;top:88.9%;
            font-size:clamp(11px, 0.95vw, 17px);color:#1a1a2e;text-align:left;pointer-events:auto;z-index:4;
            max-width:50%;line-height:1.3;font-style:italic;opacity:.78}
#disclaimer a{color:#1a3060;text-decoration:underline;font-weight:600}
#disclaimer a:hover{color:#0a1a40}
#topRight{position:absolute;right:1.5%;top:1%;
          font-size:clamp(11px, 0.95vw, 17px);color:#1a1a2e;text-align:right;pointer-events:auto;z-index:4;
          line-height:1.3;font-style:italic;opacity:.78}
#topRight a{color:#1a3060;text-decoration:underline;font-weight:600}
#topRight a:hover{color:#0a1a40}
/* Bandeau resume riviere : ancre par le HAUT, juste au-dessus de DISTANCE.
   Plus d'en-tete date : le texte occupe directement la place, donc on remonte
   l'ancrage de la hauteur qu'occupait le titre (86% -> 88%). Remonte ensuite
   de 2 lignes de texte (~1.3vh chacune a ce corps et line-height 1.4) pour
   degager le bas du schema : 88% -> 85.4%. Le bord gauche s'aligne
   approximativement avec la fermeture du mot "DISTANCE (km)".
   font-size : valeur de repli seulement. La taille reelle est imposee en JS
   (riverBox.style.fontSize = lgFs) pour coller exactement au texte de la
   legende, qui suit l'echelle de l'image et non la largeur de fenetre. */
#riverSummary{position:absolute;right:1.5%;top:85.4%;
              width:42%;z-index:4;
              color:#1a1a2e;
              font-size:clamp(11px, 0.92vw, 17px);line-height:1.4;text-align:left}
#riverSummary b,#riverSummary strong{color:#000;font-weight:700}
/* Date de derniere mise a jour, posee en bas-gauche du schema (dans #wrap).
   Alignee sur la 1re ligne du #riverSummary (bas-droite, top:85.4%) pour que les
   deux blocs demarrent a la meme hauteur de part et d'autre du schema.
   font-size : repli seulement, taille reelle imposee en JS (= lgFs). */
#generatedAt{position:absolute;left:1.5%;top:85.4%;
             font-size:clamp(13px, 1.1vw, 20px);color:#0a0a1a;
             font-family:"Segoe UI",Arial,sans-serif;font-style:italic;
             pointer-events:none;z-index:4;opacity:1;letter-spacing:.2px;font-weight:500}
/* Le canvas passe AU-DESSUS des textes d'habillage (disclaimer, "Mise a jour",
   bloc haut-droite) : les etiquettes de centrales et de reservoirs y sont
   dessinees, et une etiquette depliee en bas du schema se retrouvait masquee par
   le disclaimer. Ces textes restent donc toujours visibles, mais en arriere-plan.
   Le bandeau de faits saillants reste au-dessus : c'est du contenu de lecture,
   pas de l'habillage, et il occupe un coin ou aucune etiquette ne s'ouvre.
   #hover-layer reste au-dessus du canvas pour capter les clics.
   Ordre final dans #wrap : image (0) < habillage (1) < titre (2) < canvas (3)
   < couche de clics (5) < faits saillants (6). */
#ov{z-index:3}
#hover-layer{z-index:5}
#disclaimer,#generatedAt,#topRight{z-index:1}
#riverSummary{z-index:6}
/* ...MAIS les LIENS de ces blocs doivent rester cliquables. #hover-layer couvre
   100 % du schema pour capter les clics sur les centrales ; a z-index 5 il passe
   devant l'habillage (z-index 1) et avale les clics sur "Mobile", "Details &
   sources" et "Commentaires" : liens visibles, mais inertes.
   PAS de correctif par z-index ici : remonter les liens imposerait un z-index sur
   leur parent (ou de le passer en auto), ce qui change l'ordre de PEINTURE et
   ramene le bug de 2.11.2 (le disclaimer repasse devant le detail deplie de
   Grand-Mere, seule etiquette qui descend jusqu'a cette zone).
   L'empilement visuel reste donc EXACTEMENT celui de 2.11.2 ; c'est uniquement le
   routage du clic qui est corrige, en JS (voir "Clics sur les liens d'habillage"
   plus bas). */
</style>
</head>
<body>

  <img id="img" src="assets/gestion-reservoir.jpg" alt="Gestion r&#233;servoir">
  <canvas id="ov"></canvas>
  <div id="hover-layer"></div>

  </div>

</div>
<div id="modal">
  <div id="modal-card">
    <button id="modal-close" type="button" aria-label="Fermer">&times;</button>
    <div id="modal-title"></div>
    <div id="modal-stats"></div>
    <div id="modal-table"></div>
    <canvas id="modal-canvas"></canvas>
    <div id="modal-note"></div>

</div>
<div id="modal-info">
  <div id="modal-info-card">
    <button id="modal-info-close" type="button" aria-label="Fermer">&times;</button>
    <div id="modal-info-title"></div>
    <div id="modal-info-body"></div>
  </div>
</div>
<div id="ctrl">

<script>
// Lien vers la version mobile : en local (output/), le fichier s'appelle animation-mobile.html ;
// sur GitHub Pages, il est renomme mobile.html. On adapte si on detecte le mode local.
// Le serveur local sert aussi animation-centrales.html via "/", d'ou la double condition.
(function () {
  var p = location.pathname;
  if (p.endsWith('animation-centrales.html') || p.endsWith('/')) {
    var lm = document.getElementById('link-mobile');
    if (lm) lm.href = 'animation-mobile.html';
  }
})();

// Lien "Details & sources" : en local (file:// ou localhost), pointe vers le
// README.md voisin servi par notre serveur local. Sur GitHub Pages, garde le
// lien vers le repo source (rendu Markdown joli + historique).
(function () {
  var lr = document.getElementById('link-readme');
  if (!lr) return;
  var isLocal = location.protocol === 'file:'
             || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
  if (isLocal) {
    lr.href = 'README.md';
    lr.removeAttribute('target');
    lr.removeAttribute('rel');
    lr.title = 'Apercu local du README publie';
  }
})();

// ALL contient les vues actives + meta partages. Les donnees sont chargees a la
// demande depuis data/sommaire.json (vues Jour/Semaine/Mois entieres) et data/{YYYY-MM}-horaire.json
// (vue Heure, par mois). La structure ALL.byPeriode est compatible avec l'ancien
// format pour minimiser les changements dans le code de rendu.
//
// loadedMonths : Set des cles 'YYYY-MM' deja fetchees (vue Heure).
// horaireRaw   : objet { centrales, reservoirs, timestamps, riverSummaries } construit
//                progressivement par concatenation des mois charges (toujours trie chrono).
let ALL = { byPeriode: {}, labelW: 0, labelH: 0, labelWRes: 0, labelHRes: 0, legend: null, defaultPeriode: 'horaire' };
const loadedMonths = new Set();
let horaireRaw = null;       // { centrales: [...], reservoirs: [...], timestamps: [...], riverSummaries: [...] }
let manifest   = null;       // { months: [{month, frames, file}], latestMonth }
let isFetching = false;      // anti-rentrance pour le lazy load
let dataStamp  = null;       // manifest.generatedAt du dernier chargement (detecte les vrais changements)
let lastFetchAt = -1e9;      // performance.now() du dernier fetch reussi (garde-fou anti-spam)
let autoRefreshing = false;  // re-fetch auto (visibilitychange) en cours

// Affiche la date "Mise a jour" a partir du generatedAt du manifest (ISO UTC).
// IMPORTANT : cette date vient des DONNEES (manifest), pas du HTML statique. Dans une
// PWA installee, le HTML est servi depuis le cache du SW (stale-while-revalidate) et ne
// se rafraichit pas a chaque visite, alors que autoRefresh() recharge le manifest. En
// lisant la date du manifest, l'etiquette suit toujours la fraicheur reelle des donnees.
// Conversion en heure locale Quebec (America/Montreal) independamment du fuseau de
// l'appareil, pour rester coherent avec ce que produisait le rendu PowerShell.
function setGeneratedAt(iso) {
  const el = document.getElementById('generatedAt');
  if (!el || !iso) return;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return;
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Montreal',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d).reduce((o, p) => (o[p.type] = p.value, o), {});
  const hh = parts.hour === '24' ? '00' : parts.hour;
  el.textContent = 'Mise à jour : ' + parts.year + '-' + parts.month + '-' + parts.day + ' ' + hh + ':' + parts.minute;
}

// Icones charges depuis assets/icons/*.png (sortis du HTML pour l'alleger).
const iconNames = ["debit","deverse","eclair","turbine-vert","apport","centrale","barrage","turbine-francis","turbine-kaplan","niveau","info","pluie"];
const iconImgs = {};
let iconsLoaded = 0;
for (const n of iconNames) {
  const im = new Image();
  im.onload = () => { iconsLoaded++; if (iconsLoaded === iconNames.length && D) draw(frame); };
  im.src = 'assets/icons/' + n + '.png';
  iconImgs[n] = im;
}
const img = document.getElementById('img');
const cv  = document.getElementById('ov');
const ctx = cv.getContext('2d');
// Filtrage haute qualite : les icones PNG sont en 512x512 et sont reduites a
// ~26 px. Sans ceci le canvas utilise un reechantillonnage 'low' qui rend les
// icones floues, alors que les memes PNG affiches en <img> dans les modales
// sont nets. Aligne le rendu de la carte sur celui des fenetres de donnees.
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';
const slider     = document.getElementById('slider');
const sliderTs   = document.getElementById('sliderTs');
const btnPlay    = document.getElementById('btnPlay');
const btnPrev    = document.getElementById('btnPrev');
const btnNext    = document.getElementById('btnNext');
const btnStart   = document.getElementById('btnStart');
const btnEnd     = document.getElementById('btnEnd');
const tsLabel    = document.getElementById('ts');
const fi         = document.getElementById('fi');
const speedSel   = document.getElementById('speed');
const periodeSel = document.getElementById('periodeSel');
const riverBox   = document.getElementById('riverSummary');

let D = null;     // vue active (rebatie par setPeriode)
let N = 0;        // nombre de frames de la vue active
let frame = 0, playing = false, timer = null;
let modalIdx = -1;     // index centrale dans la modale (-1 = ferme)
let modalResIdx = -1;  // index reservoir dans la modale (-1 = ferme)
let modalTurbIdx = -1; // index centrale dans la modale TURBINES (-1 = ferme)
let modalNivResIdx = -1; // index reservoir dans la modale NIVEAU (-1 = ferme)
let modalInfoCIdx = -1;  // index centrale dans la modale INFO CEHQ (-1 = ferme)
let modalInfoRIdx = -1;  // index reservoir dans la modale INFO CEHQ (-1 = ferme)
// Positions pixel (coords image) de l'icone info dessinees par draw() -- hit-test
const infoCentBounds  = [];  // [{ x, y, r }] par centrale
const infoResBounds   = [];  // [{ x, y, r }] par reservoir
const mapToggleBounds    = [];  // [{ x0,y0,x1,y1 } | null] triangle toggle m3/s sur la carte (centrales)
const mapToggleBoundsRes = [];  // idem pour les reservoirs
const infoLabelOverride  = {};  // surcharge position icone info, cle = "ic:idx" ou "ir:idx"

function debitLabelPos(kind, idx) {
  if (kind === 'c') { const c = D.centrales[idx]; return { x: c.debitLabelX, y: c.debitLabelY }; }
  else              { const r = D.reservoirs[idx]; return { x: r.debitLabelX, y: r.debitLabelY }; }
}
function infoLabelPos(kind, idx) {
  if (kind === 'ic') { const c = D.centrales[idx]; return { x: c.infoLabelX, y: c.infoLabelY }; }
  else                { const r = D.reservoirs[idx]; return { x: r.infoLabelX, y: r.infoLabelY }; }
}

// Etat par centrale : 'hidden' (defaut), 'expanded'.
// Les reservoirs conservent leur propre logique compact/etendu (inchange).
const labelState = {};   // labelState[c.id] = 'hidden' | 'expanded'
const labelAlpha = {};   // labelAlpha[c.id] = 0.0..1.0 (animation fondu)
const labelAnim  = {};   // labelAnim[c.id]  = { start, from, to, rafId }
const FADE_MS = 180;

function getLabelState(c) { return labelState[c.id] || 'hidden'; }
function isExpanded(c)    { return getLabelState(c) === 'expanded'; }
function isVisible(c)     { return getLabelState(c) !== 'hidden' || (labelAlpha[c.id] || 0) > 0; }

// Reservoirs : meme logique, cle = 'res:' + r.nom
const compactMode = {};  // conserve pour compatibilite (non utilise)
function isExpandedRes(r)  { return labelState['res:' + r.nom] === 'expanded'; }
function isVisibleRes(r)   { const k = 'res:' + r.nom; return labelState[k] === 'expanded' || (labelAlpha[k] || 0) > 0; }

function setLabelState(c, newState) {
  const key = c.id !== undefined ? c.id : ('res:' + c.nom);
  const cur = labelState[key] || 'hidden';
  if (cur === newState) return;
  const fromAlpha = labelAlpha[key] !== undefined ? labelAlpha[key] : (cur === 'expanded' ? 1 : 0);
  const toAlpha   = newState === 'expanded' ? 1 : 0;
  labelState[key] = newState;
  if (labelAnim[key] && labelAnim[key].rafId) cancelAnimationFrame(labelAnim[key].rafId);
  const anim = { start: null, from: fromAlpha, to: toAlpha, rafId: null };
  labelAnim[key] = anim;
  function step(ts) {
    if (!anim.start) anim.start = ts;
    const t = Math.min(1, (ts - anim.start) / FADE_MS);
    labelAlpha[key] = anim.from + (anim.to - anim.from) * t;
    draw(frame);
    if (t < 1) { anim.rafId = requestAnimationFrame(step); }
    else        { anim.rafId = null; }
  }
  anim.rafId = requestAnimationFrame(step);
}

// Index de la derniere valeur REELLEMENT publiee a la frame i (ou -1). Sert a datter
// une valeur reportee : l'apport est publie 1x/jour, donc la valeur affichee aux autres
// heures vient d'une frame anterieure qu'on veut pouvoir nommer.
function lastRealIdx(arr, i) {
  if (!arr) return -1;
  for (let k = Math.min(i, arr.length - 1); k >= 0; k--) {
    if (arr[k] !== null && arr[k] !== undefined) return k;
  }
  return -1;
}

// "2026-08-05 16:00" | "2026-08-05" | "2026-03-29 → 2026-04-05" | "2026-08" -> "5 aout".
// Les formats de D.timestamps changent selon la vue (heure/jour/semaine/mois) : on ne
// garde que la premiere date trouvee et on la rend en clair, sans l'annee.
const MOIS_COURTS = ['janv.','févr.','mars','avril','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dateCourte(ts) {
  if (!ts) return '';
  const m = String(ts).match(/(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if (!m) return '';
  const mois = MOIS_COURTS[parseInt(m[2], 10) - 1] || '';
  if (!m[3]) return mois;                       // vue mois : pas de jour
  return parseInt(m[3], 10) + ' ' + mois;
}

// Pour une serie [v0, null, null, v3, null] -> renvoie { eff: [v0,v0,v0,v3,v3], stale: [false,true,true,false,true] }.
// Si une valeur est null sans valeur connue avant, eff[i] reste null et stale[i] reste false (rien a afficher).
function computeLastKnown(arr) {
  if (!arr) return { eff: arr, stale: [] };
  const eff = new Array(arr.length);
  const stale = new Array(arr.length);
  let last = null;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (v !== null && v !== undefined) {
      eff[i] = v;
      stale[i] = false;
      last = v;
    } else if (last !== null) {
      eff[i] = last;
      stale[i] = true;
    } else {
      eff[i] = null;
      stale[i] = false;
    }
  }
  return { eff, stale };
}

// Construit la vue active a partir de ALL.byPeriode[key] + meta partages.
function buildView(key) {
  const sub = ALL.byPeriode[key];
  // Pre-calcule pour chaque serie de chaque centrale et reservoir : valeur effective + flag stale.
  const centrales = sub.centrales.map(c => {
    const d = computeLastKnown(c.debits);
    const t = computeLastKnown(c.turbs);
    const v = computeLastKnown(c.devs);
    const m = computeLastKnown(c.mws);
    // Apport : donnee JOURNALIERE (1 valeur/jour a 20:00 UTC = 16 h a Montreal) alors
    // que les autres series sont horaires. Sans report, la ligne n'apparaitrait qu'une
    // heure sur 24. Le report est legitime ici : la valeur decrit la journee entiere,
    // pas un instant. Le flag stale (opacite 45 %) signale que ce n'est pas la mesure
    // de l'heure affichee, comme pour un debit perime.
    const a = computeLastKnown(c.apports);
    return Object.assign({}, c, {
      debitsEff: d.eff, debitsStale: d.stale,
      turbsEff:  t.eff, turbsStale:  t.stale,
      devsEff:   v.eff, devsStale:   v.stale,
      mwsEff:    m.eff, mwsStale:    m.stale,
      apportsEff: a.eff, apportsStale: a.stale
    });
  });
  const reservoirs = (sub.reservoirs || []).map(r => {
    const n = computeLastKnown(r.niveaux);
    const v = computeLastKnown(r.devs);
    // Apport : meme traitement que les centrales (last-known + flag stale). Avant, les
    // valeurs manquantes etaient forcees a 0, ce qui affichait un faux zero ("aucun
    // apport") alors que la donnee journaliere n'etait simplement pas encore publiee.
    const a = computeLastKnown(r.apports);
    return Object.assign({}, r, {
      niveauxEff: n.eff, niveauxStale: n.stale,
      devsEff:    v.eff, devsStale:    v.stale,
      apportsEff: a.eff, apportsStale: a.stale
    });
  });
  return {
    timestamps:        sub.timestamps,
    centrales:         centrales,
    reservoirs:        reservoirs,
    periode:           sub.periode,
    trendUnit:         sub.trendUnit,
    riverSummaries:    sub.riverSummaries || [],
    meteo:             sub.meteo || null,
    labelW:            ALL.labelW,
    labelH:            ALL.labelH,
    labelWRes:         ALL.labelWRes,
    labelHRes:         ALL.labelHRes,
    legend:            ALL.legend
  };
}

// Rend les **gras** markdown vers <strong> (sans risque XSS - on echappe d'abord).
function _renderInlineMarkdown(s) {
  if (!s) return '';
  const esc = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
}

function setPeriode(key) {
  if (!ALL.byPeriode[key]) {
    console.warn('Vue indisponible : ' + key);
    return;
  }
  D = buildView(key);
  N = D.timestamps.length;
  slider.max = Math.max(0, N - 1);
  // Bascule par defaut sur la frame la plus recente, comme l'init.
  frame = N - 1;
  slider.value = frame;
  // L'en-tete est desormais fixe ("Saint-Maurice Debit d'eau" + date) : plus de
  // label de periode ni de sous-titre a mettre a jour ici. La periode reste
  // lisible via le selecteur de vue et le timestamp affiche sous le titre.
  if (typeof go === 'function') go(frame);
}

// --- Chargement initial asynchrone ---
// Fetch dans cet ordre :
//   1. manifest.json (meta + liste des mois horaires)
//   2. sommaire.json (vues Jour/Semaine/Mois entieres)
//   3. {latestMonth}-horaire.json (mois courant pour la vue Heure)
// Une fois les 3 charges, on reconstruit ALL.byPeriode et on appelle setPeriode().
// opts.forceNetwork=true : cache:'reload' au lieu de 'no-cache'. C'est ce que le
// service worker reconnait (isDataRequest + req.cache==='reload') pour bypasser le
// stale-while-revalidate et ramener des donnees vraiment fraiches. Utilise par le
// re-fetch auto au retour au premier plan.
async function fetchJson(url, opts) {
  const mode = (opts && opts.forceNetwork) ? 'reload' : 'no-cache';
  const r = await fetch(url, { cache: mode });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' sur ' + url);
  return r.json();
}

// Concatene les sous-vues horaires deja chargees dans horaireRaw.
// Re-trie par timestamp UTC pour garantir l'ordre chronologique.
function rebuildHoraireFromLoadedMonths() {
  // Collecte les mois charges, dans l'ordre chronologique du manifest.
  const months = manifest.months
    .filter(m => loadedMonths.has(m.month) && m._data)
    .sort((a, b) => a.month.localeCompare(b.month));
  if (months.length === 0) { horaireRaw = null; return; }
  // Premiere vue : copie la structure (centrales/reservoirs/timestamps/riverSummaries).
  const first = months[0]._data;
  const centrales = first.centrales.map(c => Object.assign({}, c, {
    debits: c.debits.slice(), turbs: c.turbs.slice(), devs: c.devs.slice(),
    mws: c.mws.slice(), trends: c.trends.slice(), stables: c.stables.slice(),
    amonts: (c.amonts || []).slice(), avals: (c.avals || []).slice(),
    apports: (c.apports || []).slice()
  }));
  const reservoirs = (first.reservoirs || []).map(r => Object.assign({}, r, {
    niveaux: r.niveaux.slice(), devs: r.devs.slice(), apports: r.apports.slice()
  }));
  const timestamps = first.timestamps.slice();
  const riverSummaries = (first.riverSummaries || []).slice();
  // Meteo : on conserve la structure { zones, frames } du premier mois, puis on
  // concatene les frames des mois suivants. Les `zones` sont la config (stable
  // entre mois) — si jamais elles divergent, on garde celles du premier mois.
  let meteo = null;
  if (first.meteo && first.meteo.frames) {
    meteo = { zones: first.meteo.zones.slice(), frames: first.meteo.frames.slice() };
  }
  // Concatene les mois suivants. Sécurité : on apparie par ID (centrale.id, reservoir.nom)
  // plutôt que par index — si la config bassin change entre deux régénérations partielles
  // (ajout/retrait d'une centrale), un appariement par index melangerait silencieusement
  // les séries. Les centrales/réservoirs présents dans le mois courant mais absents du
  // mois ajouté reçoivent des null (nb_frames du mois ajouté) ; ceux présents dans le
  // mois ajouté mais absents du courant sont ignorés (avec un warn console).
  for (let mi = 1; mi < months.length; mi++) {
    const sub = months[mi]._data;
    const nFrames = sub.timestamps.length;
    const nulls = () => new Array(nFrames).fill(null);

    const srcCentralesById = new Map(sub.centrales.map(c => [c.id, c]));
    for (const dest of centrales) {
      const src = srcCentralesById.get(dest.id);
      if (src) {
        dest.debits.push(...src.debits);
        dest.turbs.push(...src.turbs);
        dest.devs.push(...src.devs);
        dest.mws.push(...src.mws);
        dest.trends.push(...src.trends);
        dest.stables.push(...src.stables);
        if (dest.apports) { dest.apports.push(...(src.apports || nulls())); }
        srcCentralesById.delete(dest.id);
      } else {
        console.warn('Centrale absente du mois ' + months[mi].month + ' : ' + dest.id + ' (' + dest.nom + ') — comblee par null');
        dest.debits.push(...nulls()); dest.turbs.push(...nulls()); dest.devs.push(...nulls());
        dest.mws.push(...nulls());    dest.trends.push(...nulls()); dest.stables.push(...nulls());
        if (dest.apports) { dest.apports.push(...nulls()); }
      }
    }
    for (const orphan of srcCentralesById.values()) {
      console.warn('Centrale presente uniquement dans le mois ' + months[mi].month + ' : ' + orphan.id + ' (' + orphan.nom + ') — ignoree');
    }

    const srcReservoirsByNom = new Map(sub.reservoirs.map(r => [r.nom, r]));
    for (const dest of reservoirs) {
      const src = srcReservoirsByNom.get(dest.nom);
      if (src) {
        dest.niveaux.push(...src.niveaux);
        dest.devs.push(...src.devs);
        dest.apports.push(...src.apports);
        srcReservoirsByNom.delete(dest.nom);
      } else {
        console.warn('Reservoir absent du mois ' + months[mi].month + ' : ' + dest.nom + ' — comble par null');
        dest.niveaux.push(...nulls()); dest.devs.push(...nulls()); dest.apports.push(...nulls());
      }
    }
    for (const orphan of srcReservoirsByNom.values()) {
      console.warn('Reservoir present uniquement dans le mois ' + months[mi].month + ' : ' + orphan.nom + ' — ignore');
    }

    timestamps.push(...sub.timestamps);
    riverSummaries.push(...(sub.riverSummaries || []));
    if (meteo && sub.meteo && sub.meteo.frames) {
      meteo.frames.push(...sub.meteo.frames);
    } else if (meteo) {
      // Mois sans meteo : on remplit avec des frames nulles pour conserver l'alignement.
      const nullsFrame = meteo.zones.map(() => ({ n: null, tmn: null, tmx: null, p24: null }));
      for (let k = 0; k < sub.timestamps.length; k++) meteo.frames.push(nullsFrame);
    }
  }
  horaireRaw = {
    centrales, reservoirs, timestamps, riverSummaries, meteo,
    periode: 'horaire',
    trendUnit: first.trendUnit
  };
}

// Charge un mois horaire (idempotent : ignore si deja charge).
// opts.forceNetwork : transmis a fetchJson pour bypasser le cache SW (re-fetch auto).
async function ensureMonthLoaded(monthKey, opts) {
  if (loadedMonths.has(monthKey)) return;
  const entry = manifest.months.find(m => m.month === monthKey);
  if (!entry) return;
  const data = await fetchJson('data/' + entry.file, opts);
  entry._data = data;
  loadedMonths.add(monthKey);
  rebuildHoraireFromLoadedMonths();
  ALL.byPeriode.horaire = horaireRaw;
}

// Trouve le mois immediatement avant le plus ancien deja charge, et le fetch.
// Apres fetch, recalcule la vue Heure pour preserver la position relative du frame.
async function maybeLoadPreviousMonth() {
  if (!manifest || isFetching) return;
  // Tri chronologique des mois charges.
  const loaded = Array.from(loadedMonths).sort();
  if (loaded.length === 0) return;
  const oldest = loaded[0];
  const idx = manifest.months.findIndex(m => m.month === oldest);
  if (idx <= 0) return;   // deja au mois le plus ancien
  const prevMonth = manifest.months[idx - 1].month;
  if (loadedMonths.has(prevMonth)) return;
  isFetching = true;
  try {
    // Memorise le timestamp courant pour repositionner apres concatenation.
    const wasInHoraire = (D && D.periode === 'horaire');
    const currentTs = wasInHoraire ? D.timestamps[frame] : null;
    await ensureMonthLoaded(prevMonth);
    if (wasInHoraire && periodeSel.value === 'horaire') {
      // Re-applique la vue : N change, frame doit pointer sur le meme ts qu'avant.
      setPeriode('horaire');
      if (currentTs) {
        const newIdx = D.timestamps.indexOf(currentTs);
        if (newIdx >= 0) go(newIdx);
      }
    }
  } catch (err) {
    console.error('Echec chargement mois precedent', err);
  } finally {
    isFetching = false;
  }
}

async function init() {
  try {
    manifest = await fetchJson('data/manifest.json');
    ALL.labelW = manifest.labelW; ALL.labelH = manifest.labelH;
    ALL.labelWRes = manifest.labelWRes; ALL.labelHRes = manifest.labelHRes;
    ALL.legend = manifest.legend;
    ALL.defaultPeriode = manifest.defaultPeriode || 'horaire';

    // Sommaire (vues agregees) en parallele avec le mois courant.
    const latest = manifest.latestMonth;
    const [sommaire] = await Promise.all([
      fetchJson('data/sommaire.json'),
      latest ? ensureMonthLoaded(latest) : Promise.resolve()
    ]);
    if (sommaire.journalier)   ALL.byPeriode.journalier   = sommaire.journalier;
    if (sommaire.hebdomadaire) ALL.byPeriode.hebdomadaire = sommaire.hebdomadaire;
    if (sommaire.mensuel)      ALL.byPeriode.mensuel      = sommaire.mensuel;

    // Choisit la periode par defaut, en se rabattant sur une vue disponible.
    let initialPeriode = ALL.defaultPeriode;
    if (!ALL.byPeriode[initialPeriode]) {
      initialPeriode = ['horaire','journalier','hebdomadaire','mensuel'].find(k => ALL.byPeriode[k]) || 'horaire';
    }
    periodeSel.value = initialPeriode;
    setPeriode(initialPeriode);
    dataStamp = manifest.generatedAt || null;
    setGeneratedAt(dataStamp);
    lastFetchAt = performance.now();
  } catch (err) {
    console.error('Erreur de chargement initial', err);
    if (riverBox) riverBox.innerHTML = '<b>Erreur de chargement</b> ' + (err.message || err);
  }
}
init();

// --- Re-fetch auto au retour au premier plan ---
// Comme la version mobile : une PWA ne rafraichit jamais les donnees toute seule,
// c'est du code applicatif. Au retour de l'onglet/app au premier plan, on re-fetch
// SILENCIEUSEMENT le manifest (bypass SW via forceNetwork). Si generatedAt a change,
// on recharge sommaire + mois courant et on re-rend la vue active. Sinon : rien.
// Garde-fous : pas de re-entrance, pas pendant le lazy-load, au plus 1 fois / 30 s.
//
// opts.manual = true (clic sur "Actualiser") : leve le throttle de 30 s et
// attend la fin du lazy-load au lieu d'abandonner, car un clic explicite doit
// toujours aboutir. Retourne 'updated' | 'same' pour permettre un retour visuel
// (l'appel automatique, lui, ignore la valeur de retour et reste silencieux).
async function autoRefresh(opts) {
  const manual = !!(opts && opts.manual);
  if (autoRefreshing) return 'busy';
  if (isFetching && !manual) return 'busy';
  if (!manual && performance.now() - lastFetchAt < 30000) return 'same';
  autoRefreshing = true;
  try {
    // Clic manuel pendant un lazy-load : on patiente plutot que d'abandonner.
    // Borne a ~5 s pour ne jamais laisser le bouton tourner indefiniment.
    if (manual && isFetching) {
      const until = performance.now() + 5000;
      while (isFetching && performance.now() < until) {
        await new Promise(r => setTimeout(r, 100));
      }
    }
    const fresh = await fetchJson('data/manifest.json', { forceNetwork: true });
    lastFetchAt = performance.now();
    const freshStamp = fresh.generatedAt || null;
    if (freshStamp != null && freshStamp === dataStamp) return 'same'; // rien de neuf
    // Donnees changees : recharge sommaire + mois courant en bypass cache.
    manifest = fresh;
    const latest = manifest.latestMonth;
    loadedMonths.clear();
    manifest.months.forEach(m => { delete m._data; });
    horaireRaw = null;
    const [sommaire] = await Promise.all([
      fetchJson('data/sommaire.json', { forceNetwork: true }),
      latest ? ensureMonthLoaded(latest, { forceNetwork: true }) : Promise.resolve()
    ]);
    if (sommaire.journalier)   ALL.byPeriode.journalier   = sommaire.journalier;
    if (sommaire.hebdomadaire) ALL.byPeriode.hebdomadaire = sommaire.hebdomadaire;
    if (sommaire.mensuel)      ALL.byPeriode.mensuel      = sommaire.mensuel;
    dataStamp = freshStamp;
    setGeneratedAt(dataStamp);
    // Re-rend la vue active (ou un fallback dispo). setPeriode repositionne sur la
    // derniere frame, ce qui est le comportement attendu d'un rafraichissement.
    const curKey = (D && D.periode) || periodeSel.value || ALL.defaultPeriode || 'horaire';
    setPeriode(ALL.byPeriode[curKey] ? curKey : (['horaire','journalier','hebdomadaire','mensuel'].find(k => ALL.byPeriode[k]) || 'horaire'));
    return 'updated';
  } catch (e) {
    /* hors-ligne ou erreur reseau : on garde les donnees actuelles.
       Appel automatique : silencieux. Appel manuel : on propage pour que le
       bouton puisse afficher "Hors-ligne" au lieu de mentir avec "Deja a jour". */
    if (manual) throw e;
  } finally {
    autoRefreshing = false;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') autoRefresh();
});

// --- Bouton "Actualiser" ---
// En PWA installee (display:standalone) il n'y a pas de barre d'adresse, donc
// pas de bouton recharger. Ce bouton comble ce manque SANS recharger la page :
// il rejoue autoRefresh({manual:true}), donc pas de flash ni de perte de la
// position courante dans l'animation. Ctrl+R / F5 restent geres par le systeme.
(function setupRefreshButton() {
  const btn   = document.getElementById('btnRefresh');
  const toast = document.getElementById('refreshToast');
  if (!btn) return;
  let toastTimer = null;

  function showToast(msg, isError) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.toggle('err', !!isError);
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2200);
  }

  btn.addEventListener('click', async () => {
    btn.classList.add('busy');
    btn.setAttribute('aria-busy', 'true');
    try {
      const res = await autoRefresh({ manual: true });
      showToast(res === 'updated' ? 'Données mises à jour' : 'Déjà à jour', false);
    } catch (e) {
      showToast('Hors-ligne : données inchangées', true);
    } finally {
      btn.classList.remove('busy');
      btn.removeAttribute('aria-busy');
    }
  });

  // Ctrl+R / Cmd+R en PWA : le raccourci n'est pas toujours transmis a la
  // fenetre standalone selon la plateforme. On l'intercepte pour offrir le
  // meme geste qu'au navigateur, en re-fetch a chaud plutot qu'en reload.
  document.addEventListener('keydown', (e) => {
    const k = (e.key || '').toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'r' && !e.shiftKey) {
      e.preventDefault();
      btn.click();
    }
  });
})();

// ----- Palette des SERIES : une grandeur = une teinte, partout -----
// SOURCE UNIQUE de verite pour la couleur des courbes (sparklines centrales ET
// reservoirs, modales, legende, version mobile). Avant centralisation, les teintes
// etaient ecrites en dur dans 6 endroits et le meme vert portait trois sens
// differents : turbine (centrale), apport (reservoir) et "debit bas" (pastille de
// statut). Deux etiquettes voisines sur la meme image affichaient donc le meme
// echantillon de couleur pour des grandeurs sans rapport.
//
// Regle : ne JAMAIS ecrire une couleur de serie en dur ailleurs — ajouter la
// grandeur ici, sinon la prochaine serie reintroduit l'ambiguite.
//
// Le 'total' est l'exception volontaire : il prend la couleur du STATUT
// (ratioColor) parce que c'est lui qui porte l'alerte de crue.
//
// L'echelle de statut (vert -> jaune -> orange -> rouge de ratioColor) garde son
// vert : c'est un registre different (intensite de risque, pas une grandeur
// mesuree), donc aucune confusion avec le vert 'turbine'.
const SERIES = {
  // Eau qui passe par les turbines. Garde le vert : coherent avec l'icone
  // turbine-vert.png utilisee sur la meme ligne d'etiquette.
  turbine: { line: 'rgba(46,160,67,.85)',  solid: '#1a6e2a', label: 'Turbiné' },
  // Eau qui passe par les deversoirs. Etait GRIS sur les centrales et BLEU sur
  // les reservoirs pour la meme grandeur : unifie en bleu. Le gris redevient
  // reserve au neutre / donnee absente.
  deverse: { line: 'rgba(40,110,200,.90)', solid: '#1a3060', label: 'Déversé' },
  // Eau naturelle entrant depuis le bassin versant (CONSEQUENCE de la pluie).
  // Quitte le vert (qui signifiait deja 'turbine') pour un cyan/sarcelle, distinct
  // du bleu deversement tout en restant dans la famille "eau".
  apport:  { line: 'rgba(0,150,160,.90)',  solid: '#0a6a72', label: 'Apport naturel' },
  // Pluie tombee (CAUSE de l'apport). Bleu plus pale que le deversement : la cause
  // precede la consequence, elle est volontairement moins appuyee.
  pluie:   { line: 'rgba(90,150,220,.85)', solid: '#3a6ea5', label: 'Pluie' },
  // Donnee absente / serie neutre.
  neutre:  { line: 'rgba(140,140,140,.95)', solid: '#666',   label: 'N/D' }
};

// Epaisseur d'un trait de stem-plot en fonction de la densite de points.
// Sans ca, en vue Jour (129 frames sur ~200 px de sparkline) les traits de 1,3 px
// se touchent et le stem-plot se lit comme une aire pleine : on perd l'information
// "1 barre = 1 mesure publiee" qui justifie ce type de trace. On plafonne donc
// l'epaisseur au pas horizontal disponible, avec une marge de 30 % pour garder un
// blanc visible entre deux barres voisines.
function stemWidth(plotW, nPts, base) {
  if (nPts <= 1) return base;
  const pas = plotW / (nPts - 1);
  return Math.max(0.4, Math.min(base, pas * 0.7));
}

// Extrait la serie complete de pluie 24 h (mm) d'une zone meteo, + son max.
// D.meteo est indexe [frame][zone], alors que les sparklines ont besoin d'une serie
// par frame : on transpose une fois par etiquette au lieu de refaire la recherche
// de zone a chaque point.
//
// Le max est celui de la FENETRE courante (et non de l'historique complet comme
// pour l'apport) : la pluie est deja bornee par nature (0 a ~80 mm/24h) et un
// episode ancien tres pluvieux ecraserait toutes les averses recentes. Ici on veut
// voir le relief de la periode affichee.
function pluieSerie(zoneKey) {
  if (!zoneKey || !D.meteo || !D.meteo.zones || !D.meteo.frames) return null;
  const zi = D.meteo.zones.findIndex(z => z.key === zoneKey);
  if (zi < 0) return null;
  const out = new Array(D.meteo.frames.length).fill(null);
  let mx = 0;
  for (let k = 0; k < D.meteo.frames.length; k++) {
    const fr = D.meteo.frames[k];
    if (!fr || !fr[zi]) continue;
    const v = fr[zi].p24;
    if (v == null) continue;
    out[k] = v;
    if (v > mx) mx = v;
  }
  return mx > 0 ? { vals: out, max: mx } : null;
}

function ratioColor(r) {
  // Couleur basee sur (current - min) / (max - min) en %
  //
  // Seuils cales sur le suivi de crue (et non en quartiles egaux) : un debit a
  // 75 % du range historique est courant, pas alarmant. Le rouge est reserve au
  // top 15 % du range, le vert couvre l'exploitation courante (< 40 %).
  if (r === null || r === undefined) return {f:'rgba(120,120,120,.88)',s:'#555'};
  if (r < 40) return {f:'rgba(46,160,67,.92)',  s:'#1a6e2a'};   // vert
  if (r < 65) return {f:'rgba(210,170,0,.92)',  s:'#7a6200'};   // jaune
  if (r < 85) return {f:'rgba(230,110,0,.92)',  s:'#7a3a00'};   // orange
  return            {f:'rgba(200,30,30,.92)',   s:'#6a0000'};   // rouge
}

function drawLeftSegments(ctx, segments, x, y, defaultFont) {
  // segments = [{text, color, font?} | {icon: name, size: px} | {gap: px}, ...]
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  let curX = x;
  for (const s of segments) {
    if (s.gap !== undefined) {
      curX += s.gap;
    } else if (s.icon) {
      const im = iconImgs[s.icon];
      const sz = Math.round(s.size);
      if (im && im.complete && im.naturalWidth > 0) {
        ctx.drawImage(im, curX, y - sz/2, sz, sz);
      }
      curX += sz + Math.round(2 * (s.size / 14));  // espacement proportionnel a la taille
    } else {
      ctx.font = s.font || defaultFont;
      ctx.fillStyle = s.color;
      ctx.fillText(s.text, curX, y);
      curX += ctx.measureText(s.text).width;
    }
  }
  return curX;
}

function fmt2(v) {
  // Formate un nombre avec 2 decimales et virgule (locale fr)
  return v.toFixed(2).replace('.', ',');
}

// --- Turbinage : configuration de groupes estimee ---------------------------
// HQ ne publie QUE le debit turbine TOTAL d'une centrale (pas par groupe). On
// reconstruit la configuration la plus plausible selon la conduite reelle (doc
// "economic dispatch" / "unit commitment") :
//   1. On choisit le NOMBRE de groupes en service (commitment) en visant une CHARGE
//      CIBLE OPTIMALE par groupe (~85 % du nominal = haut rendement). Un operateur
//      arrete des groupes pour garder les actifs dans leur zone optimale plutot que de
//      les laisser tourner juste au-dessus du plancher (rendement mediocre).
//   2. On REPARTIT LA CHARGE EGALEMENT entre les groupes en service : pour des groupes
//      identiques, l'optimum (coûts marginaux egaux) = meme charge sur chacun.
// Charge/groupe visee dans [plancher, ~cible] ; peut depasser 100 % en SURCHARGE quand
// tous les groupes tournent et que le debit excede encore le nominal (cas crue : on
// turbine au max avant de devoir deverser). Plancher : Francis 50 %, Kaplan 25 %.
// Retourne { charges: [..N..] (valeur reelle, peut etre > 1 en surcharge), k, pct,
//            surcharge: bool }.
// spec = { nb_groupes, cap, famille_turbine } (une centrale OU un sous-groupe).
function turbineConfig(spec, turb) {
  const N = spec.nb_groupes;
  if (!N || !spec.cap || turb === null || turb === undefined) return null;
  const plancher = (spec.famille_turbine === 'Francis') ? 0.50 : 0.25;
  const CIBLE = 0.85;                            // charge visee par groupe (zone optimale)
  const qmax = spec.cap / N;                     // debit nominal d'un groupe
  const pct = Math.max(0, turb / spec.cap);      // charge globale (non bornee : peut depasser 100 %)
  const charges = new Array(N).fill(0);
  if (turb <= 0.5) return { charges: charges, k: 0, pct: 0, surcharge: false };   // arret total
  // 1. Commitment : nb de groupes qui place chacun le plus pres possible de la cible.
  let k = Math.round(turb / (qmax * CIBLE));
  if (k < 1) k = 1;
  if (k > N) k = N;
  // Contrainte haute : on ajoute des groupes tant que la charge/groupe depasse 100 %,
  // MAIS si tous les groupes (k=N) sont deja en service et que ca depasse encore, c'est
  // une SURCHARGE legitime (on ne peut pas ajouter plus de groupes).
  while (k < N && (turb / (k * qmax)) > 1) k++;
  // Contrainte basse (rendement) : sous le plancher, on arrete un groupe.
  while (k > 1 && (turb / (k * qmax)) < plancher) k--;
  // 2. Repartition EGALE entre les k groupes en service (valeur reelle, peut etre > 1).
  const chargeEgale = Math.max(0, turb / (k * qmax));
  for (let g = 0; g < k; g++) charges[g] = chargeEgale;
  const surcharge = chargeEgale > 1.001;
  return { charges: charges, k: k, pct: pct, surcharge: surcharge };
}

// Position verticale (fraction de lh) de l'indicateur turbine compact dans l'etiquette,
// sous la ligne MW. Sert au rendu ET au hit-test du clic (doivent rester synchronises).
// Fraction de la hauteur d'etiquette ou s'affiche la ligne turbine. A rescaler en
// meme temps que les autres ratios lh*0.xxxx si label_height change (elle vaut 0.4495
// pour label_height = 275, soit ~123,6 px : position historique conservee).
const TURB_ROW_FRAC = 0.4495;
// Ratio de la ligne "niveau" dans l'etiquette RESERVOIR. Partage entre le dessin et
// le test de clic (hitTestReservoirNiveauArrow) : les deux se sont desynchronises une
// fois, la zone cliquable restant a 0.47 apres le passage du dessin a 0.432.
const RES_ROW_NIVEAU = 0.432;

// Liste des sous-unites de turbinage d'une centrale : ses sous_groupes (ex. Shawinigan-2/-3,
// debit reparti au prorata des cap) ou la centrale entiere. turb = debit turbine total.
// Retourne [{ label, spec:{nb_groupes,cap,famille_turbine}, turb }, ...].
function turbineUnits(c, turb) {
  if (c.sous_groupes && c.sous_groupes.length > 0) {
    const capTot = c.sous_groupes.reduce((s, sg) => s + sg.cap, 0) || c.cap;
    return c.sous_groupes.map(sg => ({
      label: sg.nom,
      spec: { nb_groupes: sg.nb_groupes, cap: sg.cap, famille_turbine: c.famille_turbine },
      turb: turb * (sg.cap / capTot)
    }));
  }
  return [{ label: null,
            spec: { nb_groupes: c.nb_groupes, cap: c.cap, famille_turbine: c.famille_turbine },
            turb: turb }];
}

// Agrege k/N/pct sur toutes les sous-unites (pour l'indicateur compact de l'etiquette).
function turbineAggregate(c, turb) {
  const units = turbineUnits(c, turb);
  let k = 0, N = 0;
  let surcharge = false;
  for (const u of units) {
    const cfg = turbineConfig(u.spec, u.turb);
    if (cfg) { k += cfg.k; N += u.spec.nb_groupes; if (cfg.surcharge) surcharge = true; }
  }
  const pct = c.cap ? Math.max(0, turb / c.cap) : 0;   // non borne : peut depasser 100 %
  return { k: k, N: N, pct: pct, surcharge: surcharge };
}

function draw(i) {
  const sx = cv.width  / img.naturalWidth;
  const sy = cv.height / img.naturalHeight;
  // Echelle pour les elements DOM (titre, date, lien "Mobile", habillage, selecteurs).
  // Distincte de sx : depuis le surechantillonnage du canvas, sx est exprime en pixels
  // de BACKING STORE (multiplie par devicePixelRatio et par le zoom pinch), ce qui est
  // voulu pour le tracé mais faux pour du DOM, qui raisonne en pixels CSS. On repart
  // donc de la taille AFFICHEE de l'image.
  const sxCss = img.offsetWidth / img.naturalWidth;
  ctx.clearRect(0,0,cv.width,cv.height);
  const lw = D.labelW * sx;
  const lh = D.labelH * sy;

  // ---- LEGENDE : tableau opaque autonome ----
  // Remplace l'ancien assemblage de 3 blocs positionnes les uns par rapport aux autres
  // (lgResX = lgX - 340, colonne statuts calee sur la fin du texte "Turbine", etc.).
  // Ce montage devait en plus s'aligner sur le mot "LEGENDE" et la rosace "Centrale"
  // GRAVES dans gestion-reservoir.jpg, d'ou des decalages en cascade fragiles.
  //
  // Ici : un rectangle blanc opaque couvre toute la zone (donc masque le texte grave),
  // et tout est dessine relativement a ce rectangle. Une seule source de verite pour
  // la geometrie ; les colonnes, les lignes, le titre et les notes en decoulent.
  if (D.legend) {
    const lgFs = Math.max(10, Math.round(D.legend.fontSize * sx));
    const lgFont      = lgFs + 'px "Segoe UI",Arial,sans-serif';
    const lgFontBold  = 'bold ' + lgFs + 'px "Segoe UI",Arial,sans-serif';
    const lgFontTitle = 'bold ' + Math.round(lgFs * 1.3) + 'px "Segoe UI",Arial,sans-serif';
    // Note en pied a la MEME taille que le texte de la legende — donc que le bandeau
    // des faits saillants, qui est pilote par ce meme lgFs (cf. riverBox.style.fontSize).
    // Elle paraissait rapetissee a 0.8x.
    const lgFontNote  = lgFont;
    // Taille reduite reservee aux renvois "(1)" accoles a une mesure, en gras pour
    // qu'ils restent reperables malgre la petite taille.
    const lgFontExp   = 'bold ' + Math.max(9, Math.round(lgFs * 0.8)) + 'px "Segoe UI",Arial,sans-serif';
    const lgIs   = Math.max(14, Math.round(D.legend.iconSize * sx));
    // Interligne resserre (0.85x) : le tableau compte jusqu'a 5 lignes + titre + notes,
    // et doit tenir entre le texte grave du JPG et l'axe des distances.
    const lgLh   = Math.max(15, Math.round(D.legend.lineHeight * 0.85 * sy));
    const lgGap  = Math.max(6, Math.round(9 * sx));
    const lgCol  = '#1a3060';

    // Textes hors canvas alignes sur la taille du texte de la legende.
    //
    // ATTENTION : ces elements sont du DOM, donc en pixels CSS -> on utilise lgFsCss
    // (base sur sxCss) et NON lgFs, qui est en pixels de backing store depuis le
    // surechantillonnage du canvas. Utiliser lgFs ici les ferait grossir d'un facteur
    // devicePixelRatio x zoom-pinch par-dessus l'agrandissement optique du navigateur.
    const lgFsCss = Math.max(10, Math.round(D.legend.fontSize * sxCss));
    if (riverBox) riverBox.style.fontSize = lgFsCss + 'px';
    const discEl = document.getElementById('disclaimer');
    if (discEl) discEl.style.fontSize = lgFsCss + 'px';
    const genEl = document.getElementById('generatedAt');
    if (genEl) genEl.style.fontSize = lgFsCss + 'px';
    // Titre + horodatage : etaient pilotes par clamp(...vw...) en CSS.
    // 'vw' suit la largeur de FENETRE, alors que l'image de fond est contrainte par la
    // hauteur (max-height:calc(100vh - 54px)) et bouge donc peu au zoom navigateur :
    // les deux divergeaient, d'ou l'impression que "tout grossit sauf l'image".
    // On les indexe sur lgFsCss, qui suit la taille AFFICHEE de l'image, comme le
    // reste du canvas. Ratios reprenant les proportions CSS d'origine
    // (1.55vw et 1.22vw contre 0.95vw pour le texte de legende).
    const titreEl = document.getElementById('titre');
    if (titreEl) titreEl.style.fontSize = Math.round(lgFsCss * 1.63) + 'px';
    const tsEl = document.getElementById('ts');
    if (tsEl) tsEl.style.fontSize = Math.round(lgFsCss * 1.28) + 'px';
    // Bloc haut-droite ("Mobile · v2.x.x") : restait en clamp(...vw...), donc il
    // grossissait avec la fenetre au lieu de suivre l'image. Meme ratio que le
    // disclaimer, dont il partageait la regle CSS (0.95vw).
    const topREl = document.getElementById('topRight');
    if (topREl) topREl.style.fontSize = lgFsCss + 'px';

    // --- Contenu declaratif : 4 colonnes (en-tete + lignes) ---
    const lgCols = [
      { titre: 'Réservoir', icone: 'barrage', lignes: [
          { icon: 'niveau',  text: 'Niveau (m)' },
          { icon: 'deverse', text: 'Déversé (m³/s)' }
        ] },
      { titre: 'Centrale', icone: 'centrale', lignes: [
          { icon: 'debit',        text: 'Débit total (m³/s)' },
          { icon: 'turbine-vert', text: 'Turbiné (m³/s)' },
          { icon: 'eclair',       text: 'Élec. générée (MW)' }
        ] },
      // Pas d'en-tete "Intensite" : les anneaux se lisent d'eux-memes et la colonne
      // demarre donc a la hauteur des en-tetes. 'N/D' plutot que 'Non disponible'
      // pour resserrer la largeur.
      // Les teintes sont lues via ratioColor() aux bornes de chaque palier, pour que
      // la legende suive automatiquement tout futur ajustement des seuils/couleurs
      // de statut au lieu de diverger silencieusement.
      { lignes: [
          { ring: ratioColor(0).f,    text: 'Bas' },
          { ring: ratioColor(50).f,   text: 'Modéré' },
          { ring: ratioColor(75).f,   text: 'Élevé' },
          { ring: ratioColor(95).f,   text: 'Fort' },
          { ring: ratioColor(null).f, text: 'N/D' }
        ] },
      // 'Apport naturel' n'est pas un en-tete de categorie (contrairement a Reservoir
      // et Centrale qui coiffent plusieurs mesures) : c'est une mesure au meme titre
      // que 'Pluie'. Les deux sont donc des lignes normales, sans gras.
      { lignes: [
          { icon: 'apport', text: 'Apport naturel (m³/s)', exp: '1' },
          { icon: 'pluie',  text: 'Pluie (mm/24h)' }
        ] }
    ];
    const lgNotes = [
      { exp: '1', text: "Eau entrant dans l'ouvrage depuis son bassin versant (pluie, fonte, ruissellement), hors manœuvre d'Hydro-Québec. Publiée 1×/jour : la date indique la dernière valeur connue." }
    ];

    // --- Largeur de chaque colonne : mesuree sur son contenu reel ---
    const lgPad     = Math.round(14 * sx);            // marge interieure du cadre
    const lgColGap  = Math.round(22 * sx);            // espace entre colonnes
    const lgTitleH  = Math.round(lgLh * 1.5);         // bandeau titre "LEGENDE"
    const colW = lgCols.map(col => {
      let w = 0;
      if (col.titre) {
        ctx.font = lgFontBold;
        w = lgIs + lgGap + ctx.measureText(col.titre).width;
      }
      ctx.font = lgFont;
      for (const l of col.lignes) {
        const wl = lgIs + lgGap + ctx.measureText(l.text + (l.exp ? ' (' + l.exp + ')' : '')).width;
        if (wl > w) w = wl;
      }
      return Math.ceil(w);
    });

    // --- Hauteur : bandeau titre + en-tete + lignes max + notes ---
    // Hauteur en nombre de rangees : une colonne sans titre commence a la rangee 0,
    // donc elle occupe une rangee de moins qu'une colonne titree de meme longueur.
    const maxLignes = Math.max.apply(null, lgCols.map(c => c.lignes.length + (c.titre ? 1 : 0))) - 1;
    ctx.font = lgFontNote;
    const noteTxts = lgNotes.map(n => '(' + n.exp + ') ' + n.text);
    const boxW = lgPad * 2 + colW.reduce((a, b) => a + b, 0) + lgColGap * (lgCols.length - 1);
    const noteMaxW = boxW - lgPad * 2;
    // Retour a la ligne des notes : on decoupe par mots selon la largeur disponible.
    const noteLines = [];
    for (const t of noteTxts) {
      let cur = '';
      for (const mot of t.split(' ')) {
        const essai = cur ? cur + ' ' + mot : mot;
        if (ctx.measureText(essai).width > noteMaxW && cur) { noteLines.push(cur); cur = mot; }
        else { cur = essai; }
      }
      if (cur) noteLines.push(cur);
    }
    const lgNoteLh = Math.round(lgLh * 0.95);   // note en taille pleine : interligne quasi normal
    // Le 1.0 doit rester synchronise avec yNote0 plus bas (respiration tableau/notes),
    // sinon le cadre ne contient plus la derniere ligne de note.
    const boxH = lgTitleH + lgLh * (1 + maxLignes) + Math.round(lgLh * 1.0)
               + noteLines.length * lgNoteLh + lgPad;

    // --- Position : ancree sur D.legend, recentree pour couvrir la zone gravee ---
    // L'ancien code partait de lgX - 340 pour le bloc Reservoir : on reprend ce bord
    // gauche comme origine du cadre, et on remonte du bandeau titre pour recouvrir le
    // mot "LEGENDE" de l'image.
    // Le cadre doit couvrir le mot "LEGENDE" grave dans le JPG (vers y=833 px image)
    // ET la rosace "Centrale" gravee juste sous lui. On ancre donc le HAUT du cadre
    // au-dessus du texte grave, et on cale le bas pour ne pas mordre sur l'axe des
    // distances (~y=1050 px image). D.legend.y reste le point de reference configurable.
    // Decale vers la droite (-260 au lieu de -340) et remonte (-150 au lieu de -120) :
    // la note en taille pleine allonge le cadre, et il y a de la place libre a droite.
    const boxX = Math.round((D.legend.x - 260) * sx);
    const boxY = Math.round((D.legend.y - 150) * sy);

    // --- Cadre opaque ---
    ctx.save();
    // Fond gris pale = teinte exacte du fond de gestion-reservoir.jpg (#F0F4F5, mesuree
    // au pixel en plusieurs points). Le tableau se fond ainsi dans l'image au lieu de
    // ressortir comme un bloc blanc.
    // Reste 100 % OPAQUE (pas de rgba) : le cadre doit masquer le mot "LEGENDE" et la
    // rosace "Centrale" graves dans le JPG. Une transparence les laisserait reapparaitre.
    ctx.fillStyle = '#f0f4f5';
    ctx.strokeStyle = 'rgba(90,110,140,.35)';
    ctx.lineWidth = Math.max(1, Math.round(1.2 * sx));
    const r = Math.round(8 * sx);
    ctx.beginPath();
    ctx.moveTo(boxX + r, boxY);
    ctx.lineTo(boxX + boxW - r, boxY);
    ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + r);
    ctx.lineTo(boxX + boxW, boxY + boxH - r);
    ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH);
    ctx.lineTo(boxX + r, boxY + boxH);
    ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - r);
    ctx.lineTo(boxX, boxY + r);
    ctx.quadraticCurveTo(boxX, boxY, boxX + r, boxY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // --- Bandeau titre ---
    ctx.save();
    ctx.font = lgFontTitle;
    ctx.fillStyle = lgCol;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('LÉGENDE', boxX + boxW / 2, boxY + lgTitleH / 2);
    ctx.textAlign = 'left';
    // Filet sous le titre
    ctx.beginPath();
    ctx.moveTo(boxX + lgPad, boxY + lgTitleH);
    ctx.lineTo(boxX + boxW - lgPad, boxY + lgTitleH);
    ctx.strokeStyle = 'rgba(120,140,170,.35)';
    ctx.lineWidth = Math.max(1, Math.round(1 * sx));
    ctx.stroke();
    ctx.restore();

    // --- Colonnes ---
    let cx = boxX + lgPad;
    const yHead = boxY + lgTitleH + Math.round(lgLh * 0.75);
    lgCols.forEach((col, ci) => {
      // En-tete de colonne (optionnel). Sans titre, les lignes remontent d'un cran
      // pour demarrer a la hauteur des en-tetes des autres colonnes.
      if (col.titre) {
        const segsH = [];
        if (col.icone) { segsH.push({ icon: col.icone, size: lgIs }, { gap: lgGap }); }
        segsH.push({ text: col.titre, color: lgCol, font: lgFontBold });
        drawLeftSegments(ctx, segsH, cx, yHead, lgFontBold);
      }
      const rowOffset = col.titre ? 1 : 0;

      // Lignes de la colonne
      col.lignes.forEach((l, li) => {
        const y = yHead + (li + rowOffset) * lgLh;
        if (l.ring) {
          // Anneau de couleur (meme rendu que les rosaces de centrale)
          const rr = Math.max(6, Math.round(lgIs * 0.42));
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx + rr, y, rr, 0, Math.PI * 2);
          ctx.strokeStyle = l.ring;
          ctx.lineWidth = Math.max(2, Math.round(rr * 0.38));
          ctx.stroke();
          ctx.restore();
          ctx.font = lgFont;
          ctx.fillStyle = lgCol;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(l.text, cx + rr * 2 + lgGap, y);
        } else {
          const sz = (l.icon === 'deverse') ? Math.round(lgIs * 1.2) : lgIs;
          const segsL = [
            { icon: l.icon, size: sz },
            { gap: lgGap },
            { text: l.text, color: lgCol }
          ];
          // Renvoi vers une note de pied (ex. "(1)"), en plus petit.
          if (l.exp) {
            segsL.push({ text: ' (' + l.exp + ')', color: 'rgba(90,110,150,.95)',
                         font: lgFontExp });
          }
          drawLeftSegments(ctx, segsL, cx, y, lgFont);
        }
      });
      cx += colW[ci] + lgColGap;
    });

    // --- Notes en pied ---
    ctx.save();
    ctx.font = lgFontNote;
    ctx.fillStyle = 'rgba(80,95,125,.95)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    // + une interligne complete de respiration entre le tableau et les notes.
    const yNote0 = yHead + (maxLignes + 1) * lgLh + Math.round(lgLh * 1.0);
    noteLines.forEach((t, k) => {
      const y = yNote0 + k * lgNoteLh;
      // Le renvoi "(n)" en tete de note est mis en gras, comme celui accole a la
      // mesure : les deux doivent se repondre visuellement. On le dessine donc
      // separement du corps de la note.
      const m = t.match(/^(\(\d+\)\s*)(.*)$/);
      if (m) {
        ctx.font = 'bold ' + lgFontNote;
        ctx.fillText(m[1], boxX + lgPad, y);
        const wExp = ctx.measureText(m[1]).width;
        ctx.font = lgFontNote;
        ctx.fillText(m[2], boxX + lgPad + wExp, y);
      } else {
        ctx.font = lgFontNote;
        ctx.fillText(t, boxX + lgPad, y);
      }
    });
    ctx.restore();
  }

  // ---- CENTRALES ----
  for (const c of D.centrales) {
    const deb = c.debits[i];
    // Ratio min/max historique pour la couleur
    let ratio = null;
    if (deb !== null && c.minTotal !== null && c.maxTotal !== null && (c.maxTotal - c.minTotal) > 0) {
      ratio = Math.round((deb - c.minTotal) / (c.maxTotal - c.minTotal) * 100);
    }
    const col = ratioColor(ratio);
    const ix = c.iconX * sx, iy = c.iconY * sy;

    // Anneau coloré autour de la rosace du JPG de fond
    if (c.rosaceX !== null && c.rosaceY !== null) {
      const ringR = Math.round(D.legend.iconSize * sx * 0.62);
      ctx.save();
      ctx.beginPath();
      ctx.arc(c.rosaceX * sx, c.rosaceY * sy, ringR, 0, Math.PI * 2);
      ctx.strokeStyle = col.f;
      ctx.lineWidth = Math.max(2.5, 4 * sx);
      ctx.stroke();
      ctx.restore();
    }

    const lx = c.labelX * sx, ly = c.labelY * sy;
    // Largeur d'etiquette specifique a la centrale si definie (ex. nom long), sinon valeur par defaut.
    const lwC = (c.labelW || D.labelW) * sx;

    // Debit total + triangle toggle au cote du nom de la centrale.
    // Toujours dessine, independamment de l'etat de l'etiquette.
    const debMap = c.debitsEff[i];
    const ciPos = debitLabelPos('c', D.centrales.indexOf(c));
    if (debMap !== null && ciPos.x !== null && ciPos.y !== null) {
      const fsCap = Math.max(8, Math.round(13 * sx));
      const fsUnit = Math.max(6, Math.round(10 * sx));  // m³/s 25% plus petit que le chiffre
      ctx.save();
      if (c.debitsStale[i]) ctx.globalAlpha = 0.45;

      ctx.fillStyle = '#111';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const debX = ciPos.x * sx, debY = ciPos.y * sy;
      // Chiffre en grand
      ctx.font = 'bold ' + fsCap + 'px "Segoe UI",Arial,sans-serif';
      const numTxt = String(debMap);
      ctx.fillText(numTxt, debX, debY);
      const numW = ctx.measureText(numTxt).width;
      // Unite m³/s plus petite, alignee en bas avec le chiffre
      ctx.font = 'bold ' + fsUnit + 'px "Segoe UI",Arial,sans-serif';
      const unitTxt = ' m³/s';
      ctx.fillText(unitTxt, debX + numW, debY + (fsCap - fsUnit));
      const unitW = ctx.measureText(unitTxt).width;
      // Triangle toggle : meme taille que le triangle de l'etiquette (fsArrow = 28*sx).
      const debW = numW + unitW;
      const triChar = isVisible(c) ? '▴' : '▾';
      const fsTriMap = Math.max(18, Math.round(28 * sx));
      ctx.font = 'bold ' + fsTriMap + 'px "Segoe UI",Arial,sans-serif';
      ctx.fillStyle = isVisible(c) ? '#1a1a2e' : '#555577';
      const triX = debX + debW + 1 * sx;
      const triW = ctx.measureText(triChar).width;
      ctx.fillText(triChar, triX, debY + (fsCap - fsTriMap) * 0.5);
      ctx.restore();
      const ciIdx2 = D.centrales.indexOf(c);
      mapToggleBounds[ciIdx2] = {
        x0: triX / sx, y0: (debY - 2*sx) / sy,
        x1: (triX + triW + 6*sx) / sx, y1: (debY + fsCap + 2*sx) / sy
      };
    } else {
      const ciIdx2 = D.centrales.indexOf(c);
      mapToggleBounds[ciIdx2] = null;
    }

    // Icone info (i) sur la carte (toujours visible, independante de l'etiquette).
    const fsArrow = Math.max(18, Math.round(28 * sx));
    const fsInfo  = Math.max(14, Math.round(22 * sx));
    const infoSzC = fsInfo;
    const infoImC = iconImgs['info'];
    const ciIdx = D.centrales.indexOf(c);
    const infoPosC = infoLabelPos('ic', ciIdx);
    if (infoPosC.x !== null && infoImC && infoImC.complete) {
      const infoXC = infoPosC.x * sx, infoYC = infoPosC.y * sy;
      ctx.drawImage(infoImC, infoXC - infoSzC/2, infoYC - infoSzC/2, infoSzC, infoSzC);
      infoCentBounds[ciIdx] = { x: infoPosC.x, y: infoPosC.y, r: (infoSzC * 0.55) / sx };
    } else {
      infoCentBounds[ciIdx] = null;
    }

    // Etat : expanded = toujours pleine hauteur. Cache si alpha == 0.
    const expanded = isExpanded(c);
    const lhEff = lh;
    const alpha  = labelAlpha[c.id] !== undefined ? labelAlpha[c.id] : (expanded ? 1 : 0);
    if (alpha <= 0) continue;  // saute le rendu etiquette si completement cachee

    // Alpha fondu : applique sur toute l'etiquette + pointille + pastille.
    ctx.save();
    ctx.globalAlpha = alpha;

    // Ligne de rappel icon -> etiquette (pointillee).
    const lcx = lx + lwC/2, lcy = ly + lhEff/2;
    const dx = ix - lcx,   dy  = iy - lcy;
    let ex = lcx, ey = lcy;
    if (Math.abs(dx) > Math.abs(dy) * (lwC/lhEff)) { ex = dx>0 ? lx+lwC : lx; }
    else                                            { ey = dy>0 ? ly+lhEff : ly; }
    ctx.save();
    ctx.setLineDash([6*sx, 6*sx]);
    ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ix,iy);
    ctx.strokeStyle='rgba(50,50,50,.65)'; ctx.lineWidth=1.1*sx; ctx.stroke();
    ctx.restore();

    // Pastille icone
    ctx.beginPath(); ctx.arc(ix,iy,4*sx,0,2*Math.PI);
    ctx.fillStyle=col.f; ctx.fill();

    // Fond etiquette : utilise lhEff pour vraiment liberer de l'espace en mode compact.
    ctx.fillStyle='#fff';
    ctx.fillRect(lx,ly,lwC,lhEff);
    const barW = 0;
    // Bordure
    ctx.strokeStyle='rgba(80,80,80,.6)'; ctx.lineWidth=.9*sx;
    ctx.strokeRect(lx,ly,lwC,lhEff);

    const leftX = lx + barW + 6 * sx;
    const fsName      = Math.max(11, Math.round(17 * sx));
    const fsTotal     = Math.max(10, Math.round(17 * sx));
    const fsIcon      = Math.max(12, Math.round(30 * sx));
    const fsIconDev   = Math.max(14, Math.round(25 * sx));   // meme taille que sur les reservoirs
    const fsDetail    = Math.max(10, Math.round(16 * sx));
    const fsMw        = Math.max(10, Math.round(17 * sx));
    const fsTrend     = Math.max(10, Math.round(15 * sx));
    const fontName      = 'bold ' + fsName  + 'px "Segoe UI",Arial,sans-serif';
    const fontDetail    = fsDetail    + 'px "Segoe UI",Arial,sans-serif';
    const fontMw        = 'bold ' + fsMw    + 'px "Segoe UI",Arial,sans-serif';
    const fontTotal     = 'bold ' + fsTotal + 'px "Segoe UI",Arial,sans-serif';

    // Couleurs pour les valeurs : intensite reduite pour mettre le nom en evidence
    const valCol = '#555';

    // Ligne 0 : icone rosace + nom de la centrale en gras.
    const fsCentrIcon = Math.max(12, Math.round(fsName * 1.40));
    const nameEndX = drawLeftSegments(ctx, [
      { icon: 'centrale', size: fsCentrIcon },
      { text: c.nomAffiche || c.nom, color: '#111' }
    ], leftX, ly + lh*0.0556, fontName);

    // Indicateur fermeture dans le coin haut-droit : toujours ▴ (ferme l'etiquette).
    const arrowXC = lx + lwC - 6*sx;
    const rowYC = ly + lh*0.0556;
    ctx.font = 'bold ' + fsArrow + 'px "Segoe UI",Arial,sans-serif';
    ctx.fillStyle = '#1a1a2e';
