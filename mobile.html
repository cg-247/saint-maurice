<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#1a1a2e;color:#eee;font-family:"Segoe UI",Arial,sans-serif;
          touch-action:manipulation;overscroll-behavior-y:contain}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

/* PULL-TO-REFRESH : indicateur visuel attache au geste (style moderne, comme
   Twitter/X, Instagram). Le body se translate pendant le drag ; un spinner
   apparait au-dessus, tourne avec la progression, puis spin actif pendant le
   refetch reseau. Pas de reload de page : on re-fetch les JSON en place. */
body.ptr-dragging{transition:none}
body.ptr-releasing{transition:transform .25s ease}
.ptr-indicator{position:fixed;top:8px;left:50%;width:32px;height:32px;
               margin-left:-16px;border-radius:50%;
               background:#22223e;border:1px solid #3a3a5e;
               box-shadow:0 2px 8px rgba(0,0,0,.4);
               display:flex;align-items:center;justify-content:center;
               color:#cdd;font-size:16px;font-weight:700;
               opacity:0;transform:translateY(-40px) rotate(0deg);
               transition:opacity .2s, transform .25s ease;
               pointer-events:none;z-index:20}
.ptr-indicator.armed{color:#fff;background:#4a6fa5;border-color:#5a82bf}
.ptr-indicator.spinning{animation:ptr-spin .8s linear infinite}
.ptr-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
           background:#22223e;color:#eee;border:1px solid #3a3a5e;
           padding:8px 14px;border-radius:18px;font-size:13px;
           box-shadow:0 4px 12px rgba(0,0,0,.4);
           opacity:0;transition:opacity .25s;pointer-events:none;z-index:21}
.ptr-toast.show{opacity:1}
.ptr-toast.err{border-color:#7a3030;color:#fbb}
@keyframes ptr-spin{from{transform:translateY(0) rotate(0deg)}
                    to  {transform:translateY(0) rotate(360deg)}}

/* HEADER sticky */
header{position:sticky;top:0;z-index:10;background:#1a1a2e;
       border-bottom:1px solid #2a2a4e;padding:10px 14px;
       display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:15px;font-weight:600;letter-spacing:.2px;color:#eee;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a#link-full{font-size:12px;color:#9ab;text-decoration:none;padding:6px 8px;
                   border:1px solid #3a3a5e;border-radius:6px;background:#22223e;
                   white-space:nowrap;min-height:32px;display:inline-flex;align-items:center}
header a#link-full:active{background:#2a2a4e}

/* CHIPS scrollables */
nav#chips{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
          padding:10px 12px;background:#1a1a2e;border-bottom:1px solid #2a2a4e;
          scroll-snap-type:x mandatory;
          -webkit-overflow-scrolling:touch;scrollbar-width:none}
nav#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:54px;height:48px;
      border-radius:24px;border:1px solid #3a3a5e;background:#22223e;color:#cdd;
      font-size:15px;font-weight:600;letter-spacing:.3px;cursor:pointer;
      scroll-snap-align:center;padding:0 14px;
      display:inline-flex;align-items:center;justify-content:center;
      transition:transform .12s, background .12s}
.chip:active{transform:scale(.94)}
.chip.sel{background:#4a6fa5;color:#fff;border-color:#5a82bf;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chip.sel.status-vert    {background:#1a6e2a;border-color:#2a8e3a}
.chip.sel.status-jaune   {background:#a08000;border-color:#c0a000}
.chip.sel.status-orange  {background:#a05500;border-color:#c07000}
.chip.sel.status-rouge   {background:#8a1010;border-color:#aa2020}

/* ETIQUETTE */
section#label{background:#fff;color:#1a1a2e;margin:12px;
              border-radius:10px;padding:14px 16px;
              box-shadow:0 2px 10px rgba(0,0,0,.25)}
#label.status-vert   {border-left:6px solid #1a6e2a}
#label.status-jaune  {border-left:6px solid #a08000}
#label.status-orange {border-left:6px solid #a05500}
#label.status-rouge  {border-left:6px solid #8a1010}
#label .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#label .nom{font-size:20px;font-weight:700;letter-spacing:.2px}
#label .cap{font-size:13px;color:#666;white-space:nowrap}
#label .line{margin-top:8px;font-size:16px;line-height:1.35;display:flex;
             align-items:center;gap:8px;flex-wrap:wrap}
#label .ico{font-size:18px;width:22px;text-align:center;flex-shrink:0}
#label .val{font-weight:600}
#label .unit{font-size:13px;color:#555;font-weight:400}
#label .sub{font-size:13px;color:#666;font-weight:400}
#label .stale{opacity:.45}
#label .trend-up   {color:#a01818;font-weight:600}
#label .trend-down {color:#1a6e1a;font-weight:600}
#label .trend-flat {color:#3a3a3a}
#label .stats{margin-top:10px;padding-top:8px;border-top:1px solid #e3e6ef;
              font-size:12px;color:#666;display:flex;gap:14px;flex-wrap:wrap}
#label .stats b{color:#1a1a2e;font-weight:600}

/* CANVAS */
section#chartWrap{flex:1 1 auto;background:#fff;color:#1a1a2e;margin:0 12px;
                  border-radius:10px;padding:8px;
                  box-shadow:0 2px 10px rgba(0,0,0,.25);
                  min-height:340px}
/* Le graphique peut etre plus large que l'ecran (un libelle par jour, toujours) :
   #chartScroll defile horizontalement, #axisCv reste fixe par-dessus et porte les
   axes Y, les titres et les legendes. */
#chartBox{position:relative;height:50vh;min-height:320px;max-height:520px}
#chartScroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;
             -webkit-overflow-scrolling:touch;scrollbar-width:thin}
canvas#bigCv{display:block;height:100%}
canvas#axisCv{position:absolute;left:0;top:0;pointer-events:none}

/* FOOTER */
footer{padding:14px;text-align:center;font-size:12px;color:#9ab;font-style:italic}
footer a{color:#bcd;text-decoration:underline}

/* ETAT chargement / erreur */
#status{padding:24px;text-align:center;color:#9ab;font-style:italic}
#chartBox.varOn{height:66vh;min-height:440px;max-height:700px}
#chartBox.varOn.split{height:80vh;min-height:520px;max-height:820px}   /* pluie et apport en 2 panneaux : boite plus haute */
#varCtl{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px 2px;font-size:12.5px;color:#333}
#varCtl select{font-size:13px;padding:2px 4px;margin-left:4px}
.hidden{display:none !important}
</style>

<script>
'use strict';

// Liens croises : en local (file:// ou serveur sur output/), l'index.html n'existe pas.
// On pointe alors directement vers animation-centrales.html (fichier voisin).
// Dans les deux cas on garde ?desktop=1 pour court-circuiter la redirection auto.
if (location.pathname.endsWith('animation-mobile.html')) {
  document.getElementById('link-full').href = 'animation-centrales.html?desktop=1';
}

// Lien "Details & sources" : en local, pointe vers le README.md voisin servi
// par notre serveur local. Sur GitHub Pages, garde le lien vers le repo source.
(function () {
  var lr = document.getElementById('link-readme');
  if (!lr) return;
  var isLocal = location.protocol === 'file:'
             || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
  if (isLocal) {
    lr.href = 'README.md';
    lr.removeAttribute('target');
    lr.removeAttribute('rel');
    lr.title = 'Apercu local du README publie';
  }
})();

// Codes 2 lettres par ID HQ (ordre amont->aval defini par le tri visuel ci-dessous).
const CODES = {
  '3-178':'CA', '3-180':'RC', '3-82':'RB', '3-83':'TR',
  '3-84':'BM',  '3-85':'LT',  '3-89':'GM', '3-90':'SH', '3-91':'GA'
};
// Ordre des chips : SUD -> NORD (La Gabelle, pres du Saint-Laurent, en premier ;
// Chute-Allard, le plus en amont, en dernier). Inverse du sens de l'eau qui coule.
const ORDER = ['3-91','3-90','3-89','3-85','3-84','3-83','3-82','3-180','3-178'];
const FALLBACK_ID = '3-83';   // Trenche, milieu du bassin
const STORE_KEY   = 'hq-mobile-centrale';

// --- Etat global ---
let D = null;            // dataset de la vue active { centrales, timestamps, periode, ... }
let N = 0;               // nb de frames de la vue active
let selectedIdx = -1;    // index dans D.centrales de la centrale selectionnee
let frame = 0;           // toujours = N-1 (derniere frame disponible)
let views = {};          // { horaire, journalier, hebdomadaire } -> dataset ou null
let dataStamp = null;    // manifest.generatedAt du dernier chargement (detecte les vrais changements)
let lastFetchAt = -1e9;  // performance.now() du dernier fetch reussi (garde-fou anti-spam du re-fetch auto)

// Affiche la date "Mise a jour" a partir du generatedAt du manifest (ISO UTC).
// La date vient des DONNEES, pas du HTML statique : dans une PWA installee le HTML est
// servi depuis le cache du SW et ne se rafraichit pas a chaque visite, alors que le
// manifest est refetch. En lisant la date du manifest, l'etiquette suit la fraicheur
// reelle des donnees. Conversion en heure locale Quebec (America/Montreal) independante
// du fuseau de l'appareil.
function setGeneratedAt(iso) {
  const el = document.getElementById('generatedAt');
  if (!el || !iso) return;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return;
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Montreal',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(d).reduce((o, p) => (o[p.type] = p.value, o), {});
  const hh = parts.hour === '24' ? '00' : parts.hour;
  el.textContent = 'Mise à jour : ' + parts.year + '-' + parts.month + '-' + parts.day + ' ' + hh + ':' + parts.minute;
}

// --- Helpers ---
// ----- Palette des SERIES : une grandeur = une teinte, partout -----
// DOIT rester identique au bloc SERIES de animation.html.tpl. Les deux templates
// sont des fichiers separes (pas de module partage), donc toute modification ici
// doit etre repercutee la-bas — sinon un meme utilisateur voit deux codes couleur
// selon qu'il ouvre la version bureau ou la version mobile.
const SERIES = {
  turbine: { line: 'rgba(46,160,67,.85)',  solid: '#1a6e2a', label: 'Turbiné' },
  deverse: { line: 'rgba(40,110,200,.90)', solid: '#1a3060', label: 'Déversé' },
  // Orange : cf. le commentaire detaille dans animation.html.tpl (le cyan
  // precedent etait trop proche de la pluie, avec qui il partage un panneau).
  apport:  { line: 'rgba(230,120,20,.90)', solid: '#a8560c', label: 'Apport naturel' },
  pluie:   { line: 'rgba(90,150,220,.85)', solid: '#3a6ea5', label: 'Pluie' },
  neutre:  { line: 'rgba(140,140,140,.95)', solid: '#666',   label: 'N/D' }
};

// Choisit le coin d'une zone ou un bloc (boxW x boxH) masque le moins de donnees.
// Identique a pickCorner() dans animation.html.tpl — garder les deux alignees.
function pickCorner(zone, boxW, boxH, series, yOf, xOf, avoidX) {
  const { x0, y0, w, h } = zone;
  // 4 coins + 2 centres (haut/bas) : le centre est souvent la zone la plus degagee.
  const cx0 = x0 + (w - boxW) / 2;
  const cands = [
    { x: x0 + 4,             y: y0 + 4 },
    { x: cx0,                y: y0 + 4 },
    { x: x0 + w - boxW - 4,  y: y0 + 4 },
    { x: x0 + 4,             y: y0 + h - boxH - 4 },
    { x: cx0,                y: y0 + h - boxH - 4 },
    { x: x0 + w - boxW - 4,  y: y0 + h - boxH - 4 }
  ];
  const margin = 8;
  for (const co of cands) {
    let score = 0;
    const bx0 = co.x - margin, bx1 = co.x + boxW + margin;
    const by0 = co.y - margin, by1 = co.y + boxH + margin;
    for (const serie of series) {
      if (!serie) continue;
      for (let i = 0; i < serie.length; i++) {
        const v = serie[i];
        if (v == null) continue;
        const px = xOf(i), py = yOf(v);
        if (px >= bx0 && px <= bx1 && py >= by0 && py <= by1) score++;
      }
    }
    co.score = score;
    co.distX = (avoidX == null) ? 0 : Math.abs((co.x + boxW / 2) - avoidX);
  }
  cands.sort((a, b) => (a.score - b.score) || (b.distX - a.distX));
  return cands[0];
}

// Epaisseur d'un trait de stem-plot selon la densite de points : evite qu'une serie
// dense (vue Heure = 48 points, mais Jour = 15 sur un ecran etroit) se lise comme une
// aire pleine. Identique a la fonction du meme nom dans animation.html.tpl.
function stemWidth(plotW, nPts, base) {
  if (nPts <= 1) return base;
  const pas = plotW / (nPts - 1);
  return Math.max(0.4, Math.min(base, pas * 0.7));
}

// --- Acces aux frames meteo, tolerant aux deux formes ---
// Depuis l'ajout des mesures par station (v2.15.0), frames[i] est un OBJET
// { z:[zones], s:[stations] }. Avant, c'etait directement le TABLEAU des zones.
// Cet accesseur absorbe les deux formes, comme meteoZoneFrame() du template
// bureau : sans lui, l'indexation numerique fr[zi] tombait sur undefined avec la
// nouvelle forme, pluieSerie() retournait null et TOUT le panneau du bas (pluie
// ET apport naturel, qui l'a rejoint en v2.14.0) disparaissait du graphique.
// Les datasets deja rendus et les tranches mensuelles en cache navigateur
// (servies par le service worker) restent lisibles sans re-rendu.
function meteoZoneFrame(i) {
  const fr = (D && D.meteo && D.meteo.frames) ? D.meteo.frames[i] : null;
  if (!fr) return null;
  return Array.isArray(fr) ? fr : (fr.z || null);   // forme ancienne : tableau nu
}

// Serie de pluie 24 h (mm) d'une zone meteo + son max. Identique a la fonction du
// meme nom dans animation.html.tpl — garder les deux alignees.
// Retourne DEUX series, comme la fonction homonyme du template bureau :
//   vals / max   = cumul 24 h glissant (p24) — le total, tracé en courbe
//   hVals / hMax = pluie du pas de temps (p1) — quand il a plu, tracé en barres
// Pourquoi les deux : le cumul glissant repete la meme valeur pendant 24 h apres une
// averse courte. Une averse de 4 h le 11 aout 2026 (22 + 7 + 0,4 + 0 mm) produisait
// 24 barres identiques a 29,7 mm, qui se lisaient comme une pluie continue.
// ⚠ Garder alignee sur animation.html.tpl : les deux templates sont des fichiers
// separes (pas de module partage), un ecart ferait divergent bureau et mobile.
function pluieSerie(zoneKey) {
  if (!zoneKey || !D || !D.meteo || !D.meteo.zones || !D.meteo.frames) return null;
  const zi = D.meteo.zones.findIndex(z => z.key === zoneKey);
  if (zi < 0) return null;
  const n = D.meteo.frames.length;
  const out = new Array(n).fill(null);
  const outH = new Array(n).fill(null);
  let mx = 0, mxH = 0;
  for (let k = 0; k < n; k++) {
    const fr = meteoZoneFrame(k);
    if (!fr || !fr[zi]) continue;
    const v = fr[zi].p24;
    if (v != null) { out[k] = v; if (v > mx) mx = v; }
    // p1 absent des datasets rendus avant son ajout : repli sur le seul cumul.
    const v1 = fr[zi].p1;
    if (v1 != null) { outH[k] = v1; if (v1 > mxH) mxH = v1; }
  }
  if (mx <= 0 && mxH <= 0) return null;
  return { vals: out, max: mx, hVals: mxH > 0 ? outH : null, hMax: mxH };
}

function statusClass(c, val) {
  if (val == null || c.minTotal == null || c.maxTotal == null) return '';
  const span = c.maxTotal - c.minTotal;
  if (span <= 0) return '';
  const r = (val - c.minTotal) / span * 100;
  // Memes seuils que ratioColor() dans animation.html.tpl — garder les deux alignes.
  if (r < 40) return 'status-vert';
  if (r < 65) return 'status-jaune';
  if (r < 85) return 'status-orange';
  return 'status-rouge';
}
function statusStroke(c, val) {
  switch (statusClass(c, val)) {
    case 'status-vert':   return '#1a6e2a';
    case 'status-jaune':  return '#7a6200';
    case 'status-orange': return '#7a3a00';
    case 'status-rouge':  return '#6a0000';
    default:              return '#555';
  }
}
// Calque "derniere valeur connue" : si val[i] est null, renvoie la derniere valeur non-null.
// Retourne aussi un flag stale = true si on a du remonter dans le passe.
function effectiveAt(arr, i) {
  if (arr[i] != null) return { v: arr[i], stale: false };
  for (let k = i - 1; k >= 0; k--) {
    if (arr[k] != null) return { v: arr[k], stale: true };
  }
  return { v: null, stale: false };
}
function fmtInt(v) { return (v == null) ? '—' : Math.round(v); }
function computeStats(arr) {
  let mn = Infinity, mx = -Infinity, sum = 0, n = 0;
  for (const v of arr) { if (v == null) continue; if (v < mn) mn = v; if (v > mx) mx = v; sum += v; n++; }
  return { min: n ? mn : null, max: n ? mx : null, avg: n ? sum / n : null, n };
}

// Tronque une vue aux N derniers points (timestamps + toutes les series par centrale).
// Idempotent : si la vue est plus courte que N, ne fait rien.
function trimView(view, n) {
  if (!view || !Array.isArray(view.timestamps)) return;
  const total = view.timestamps.length;
  if (total <= n) return;
  const start = total - n;
  view.timestamps = view.timestamps.slice(start);
  (view.centrales || []).forEach(c => {
    // 'apports' doit etre tronque comme les autres series : sinon la serie reste
    // plus longue que timestamps et le trace de l'apport se decale vers la gauche
    // par rapport aux debits (indices desalignes).
    ['debits','turbs','devs','mws','trends','stables','apports'].forEach(k => {
      if (Array.isArray(c[k])) c[k] = c[k].slice(start);
    });
    // Manoeuvres (variations de debit) : leur 1er champ est un indice de frame ; on retire
    // celles d'avant la fenetre et on decale les autres.
    if (Array.isArray(c.man)) {
      c.man = c.man.filter(m => m[0] >= start).map(m => [m[0] - start].concat(m.slice(1)));
    }
  });
  // Meme raison pour la meteo, indexee [frame][zone] et donc alignee sur timestamps.
  if (view.meteo && Array.isArray(view.meteo.frames)) {
    view.meteo.frames = view.meteo.frames.slice(start);
  }
}

// Concatene la vue horaire du mois precedent + mois courant pour pouvoir
// afficher 15 j glissants meme a cheval sur 2 mois. Aligne les centrales par ID.
function mergeHoraire(prev, curr) {
  if (!prev) return curr;
  if (!curr) return prev;
  const merged = {
    timestamps: prev.timestamps.concat(curr.timestamps),
    centrales: curr.centrales.map(cc => {
      const pc = prev.centrales.find(p => p.id === cc.id);
      const pad = pc ? null : new Array(prev.timestamps.length).fill(null);
      const j = k => (pc ? pc[k] : pad).concat(cc[k] || []);
      // man : indices de frame du mois courant decales du nombre de frames du mois precedent
      const off = prev.timestamps.length;
      const manM = (pc && pc.man ? pc.man : []).concat((cc.man || []).map(m => [m[0] + off].concat(m.slice(1))));
      return Object.assign({}, cc, {
        man:     (pc && pc.man) || cc.man ? manM : undefined,
        debits:  j('debits'),
        turbs:   j('turbs'),
        devs:    j('devs'),
        mws:     j('mws'),
        trends:  cc.trends  ? j('trends')  : undefined,
        stables: cc.stables ? j('stables') : undefined,
        apports: cc.apports ? j('apports') : undefined
      });
    })
  };
  // Meteo : concatener aussi les frames, sinon la serie de pluie est plus courte
  // que timestamps apres la fusion et se retrouve decalee. Si le mois precedent
  // n'a pas de meteo, on rembourre avec des frames nulles de la bonne longueur.
  if (curr.meteo && Array.isArray(curr.meteo.frames)) {
    const zones = curr.meteo.zones || [];
    // p1 comme p24 : la frame de remplissage doit porter les MEMES champs que les
    // vraies, sinon un futur test sur p1 verrait 'undefined' au lieu de null.
    // Forme { z:[...] } comme les frames reelles depuis la v2.15.0 : un tableau nu
    // resterait lisible via la branche de compatibilite de meteoZoneFrame(), mais
    // melanger les deux formes dans un meme tableau de frames est un piege.
    const nullFrame = { z: zones.map(() => ({ n: null, tmn: null, tmx: null, p24: null, p1: null })) };
    const prevFrames = (prev.meteo && Array.isArray(prev.meteo.frames))
      ? prev.meteo.frames
      : new Array(prev.timestamps.length).fill(nullFrame);
    merged.meteo = { zones: zones.slice(), frames: prevFrames.concat(curr.meteo.frames) };
  }
  // Conserve les autres champs scalaires de curr (periode, trendUnit, etc.).
  Object.keys(curr).forEach(k => {
    if (!(k in merged)) merged[k] = curr[k];
  });
  return merged;
}

// --- Chargement des donnees (factorise pour reutilisation par pull-to-refresh) ---
// opts.forceNetwork=true : bypasse le service worker (cache:'reload'), pour
// que le pull-to-refresh ne ramene pas le cache stale. Defaut: false (init
// normal, le SW peut servir le cache pour une ouverture instantanee).
async function loadData(opts) {
  const init = (opts && opts.forceNetwork) ? { cache: 'reload' } : undefined;
  const j = (url) => fetch(url, init).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + url); return r.json(); });

  const manifest = await j('data/manifest.json');
  const month = manifest.latestMonth;
  const months = manifest.months || [];
  const currEntry = months.find(m => m.month === month);
  const currFile = (currEntry && currEntry.file) || (month + '-horaire.json');
  const idx = months.findIndex(m => m.month === month);
  const prevEntry = (idx > 0) ? months[idx - 1] : null;

  const fetches = [
    j('data/' + currFile),
    j('data/sommaire.json')
  ];
  if (prevEntry) fetches.push(j('data/' + prevEntry.file).catch(() => null));
  const [horaireCurr, sommaire, horairePrev] = await Promise.all(fetches);
  const horaire = mergeHoraire(horairePrev || null, horaireCurr);

  const v = {
    horaire:      horaire || null,
    journalier:   sommaire.journalier   || null,
    hebdomadaire: sommaire.hebdomadaire || null
  };
  Object.entries(v).forEach(([k, view]) => { if (view && typeof view === 'object') view.periode = k; });
  // Min / moy / max : sur TOUT l'historique journalier (comme la modale du bureau), calcules AVANT la troncature des vues.
  const statsAll = {};
  if (v.journalier && v.journalier.centrales) v.journalier.centrales.forEach(cc => { statsAll[cc.id] = computeStats(cc.debits || []); });
  // 30 jours (720 h) charges, defilables ; la fenetre visible en montre 10 (VIS_DAYS, cf. drawBigChart).
  trimView(v.horaire,     720);
  trimView(v.journalier,   10);
  trimView(v.hebdomadaire,  6);
  Object.values(v).forEach(view => { if (view && view.centrales) view.centrales.forEach(cc => { cc.statsAll = statsAll[cc.id] || null; }); });
  // Empreinte de generation : sert a detecter un vrai changement de donnees.
  v._stamp = manifest.generatedAt || null;
  lastFetchAt = performance.now();
  return v;
}

// --- Chargement initial ---
async function init() {
  try {
    views = await loadData();
    dataStamp = views._stamp;
    setGeneratedAt(dataStamp);

    // Selection initiale : localStorage ou fallback Trenche (sur la vue Heure
    // qui contient toujours toutes les centrales).
    const savedId = localStorage.getItem(STORE_KEY) || FALLBACK_ID;
    selectedIdx = views.horaire.centrales.findIndex(c => c.id === savedId);
    if (selectedIdx < 0) selectedIdx = views.horaire.centrales.findIndex(c => c.id === FALLBACK_ID);
    if (selectedIdx < 0) selectedIdx = 0;

    // Vue Heure seule : plus de selecteur de periode (les vues Jour et Semaine ne sont plus offertes sur mobile).
    setPeriode('horaire');

    buildChips();
    document.getElementById('status').classList.add('hidden');
    document.getElementById('label').classList.remove('hidden');
    document.getElementById('chartWrap').classList.remove('hidden');
    render();
    // Centrer la chip selectionnee dans le scroll
    setTimeout(() => {
      const sel = document.querySelector('.chip.sel');
      if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
    }, 0);
  } catch (e) {
    document.getElementById('status').textContent = 'Erreur de chargement : ' + e.message;
  }
}

// --- Refetch en place (declenche par pull-to-refresh). Bypasse le SW pour
// garantir des donnees fraiches, met a jour `views` et re-rend sans
// recharger la page. Throw si le reseau echoue (l'appelant gere le toast). ---
// Retourne true si les donnees ont reellement change (empreinte differente), false
// sinon. Ne re-rend QUE si quelque chose a change : un re-fetch identique ne provoque
// aucun clignotement. Throw si le reseau echoue (l'appelant gere le toast/erreur).
async function refreshData() {
  const fresh = await loadData({ forceNetwork: true });
  const changed = (fresh._stamp == null) || (fresh._stamp !== dataStamp);
  if (!changed) return false;
  views = fresh;
  dataStamp = fresh._stamp;
  setGeneratedAt(dataStamp);
  // Re-aligne selectedIdx (la liste des centrales devrait etre identique, mais
  // on se protege contre un changement d'ordre).
  if (selectedIdx >= 0 && views.horaire) {
    const oldId = (D && D.centrales[selectedIdx]) ? D.centrales[selectedIdx].id : null;
    if (oldId) {
      const ni = views.horaire.centrales.findIndex(c => c.id === oldId);
      if (ni >= 0) selectedIdx = ni;
    }
  }
  // Reactive la vue courante (ou horaire par defaut) avec les nouvelles donnees.
  const curKey = (D && D.periode) || 'horaire';
  setPeriode(views[curKey] ? curKey : 'horaire');
  buildChips();
  render();
  return true;
}

// Bascule la vue active. Conserve la centrale selectionnee si elle existe dans
// la nouvelle vue ; sinon fallback sur le 1er index disponible.
function setPeriode(key) {
  if (!views[key]) return;
  D = views[key];
  N = D.timestamps.length;
  frame = N - 1;
  bigScrollReset = true;
  // Re-aligne selectedIdx sur la centrale par son ID (les vues peuvent ne pas
  // partager le meme ordre, meme si en pratique elles le partagent).
  if (selectedIdx >= 0 && views.horaire && views.horaire.centrales[selectedIdx]) {
    const id = views.horaire.centrales[selectedIdx].id;
    const newIdx = D.centrales.findIndex(c => c.id === id);
    if (newIdx >= 0) selectedIdx = newIdx;
  }
  // Re-render seulement si l'init est termine (render() lit le DOM #label).
  if (!document.getElementById('label').classList.contains('hidden')) render();
}

// --- Chips ---
function buildChips() {
  const nav = document.getElementById('chips');
  nav.innerHTML = '';
  // On respecte l'ordre amont->aval defini dans ORDER, en ne gardant que celles presentes.
  const byId = {};
  D.centrales.forEach((c, i) => { byId[c.id] = i; });
  const ordered = ORDER.filter(id => id in byId).map(id => byId[id]);
  // Ajoute en fin toute centrale presente dans D mais absente de ORDER (cas de bordure).
  D.centrales.forEach((c, i) => { if (!ORDER.includes(c.id)) ordered.push(i); });

  ordered.forEach(idx => {
    const c = D.centrales[idx];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.dataset.idx = idx;
    btn.textContent = CODES[c.id] || c.nom.slice(0, 2).toUpperCase();
    btn.setAttribute('aria-label', c.nom);
    btn.addEventListener('click', () => selectIdx(idx));
    nav.appendChild(btn);
  });
}

function selectIdx(idx) {
  selectedIdx = idx;
  bigScrollReset = true;
  const c = D.centrales[idx];
  localStorage.setItem(STORE_KEY, c.id);
  render();
}

// --- Render etiquette + graphique ---
function render() {
  const c = D.centrales[selectedIdx];
  const i = frame;
  const debCur = c.debits[i];
  const statCls = statusClass(c, debCur);

  // Mise a jour visuelle des chips
  document.querySelectorAll('.chip').forEach(btn => {
    const idx = parseInt(btn.dataset.idx, 10);
    btn.classList.toggle('sel', idx === selectedIdx);
    btn.classList.remove('status-vert','status-jaune','status-orange','status-rouge');
    if (idx === selectedIdx && statCls) btn.classList.add(statCls);
  });

  // Etiquette
  const lab = document.getElementById('label');
  lab.classList.remove('status-vert','status-jaune','status-orange','status-rouge');
  if (statCls) lab.classList.add(statCls);

  const eDeb  = effectiveAt(c.debits, i);
  const eTurb = effectiveAt(c.turbs,  i);
  const eDev  = effectiveAt(c.devs,   i);
  const eMw   = effectiveAt(c.mws,    i);
  const tr    = c.trends ? c.trends[i] : null;
  const stab  = c.stables ? c.stables[i] : null;
  const trUnit = D.trendUnit || '6h';
  const stats  = c.statsAll || computeStats(c.debits);   // tout l'historique, comme le bureau
  const mwPct  = (eMw.v != null && c.cap_mw) ? Math.round(eMw.v / c.cap_mw * 100) : null;

  let trendHtml = '<span class="trend-flat">—</span>';
  if (tr != null) {
    if (tr > 50) {
      trendHtml = '<span class="trend-up">+' + Math.round(tr) + ' m³/s en ' + trUnit + '</span>';
    } else if (tr < -50) {
      trendHtml = '<span class="trend-down">' + Math.round(tr) + ' m³/s en ' + trUnit + '</span>';
    } else {
      const unit = { horaire:'h', journalier:'j', hebdomadaire:'sem', mensuel:'mois' }[D.periode] || 'h';
      // stab peut etre une chaine ('">72h"' en horaire) : le suffixe est deja inclus.
      const stTxt = (stab == null) ? 'stable'
                  : (typeof stab === 'string' ? 'stable depuis ' + stab
                                              : 'stable depuis ' + stab + unit);
      trendHtml = '<span class="trend-flat">' + stTxt + '</span>';
    }
  }

  lab.innerHTML =
    '<div class="row">' +
      '<div class="nom">' + escapeHtml(c.nom) + '</div>' +
      (c.cap_mw ? '<div class="cap">' + c.cap_mw + ' MW install&eacute;s</div>' : '') +
    '</div>' +
    '<div class="line' + (eDeb.stale ? ' stale' : '') + '">' +
      '<span class="ico">💧</span>' +
      '<span class="val">' + fmtInt(eDeb.v) + '</span><span class="unit">m³/s total</span>' +
    '</div>' +
    '<div class="line' + ((eTurb.stale && eDev.stale) ? ' stale' : '') + '">' +
      '<span class="ico">⚙️</span>' +
      '<span class="val">' + fmtInt(eTurb.v) + '</span><span class="unit">turbin&eacute;</span>' +
      '<span style="width:6px"></span>' +
      '<span class="ico">🫗</span>' +
      '<span class="val">' + fmtInt(eDev.v) + '</span><span class="unit">d&eacute;vers&eacute;</span>' +
    '</div>' +
    '<div class="line' + (eMw.stale ? ' stale' : '') + '">' +
      '<span class="ico">⚡</span>' +
      '<span class="val">' + fmtInt(eMw.v) + '</span><span class="unit">MW' +
      (mwPct != null ? ' (' + mwPct + ' %)' : '') + '</span>' +
    '</div>' +
    '<div class="line">' +
      '<span class="ico">📈</span>' + trendHtml +
    '</div>' +
    '<div class="stats">' +
      '<span>min <b>' + fmtInt(stats.min) + '</b></span>' +
      '<span>moy <b>' + fmtInt(stats.avg) + '</b></span>' +
      '<span>max <b>' + fmtInt(stats.max) + '</b></span>' +
    '</div>';

  drawBigChart();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// --- Graphique grand format (derive de drawBigChart() du template desktop) ---
// Simplifications mobile : pas de bande "futur" (frame = N-1 toujours),
// pas de curseur vertical (toujours sur la derniere frame, en bout de courbe),
// legende fixe en haut-gauche (pas de tri par chevauchement), padding gauche reduit.
const bigCv  = document.getElementById('bigCv');
const bigCtx = bigCv.getContext('2d');
const axisCv  = document.getElementById('axisCv');
const axisCtx = axisCv.getContext('2d');
// var (et non let) : setPeriode()/selectIdx() peuvent l'ecrire avant que
// l'execution n'atteigne cette ligne.
var bigScrollReset = true;

// ----- Variations de debit (ouvertures / fermetures de vannes), vues Heure et Jour -----
// ⚠ INFEREES du debit total : Hydro-Quebec ne publie pas la position des vannes. c.man = liste creuse
// [frame, delta, heureFin, dTurb, dDev, turbApres, devApres, pkHeure] calculee par render-animation.ps1.
// Meme calcul que modalChain() du template bureau : la variation affichee est l'ecart entre deux niveaux
// affiches consecutifs, et une variation sous le seuil s'ajoute a la suivante.
// Choix (non conserves entre deux visites) : mode « Total quotidien » et filtre 50 m3/s au depart.
// Un seul mode (largeur d'ecran limitee) : journee courante (derniere de la vue) = toutes les variations affichees ; jours precedents = total quotidien.
const varMode = 'manoeuvre';   // plus de total quotidien : toutes les manoeuvres
const varMinSel = document.getElementById('varMin');
varMinSel.add(new Option('Toutes', 0));
for (let v = 50; v <= 2000; v += 50) varMinSel.add(new Option('≥ ' + v.toLocaleString('fr-CA') + ' m³/s', v));
varMinSel.value = '50';
varMinSel.addEventListener('change', () => { if (D) drawBigChart(); });
function varChain(c, mn, mode) {
  const man = c.man || [], dk = f => String(D.timestamps[f] || '').slice(0, 10);
  let raw = [];
  // Mode « mixte » : les 2 derniers jours de la vue gardent toutes leurs manoeuvres, les precedents sont totalises par jour.
  const dayList = []; for (let i = 0; i < D.timestamps.length; i++) { const d = dk(i); if (dayList[dayList.length - 1] !== d) dayList.push(d); }
  const recent = new Set(mode === 'mixte' ? dayList.slice(-1) : []);   // journee courante seulement
  if (mode === 'jour' || mode === 'mixte') {
    const by = new Map();
    for (const m of man) {
      const d = dk(m[0]);
      if (recent.has(d)) { raw.push({ f: m[0], det: m[1], hr: m[2], lT: m[5] || 0, lD: m[6] || 0 }); continue; }
      let q = by.get(d);
      if (!q) { q = { f: m[0], mx: -1, net: 0, hr: null, lT: 0, lD: 0 }; by.set(d, q); }
      q.net += m[1];
      // Niveau du jour = le PLUS HAUT atteint (et non celui de fin de journee : une pointe d'une heure, comme le pic d'une
      // crue, disparaitrait). Heure et frame : celles de la manoeuvre qui atteint ce niveau.
      const lvm = (m[5] || 0) + (m[6] || 0);
      if (lvm > q.mx) { q.mx = lvm; q.f = m[0]; q.hr = m[2]; q.lT = m[5] || 0; q.lD = m[6] || 0; }
    }
    raw = raw.concat([...by.values()].map(q => ({ f: q.f, det: q.net, hr: q.hr, lT: q.lT, lD: q.lD }))).sort((a, b) => a.f - b.f);
  } else raw = man.map(m => ({ f: m[0], det: m[1], hr: m[2], lT: m[5] || 0, lD: m[6] || 0 }));
  const out = []; let last = null;
  for (const it of raw) {
    const lv = it.lT + it.lD, d = last === null ? it.det : lv - last;
    if (mn > 0 && Math.abs(d) < mn) continue;
    out.push({ f: it.f, delta: d, hr: it.hr, lT: it.lT, lD: it.lD }); last = lv;
  }
  return out;
}

function drawBigChart() {
  if (selectedIdx < 0 || !D) return;
  const c = D.centrales[selectedIdx];
  const arr = c.debits;
  // Panneau Variations : vues Heure et Jour seulement. Le conteneur est agrandi AVANT toute mesure de hauteur.
  const varOnM = (D.periode === 'horaire' || D.periode === 'journalier') && Array.isArray(c.man);
  document.getElementById('varCtl').classList.toggle('hidden', !varOnM);
  document.getElementById('chartBox').classList.toggle('varOn', varOnM);

  // pad.l = 64 : assez large pour un label "NNNN m³/s" (4 chiffres + unite) en
  // textAlign='right' a pad.l - 6. Avec pad.l=50, les centrales a fort debit
  // (Grand-Mere yMax~2800) avaient leur premier chiffre clippe hors canvas.
  // pad.r : 64 des qu'un apport est publie, pour loger l'axe m3/s de DROITE du
  // panneau du bas (les paliers portent l'unite : '420 m³/s' fait ~48 px a 10 px).
  // hasApportM est calcule ici, avant pad, parce que la marge en depend.
  const hasApportM = !!(c.apports && c.maxApport);
  const splitM = varOnM && hasApportM && !!pluieSerie(c.zoneMeteo);   // pluie et apport en 2 graphiques separes
  document.getElementById('chartBox').classList.toggle('split', splitM);
  // Vues Heure et Jour : l'axe X ne porte que 'MM/JJ' sur UNE ligne (ni heure
  // accolee, ni 2e ligne '(HH:mm)') — voir fmtTickParts(). b:30 suffit alors, et
  // les 12 px liberes reviennent au graphe. Ailleurs (Semaine/Mois) on garde 42
  // pour loger la 2e ligne des ticks — la borne horaire d'une journee partielle,
  // posee sous la date par drawTick(). Avec 30, elle tombait sous le bord du
  // canvas et etait tronquee.
  const dateOnlyM = (D.periode === 'horaire' || D.periode === 'journalier');
  // Marges mesurees sur le texte reel des echelles (8 px) plutot que fixes : le maximum de place revient au graphe.
  // Le libelle de reference a 4 chiffres + unite est le plus large possible (debits >= 1000 m3/s).
  axisCtx.font = '8px "Segoe UI",Arial';
  const scaleW = Math.ceil(axisCtx.measureText('0000 m³/s').width);
  const pad = { l: scaleW + 8, r: 8, t: varOnM ? 18 : 8, b: dateOnlyM ? 30 : 42 };

  // Ticks X : format NUMERIQUE 'MM/JJ', identique a dateAxe() du template bureau.
  // ⚠ Garder alignee sur animation.html.tpl (fonction dateAxe) : les deux templates
  // sont des fichiers separes, sans module partage.
  //   horaire      'yyyy-MM-dd HH:mm'          -> 'MM/JJ HH:mm'
  //   journalier   'yyyy-MM-dd'                -> 'MM/JJ'
  //   hebdomadaire 'yyyy-MM-dd -> yyyy-MM-dd'  -> 'MM/JJ -> MM/JJ'
  //   mensuel      'yyyy-MM'                   -> 'yyyy-MM' tel quel (sans jour,
  //                                              l'annee est la seule mise en contexte)
  // Remplace l'ancien format textuel ('23 juin', 'sem. du 17 aout'), qui divergeait
  // du bureau et rendait la lecture croisee des deux versions inconfortable.
  // Definies avant le dimensionnement : la largeur du graphe depend de celle des libelles.
  const fmtTick = (ts) => {
    if (!ts) return '';
    const s = String(ts);
    // Vue mois ('yyyy-MM' sans jour qui suit) : on garde l'annee.
    if (/^\d{4}-\d{2}(?!-)/.test(s)) return s;
    // Autres vues : on retire l'annee de CHAQUE date presente (la vue semaine en
    // contient deux, d'ou le remplacement global).
    return s.replace(/(\d{4})-(\d{2})-(\d{2})/g, '$2/$3');
  };
  // Separe un libelle en { main, sub }, comme dateAxeParts() du bureau :
  //   main = 'MM/JJ' (ou 'MM/JJ HH:mm', 'MM/JJ -> MM/JJ', 'yyyy-MM')
  //   sub  = '(HH:mm)' pour une journee partielle, sinon ''
  // Le suffixe est sorti du libelle principal pour etre pose sur une 2e ligne :
  // en une seule ligne, il doublait la largeur du dernier tick et chevauchait ses
  // voisins. Le libelle source est "AAAA-MM-JJ — jusqu'a HH:mm" avec tiret
  // cadratin, apostrophe typographique et 'a' accentue ; le motif tolere les
  // variantes, sinon le suffixe resterait sur la 1re ligne.
  // '00:00' est rendu '24:00' : la borne appartient a la journee affichee.
  // En vues Heure et Jour, l'axe X mobile ne porte QUE la date 'MM/JJ' : l'heure
  // du point (vue Heure) et la 2e ligne '(HH:mm)' des journees partielles sont
  // supprimees. Ecran etroit : deux lignes de tick et un suffixe horaire
  // surchargeaient l'axe pour une precision inutile a cette taille. Les vues
  // Semaine/Mois gardent le comportement d'origine (elles n'ont ni l'un ni l'autre).
  const fmtTickParts = (ts) => {
    if (!ts) return { main: '', sub: '' };
    const s = String(ts);
    const m = s.match(/^(.*?)\s*[—–-]\s*jusqu['’]\s*[aàÀA]\s*(\d{1,2}:\d{2})\s*$/i);
    // Retire l'heure accolee a la date ('MM/JJ HH:mm' -> 'MM/JJ').
    const stripH = (x) => dateOnlyM ? x.replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '') : x;
    if (!m) return { main: stripH(fmtTick(s)), sub: '' };
    const hhmm = m[2] === '00:00' ? '24:00' : m[2];
    return { main: stripH(fmtTick(m[1])), sub: dateOnlyM ? '' : '(' + hhmm + ')' };
  };

  // ---- Dimensionnement : graphe defilable horizontalement ----
  // La largeur du graphe n'est plus celle de l'ecran : elle doit loger UN libelle
  // par jour (vue Heure) ou par point (vues Jour/Semaine), sans en sauter. Si
  // l'ecran est trop etroit, #chartScroll defile et s'ouvre sur la fin (donnees
  // recentes). Les axes Y, titres et legendes sont traces sur #axisCv, fixe
  // par-dessus, pour rester lisibles pendant le defilement.
  const scrollEl = bigCv.parentElement;
  const atEnd = scrollEl.scrollLeft >= scrollEl.scrollWidth - scrollEl.clientWidth - 2;
  const viewW = scrollEl.clientWidth;
  const innerWView = Math.max(1, viewW - pad.l - pad.r);
  const xSpan = Math.max(1, N - 1);
  const cx = bigCtx;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.font = '6px "Segoe UI",Arial';
  let lblW = 0;
  for (let i = 0; i < N; i++) {
    lblW = Math.max(lblW, cx.measureText(fmtTickParts(String(D.timestamps[i] || '')).main).width);
  }
  // Points par libelle : 1 en Jour/Semaine ; en Heure, le nombre de points d'une
  // journee complete (max par jour : les journees partielles des bornes en ont moins).
  let ptsPerTick = 1;
  if (D.periode === 'horaire') {
    const cnt = {};
    for (let i = 0; i < N; i++) {
      const d = String(D.timestamps[i] || '').slice(0, 10);
      cnt[d] = (cnt[d] || 0) + 1;
    }
    for (const k in cnt) ptsPerTick = Math.max(ptsPerTick, cnt[k]);
  }
  // 1,5 x libelle + 12 : le 1er tick est aligne a gauche (texte entier a droite de
  // son ancre) et le 2e centre ; c'est la paire la plus exigeante (cf. gapFor).
  const pxPerPt = (1.5 * lblW + 12) / ptsPerTick;
  const innerW0 = Math.max(innerWView, Math.ceil(xSpan * pxPerPt));
  // Panneau Variations : colonnes de JOURS de largeur egale (colW). Seule la JOURNEE COURANTE (derniere colonne) est
  // elargie pour loger toutes ses variations, chacune dans une colonne fixe (SUB_W) : toutes les barres ont la meme
  // largeur. Tous les panneaux lisent la meme table de positions (xTab).
  const SUB_W = 34;
  const VIS_DAYS = 10;   // jours visibles a l'ecran (le reste se defile)
  const dkM = i => String(D.timestamps[i] || '').slice(0, 10);
  const chainM = varOnM ? varChain(c, +varMinSel.value, varMode) : [];
  const lastDayM = dkM(N - 1);
  const curItems = chainM.filter(it => dkM(it.f) === lastDayM);
  let curLeft = 0, innerW = innerW0, colW = 0, xTab = null, dayCtr = null;
  if (varOnM) {
    const dayListM = []; for (let i = 0; i < N; i++) { const d = dkM(i); if (dayListM[dayListM.length - 1] !== d) dayListM.push(d); }
    const nd = dayListM.length, dIdx = new Map(dayListM.map((d, k) => [d, k]));
    const jourW = D.periode === 'journalier';
    const need = curItems.length * SUB_W;
    if (nd > 1 && (jourW || D.periode === 'horaire')) {
      // Vue Heure : l'ecran montre toujours VIS_DAYS jours (10) ; le graphe en couvre davantage (30) et defile. La colonne
      // courante prend sa place (need) et les autres se partagent le reste, jusqu'a un plancher de 14 px.
      const visN = Math.min(VIS_DAYS, nd);
      colW = Math.max(14, Math.min(innerWView / visN, visN > 1 ? (innerWView - need) / (visN - 1) : innerWView));
    } else {
      colW = Math.max(jourW ? pxPerPt : pxPerPt * ptsPerTick, innerWView / nd);
    }
    const curW = Math.max(colW, need);
    xTab = new Array(N);
    for (let i = 0; i < N; i++) {
      const k = dIdx.get(dkM(i)), w = (k === nd - 1) ? curW : colW;
      const hh = jourW ? 12 : (parseInt(String(D.timestamps[i]).slice(11, 13), 10) || 0);
      xTab[i] = pad.l + k * colW + (jourW ? w / 2 : (hh / 24) * w);
    }
    curLeft = pad.l + (nd - 1) * colW + (curW - need) / 2;
    innerW = (nd - 1) * colW + curW;
    dayCtr = new Map(dayListM.map((d, k) => [d, pad.l + k * colW + colW / 2]));   // centre de la colonne de chaque jour
    dayCtr.set(dayListM[nd - 1], pad.l + (nd - 1) * colW + curW / 2);   // colonne courante elargie : son centre est celui de curW
  }
  const cssW = pad.l + innerW + pad.r;
  bigCv.style.width = cssW + 'px';
  // Hauteur lue APRES la largeur : une barre de defilement (bureau) peut la reduire.
  const cssH = scrollEl.clientHeight;
  // Resolution retina : on multiplie la taille en pixels par devicePixelRatio
  // pour eviter le flou sur ecrans haute densite, tout en gardant la taille CSS inchangee.
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  bigCv.width  = Math.round(cssW * dpr);
  bigCv.height = Math.round(cssH * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  axisCv.style.width  = viewW + 'px';
  axisCv.style.height = cssH + 'px';
  axisCv.width  = Math.round(viewW * dpr);
  axisCv.height = Math.round(cssH * dpr);
  const ax = axisCtx;
  ax.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = cssW, h = cssH;
  cx.clearRect(0, 0, w, h);
  ax.clearRect(0, 0, viewW, h);
  // Bandes blanches sous les axes Y : les donnees qui defilent passent dessous.
  ax.fillStyle = '#fff';
  ax.fillRect(0, 0, pad.l, h);
  ax.fillRect(viewW - pad.r, 0, pad.r, h);
  // Decalage du canvas defilant quand il est cale sur la fin (position d'ouverture) :
  // sert a placer les legendes de #axisCv d'apres les donnees alors visibles.
  const maxScroll = Math.max(0, cssW - viewW);
  const xOfView = i => xOf(i) - maxScroll;

  // Deux panneaux empiles : DEBITS (2/3) en haut, PLUIE (1/3) en bas, axe X partage.
  // Meme structure que la modale du template bureau (hydrogramme + hyetogramme) :
  // la pluie est en mm, la superposer aux debits imposerait une echelle croisee.
  const plM = pluieSerie(c.zoneMeteo);
  const rainH = plM ? (splitM ? 0.40 : 0.33) : 0;
  const rainGap = plM ? (varOnM ? 32 : 26) : 0;   // plus serre qu'au bureau : hauteur ecran limitee (32 : l'heure des variations passe dans cet espace)
  const varH = varOnM ? 96 : 0, varGap = varOnM ? 22 : 0;

  // Echelle Y : max combine sur les 3 series (debit total, turbine, deverse) + 5 %.
  // Echelle DYNAMIQUE : max de la periode chargee (30 jours en vue Heure), et non le max historique de la centrale
  // (c.maxTotal) qui aplatissait la courbe du mois quand une crue plus forte existe ailleurs dans l'historique.
  let yMaxRaw = 1;
  for (const v of c.debits) { if (v != null && v > yMaxRaw) yMaxRaw = v; }
  for (const v of c.turbs) { if (v != null && v > yMaxRaw) yMaxRaw = v; }
  for (const v of c.devs)  { if (v != null && v > yMaxRaw) yMaxRaw = v; }
  const yMax = Math.max(200, yMaxRaw + Math.max(50, yMaxRaw * 0.05));   // plancher : l'axe (qui part de 100 avec les variations) garde une etendue
  const totalH = h - pad.t - pad.b;
  const innerH = Math.round((totalH - rainGap - varH - varGap) * (1 - rainH));
  const varTop = pad.t + innerH + varGap;
  const rainTop = (varOnM ? varTop + varH : pad.t + innerH) + rainGap;
  const rainInnerHAll = Math.max(0, totalH - innerH - varGap - varH - rainGap);
  const SPLIT_GAP = 24;   // espace du titre du 2e panneau (apport)
  const rainInnerH = splitM ? Math.max(0, Math.floor((rainInnerHAll - SPLIT_GAP) / 2)) : rainInnerHAll;
  const apInnerH = splitM ? Math.max(0, rainInnerHAll - SPLIT_GAP - rainInnerH) : 0;
  const xOf = i => xTab ? xTab[i] : pad.l + (i / xSpan) * innerW0;   // avec les variations : colonnes de jours (xTab)
  const yMin = varOnM ? 100 : 0;   // avec les variations, le debit total ne descend jamais a 0 : l'axe debute a 100 m3/s (comme au bureau)
  const yOf = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * innerH;

  // Grille horizontale + ticks Y (5 lignes)
  // (grille sur le canvas defilant, libelles sur #axisCv, fixe)
  cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
  ax.fillStyle = '#666'; ax.font = '8px "Segoe UI",Arial';
  ax.textAlign = 'right'; ax.textBaseline = 'middle';
  for (let g = 0; g <= 5; g++) {
    const y = pad.t + (g / 5) * innerH;
    cx.beginPath(); cx.moveTo(pad.l, y); cx.lineTo(pad.l + innerW, y); cx.stroke();
    ax.fillText(Math.round(yMin + (yMax - yMin) * (1 - g / 5)) + ' m³/s', pad.l - 6, y);
  }
  // Pointilles verticaux entre les jours (vues Heure et Jour) : a mi-chemin entre le dernier point d'un jour et le
  // premier du suivant. Un meme jeu de x pour les trois panneaux (debits, variations, pluie), trace entre y0 et y1.
  const daySepX = [];
  if (D.periode === 'horaire' || D.periode === 'journalier') {
    for (let i = 1; i < N; i++) if (dkM(i) !== dkM(i - 1)) daySepX.push((xOf(i - 1) + xOf(i)) / 2);
  }
  const drawDaySeps = (y0, y1) => {
    if (!daySepX.length || y1 <= y0) return;
    cx.save(); cx.strokeStyle = '#c3c8d6'; cx.lineWidth = 1; cx.setLineDash([2, 3]);
    cx.beginPath();
    for (const x of daySepX) { const xx = Math.round(x) + 0.5; cx.moveTo(xx, y0); cx.lineTo(xx, y1); }
    cx.stroke(); cx.restore();
  };
  drawDaySeps(pad.t, pad.t + innerH);

  // Trace un tick sur une ou deux lignes : la date en taille normale, la borne
  // horaire d'une journee partielle en dessous, plus petite et discrete.
  // ~0.78x la taille de base (minimum 6px), comme drawTickLabel() du bureau.
  // Restaure police et couleur en sortie.
  const drawTick = (ts, x, y, baseFont) => {
    const p = fmtTickParts(ts);
    cx.fillText(p.main, x, y);
    if (!p.sub) return;
    const prevFont = cx.font, prevFill = cx.fillStyle;
    const mSize = /(\d+(?:\.\d+)?)px/.exec(baseFont || cx.font);
    const size = mSize ? Math.max(6, Math.round(parseFloat(mSize[1]) * 0.78)) : 6;
    cx.font = (baseFont || cx.font).replace(/(\d+(?:\.\d+)?)px/, size + 'px');
    cx.fillStyle = '#999';
    cx.fillText(p.sub, x, y + size + 3);
    cx.font = prevFont; cx.fillStyle = prevFill;
  };
  cx.fillStyle = '#666';
  cx.textAlign = 'center'; cx.textBaseline = 'top';
  // Avec les colonnes de jours (variations) : la date est CENTREE dans la colonne de son jour, entre les pointilles, et
  // non posee sur la 1re heure ; plus de libelle colle aux bords (le centre de colonne laisse la place).
  const xT = i => (dayCtr ? dayCtr.get(dkM(i)) : xOf(i));
  const ALIGN_EDGES = !dayCtr;

  // En vue Heure : un tick par jour calendaire (a la premiere heure disponible
  // de chaque jour), libelle court 'dd mois' (sans heure, qui varie selon le
  // point retenu). En vue Jour : un tick par point (deja une granularite
  // journaliere). Espacement minimal calcule a partir de la largeur REELLE du
  // texte (cx.measureText) plutot qu'une constante : le premier/dernier tick
  // sont alignes gauche/droite (le texte s'etend d'un seul cote de l'ancre),
  // les intermediaires sont centres (le texte s'etend des deux cotes) — une
  // marge fixe sous-estimerait le chevauchement avec le tick de gauche colle au bord.
  const gapFor = (prevAlign, prevW, nextAlign, nextW) => {
    // Distance mini entre deux ancres x pour que les boites de texte ne se
    // touchent pas, selon l'alignement de chacune (left/center/right).
    const half = (align, wpx) => align === 'center' ? wpx / 2 : wpx;
    return half(prevAlign, prevW) + half(nextAlign, nextW) + 6; // 6px de marge visuelle
  };
  cx.font = '6px "Segoe UI",Arial';
  let tickIdx;
  if (D.periode === 'horaire') {
    // Un candidat de tick par jour calendaire (1er point de chaque jour), le
    // dernier candidat etant toujours remplace par N-1 (le vrai dernier point
    // de la fenetre affichee, ex. midi) pour ne jamais dupliquer le jour final.
    const dayOf = (ts) => (ts || '').slice(0, 10);
    const dayIdx = [];
    let lastDay = null;
    for (let i = 0; i < N; i++) {
      const day = dayOf(D.timestamps[i]);
      if (day === lastDay) continue;
      lastDay = day;
      dayIdx.push(i);
    }
    dayIdx[dayIdx.length - 1] = N - 1;
    // 1re journee trop partielle pour loger son libelle (aligne a gauche) avant celui
    // du 2e jour : on sacrifie le sien plutot que celui d'une journee complete.
    if (dayIdx.length > 2) {
      const w0 = cx.measureText(fmtTickParts(String(D.timestamps[dayIdx[0]] || '')).main).width;
      const w1 = cx.measureText(fmtTickParts(String(D.timestamps[dayIdx[1]] || '')).main).width;
      if (xT(dayIdx[1]) - xT(dayIdx[0]) < gapFor(ALIGN_EDGES ? 'left' : 'center', w0, 'center', w1)) dayIdx.shift();
    }
    tickIdx = [];
    let lastX = -Infinity, lastAlign = 'left', lastW = 0;
    for (let k = 0; k < dayIdx.length; k++) {
      const i = dayIdx[k];
      const isFirst = tickIdx.length === 0;
      const isLast = k === dayIdx.length - 1;
      const align = !ALIGN_EDGES ? 'center' : (isFirst ? 'left' : (isLast ? 'right' : 'center'));
      const w = cx.measureText(fmtTickParts(String(D.timestamps[i] || '')).main).width;
      const x = xT(i);
      if (!isFirst && !isLast && x - lastX < gapFor(lastAlign, lastW, align, w)) continue;
      tickIdx.push(i);
      lastX = x; lastAlign = align; lastW = w;
    }
    // Le dernier candidat peut avoir ete saute par la boucle ci-dessus s'il
    // etait trop proche de l'avant-dernier tick retenu : on le force quand
    // meme (fin de la fenetre affichee), en retirant l'avant-dernier tick
    // choisi s'ils se chevauchent vraiment une fois les deux en alignement final.
    const lastDayIdx = dayIdx[dayIdx.length - 1];
    if (tickIdx[tickIdx.length - 1] !== lastDayIdx) {
      const prev = tickIdx[tickIdx.length - 1];
      const prevW = cx.measureText(fmtTickParts(String(D.timestamps[prev] || '')).main).width;
      const lastW = cx.measureText(fmtTickParts(String(D.timestamps[lastDayIdx] || '')).main).width;
      if (tickIdx.length > 1 && xT(lastDayIdx) - xT(prev) < gapFor('center', prevW, ALIGN_EDGES ? 'right' : 'center', lastW)) {
        tickIdx.pop();
      }
      tickIdx.push(lastDayIdx);
    }
  } else if (D.periode === 'journalier' || D.periode === 'hebdomadaire') {
    // Un candidat de tick par point (deja une granularite journaliere ou
    // hebdomadaire) ; espacement dynamique identique a la vue Heure, le
    // libelle hebdomadaire ('sem. du d mois') etant plus long que 'd mois'.
    tickIdx = [];
    let lastX = -Infinity, lastAlign = 'left', lastW = 0;
    for (let i = 0; i < N; i++) {
      const isFirst = tickIdx.length === 0;
      const isLast = i === N - 1;
      const align = !ALIGN_EDGES ? 'center' : (isFirst ? 'left' : (isLast ? 'right' : 'center'));
      const w = cx.measureText(fmtTickParts(String(D.timestamps[i] || '')).main).width;
      const x = xT(i);
      if (!isFirst && !isLast && x - lastX < gapFor(lastAlign, lastW, align, w)) continue;
      tickIdx.push(i);
      lastX = x; lastAlign = align; lastW = w;
    }
    if (tickIdx[tickIdx.length - 1] !== N - 1) tickIdx.push(N - 1);
  } else {
    tickIdx = [];
    const xTicks = 4;
    for (let g = 0; g <= xTicks; g++) {
      tickIdx.push(Math.round((g / xTicks) * (N - 1)));
    }
  }
  // Alignement des libelles : le premier et dernier tick sont colles aux bords
  // (gauche/droite) pour eviter que le texte deborde du canvas ; les ticks
  // intermediaires restent centres sur leur position.
  for (let k = 0; k < tickIdx.length; k++) {
    const i = tickIdx[k];
    const x = xT(i);
    // Premier/dernier tick colles au bord (gauche/droite) pour eviter que le
    // texte deborde du canvas ; intermediaires centres. S'applique a toutes
    // les periodes (le libelle 'MM/JJ -> MM/JJ' en hebdomadaire est assez
    // long pour deborder aux extremites s'il restait centre).
    if (ALIGN_EDGES && tickIdx.length > 1) {
      if (k === 0)                       cx.textAlign = 'left';
      else if (k === tickIdx.length - 1) cx.textAlign = 'right';
      else                               cx.textAlign = 'center';
    } else {
      cx.textAlign = 'center';
    }
    drawTick(String(D.timestamps[i] || ''), x, h - pad.b + 6, '6px "Segoe UI",Arial');
    if (varOnM) { cx.save(); cx.textBaseline = 'top'; cx.fillText(fmtTickParts(String(D.timestamps[i] || '')).main, x, 4); cx.restore(); }   // meme date en haut de la colonne du debit total
  }

  // Couleur de la courbe debit total = statut courant (ratio min/max).
  const dCur = arr[frame];
  const stroke = statusStroke(c, dCur);
  const turbCol = SERIES.turbine.line;
  const devCol  = SERIES.deverse.line;

  const drawSeriesBig = (series, color, lw) => {
    cx.beginPath();
    cx.strokeStyle = color; cx.lineWidth = lw;
    let st = false;
    for (let i = 0; i < N; i++) {
      const v = series[i]; if (v == null) { st = false; continue; }
      const xx = xOf(i), yy = yOf(v);
      if (!st) { cx.moveTo(xx, yy); st = true; } else { cx.lineTo(xx, yy); }
    }
    cx.stroke();
  };
  // NB : l'apport naturel n'est plus trace ici. Il a rejoint le panneau du bas, aux
  // cotes de la pluie, avec sa propre echelle m3/s a droite : les deux decrivent
  // l'eau qui ARRIVE dans le bassin, alors que ce panneau montre ce qui en SORT
  // (turbine, deverse). Meme regroupement que dans le template bureau.
  // (hasApportM est declare plus haut, avec pad : la marge droite en depend.)

  if (!varOnM) {   // avec les variations, turbine et deverse sont portes par le panneau Variations (comme au bureau)
  drawSeriesBig(c.turbs, turbCol, 2);
  drawSeriesBig(c.devs,  devCol,  2);

  // Courbe debit total (dominante)
  cx.beginPath();
  cx.strokeStyle = stroke; cx.lineWidth = 2.4;
  let started = false;
  for (let i = 0; i < N; i++) {
    const v = arr[i]; if (v == null) { started = false; continue; }
    const xx = xOf(i), yy = yOf(v);
    if (!started) { cx.moveTo(xx, yy); started = true; } else { cx.lineTo(xx, yy); }
  }
  cx.stroke();

  // Point sur la derniere valeur (frame = N-1) avec label "X m³/s".
  if (dCur != null) {
    const xCur = xOf(frame), yCur = yOf(dCur);
    cx.fillStyle = stroke;
    cx.beginPath(); cx.arc(xCur, yCur, 4, 0, 2 * Math.PI); cx.fill();
    cx.fillStyle = '#222'; cx.font = 'bold 12px "Segoe UI",Arial';
    const valTxt = Math.round(dCur) + ' m³/s';
    const txtW = cx.measureText(valTxt).width;
    const fitsRight = (xCur + 6 + txtW) <= (pad.l + innerW - 2);
    cx.textAlign = fitsRight ? 'left' : 'right';
    cx.textBaseline = 'bottom';
    cx.fillText(valTxt, xCur + (fitsRight ? 6 : -6), yCur - 4);
  }
  }

  // ===== PANNEAU DES VARIATIONS (entre debits et pluie), axe X partage =====
  // Barres = NIVEAU atteint apres la variation (turbine vert + deverse bleu), ▲ ouverture / ▼ fermeture
  // et variation (m3/s) au-dessus, heure de fin dessous. Total quotidien : une barre par jour ; Par heure :
  // une par manoeuvre (cote a cote dans le jour en vue Jour).
  if (varOnM) {
    const jourV = D.periode === 'journalier';
    const pxDayM = colW, pxPtM = jourV ? colW : colW / 24;
    const COLO = '#d9640a', COLF = '#1d5e8c';
    const BWM = 4;   // largeur UNIQUE de toutes les bandes (variations, pluie, apport) : 4 px
    const items = [];
    const prevByDay = new Map();   // jours precedents : toutes les manoeuvres, cote a cote au centre de la colonne du jour
    for (const it of chainM) {
      const d = dkM(it.f);
      if (d === lastDayM) continue;   // journee courante : colonnes fixes ci-dessous
      if (!prevByDay.has(d)) prevByDay.set(d, []);
      prevByDay.get(d).push(it);
    }
    for (const [d, list] of prevByDay) {
      const sub = Math.min(SUB_W, colW / list.length);
      list.forEach((it, j) => items.push({ day: d, x: jourV ? xOf(it.f) : dayCtr.get(d) + (j - (list.length - 1) / 2) * sub, bw: BWM, delta: it.delta, hr: it.hr, lT: it.lT, lD: it.lD }));
    }
    curItems.forEach((it, j) => items.push({ day: lastDayM, x: curLeft + (j + 0.5) * SUB_W, bw: BWM, delta: it.delta, hr: it.hr, lT: it.lT, lD: it.lD }));
    items.sort((a, b) => a.x - b.x);
    // Courbe du debit total par les niveaux affiches (le niveau persiste : prolongee a plat jusqu'au bord), avec le
    // debit total ecrit a chaque point, comme au bureau.
    cx.save(); cx.beginPath(); cx.rect(pad.l, pad.t - 14, innerW, innerH + 14); cx.clip();
    {
      const pts = items.map(it => [it.x, yOf(it.lT + it.lD)]);
      // Debut de courbe : depuis le bord gauche, au debit reel de la 1re heure de la fenetre. Sans cela la ligne ne
      // commencait qu'a la 1re variation retenue, et manquait tant qu'il n'y en avait pas (ou sur toute la fenetre).
      const d0 = (c.debits && c.debits[0] != null) ? c.debits[0] : null;
      if (d0 != null) pts.unshift([pad.l, yOf(d0)]);
      // Fin de courbe au debit REEL (c.dFin : dernier debit horaire connu) : les niveaux affiches sont ceux d'apres chaque
      // variation retenue par le filtre, donc le dernier peut etre perime de quelques m3/s sous le seuil.
      const lastLv = items.length ? items[items.length - 1].lT + items[items.length - 1].lD : null;
      const endOn = c.dFin != null && (lastLv == null || Math.round(c.dFin) !== Math.round(lastLv));   // sans aucune variation : debut -> fin au debit reel
      const endX = pad.l + innerW - 6;
      if (endOn) pts.push([endX, yOf(c.dFin)]);
      else if (pts.length) pts.push([pad.l + innerW, pts[pts.length - 1][1]]);
      if (pts.length > 1) {
        cx.beginPath(); cx.strokeStyle = stroke; cx.lineWidth = 3.1; cx.lineJoin = 'round';
        pts.forEach((p, i) => { if (i) cx.lineTo(p[0], p[1]); else cx.moveTo(p[0], p[1]); });
        cx.stroke();
      }
      cx.font = 'bold 8px "Segoe UI",Arial'; cx.textAlign = 'center'; cx.textBaseline = 'bottom';
      // Valeurs ecrites sur la courbe : si elles ne tiennent pas toutes, on PRIORISE le plus haut et le plus bas niveau de
      // chaque jour (le plus haut au-dessus du point, le plus bas en dessous) ; les autres ne sont ecrits que s'il reste de la place.
      const lvOf = it => it.lT + it.lD;
      const dayExt = new Map();
      for (const it of items) {
        const e = dayExt.get(it.day);
        if (!e) dayExt.set(it.day, { hi: it, lo: it });
        else { if (lvOf(it) > lvOf(e.hi)) e.hi = it; if (lvOf(it) < lvOf(e.lo)) e.lo = it; }
      }
      const shownL = new Set(), upXs = [];   // upXs : x et demi-largeur des etiquettes deja posees au-dessus des points
      const putL = (it, below) => {
        const yy = yOf(lvOf(it)), txtL = String(Math.round(lvOf(it)));
        cx.textBaseline = below ? 'top' : 'bottom';
        cx.strokeStyle = '#fff'; cx.lineWidth = 3; cx.strokeText(txtL, it.x, below ? yy + 6 : yy - 6);
        cx.fillStyle = '#222'; cx.fillText(txtL, it.x, below ? yy + 6 : yy - 6);
        if (!below) upXs.push({ x: it.x, w: cx.measureText(txtL).width });
        shownL.add(it);
      };
      for (const it of items) { cx.fillStyle = stroke; cx.beginPath(); cx.arc(it.x, yOf(lvOf(it)), 3, 0, 6.3); cx.fill(); }
      for (const e of dayExt.values()) { putL(e.hi, false); if (e.lo !== e.hi) putL(e.lo, true); }
      for (const it of items) {
        if (shownL.has(it)) continue;
        const tw = cx.measureText(String(Math.round(lvOf(it)))).width;
        if (jourV || upXs.every(u => Math.abs(it.x - u.x) >= (u.w + tw) / 2 + 3)) putL(it, false);
      }
      cx.textBaseline = 'bottom';
      if (endOn) {   // point final = debit reel ; etiquette sous le point si elle toucherait celle du dernier niveau
        const yy = yOf(c.dFin), txtE = String(Math.round(c.dFin)), tw = cx.measureText(txtE).width;
        const pv = items[items.length - 1], close = !!pv && (endX - pv.x) < tw + 4;
        cx.fillStyle = stroke; cx.beginPath(); cx.arc(endX, yy, 3, 0, 6.3); cx.fill();
        cx.textAlign = 'right'; cx.textBaseline = close ? 'top' : 'bottom';
        cx.strokeStyle = '#fff'; cx.lineWidth = 3; cx.strokeText(txtE, pad.l + innerW - 2, close ? yy + 6 : yy - 6);
        cx.fillStyle = '#222'; cx.fillText(txtE, pad.l + innerW - 2, close ? yy + 6 : yy - 6);
        cx.textAlign = 'center';
      }
    }
    cx.restore();
    let mxL = 1; for (const it of items) mxL = Math.max(mxL, it.lT + it.lD);
    const tickL = [50, 100, 200, 250, 500, 1000, 2000].find(t => mxL * 1.4 / t <= 3) || 2000;
    const yMaxL = Math.ceil(mxL * 1.4 / tickL) * tickL;
    const YL = v => varTop + varH * (1 - v / yMaxL);
    cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(pad.l, YL(0)); cx.lineTo(pad.l + innerW, YL(0)); cx.stroke();
    drawDaySeps(varTop, varTop + varH);
    cx.save(); cx.beginPath(); cx.rect(pad.l, varTop - 18, innerW, varH + 18 + 16); cx.clip();
    for (const it of items) {
      cx.fillStyle = SERIES.turbine.line; cx.fillRect(it.x - it.bw / 2, YL(it.lT), it.bw, Math.max(0, varH * it.lT / yMaxL));
      if (it.lD > 0.5) { cx.fillStyle = SERIES.deverse.line; cx.fillRect(it.x - it.bw / 2, YL(it.lT + it.lD), it.bw, Math.max(1, varH * it.lD / yMaxL)); }
    }
    // Chaque variation garde sa valeur et son triangle : quand deux etiquettes se toucheraient (colonne chargee), la
    // suivante est decalee vers le haut sur une autre rangee (3 rangees), au lieu d'etre omise.
    const lastXr = [-1e9, -1e9, -1e9]; let lastXh = -1e9;
    for (const it of items) {
      const up = it.delta >= 0, yb = Math.max(varTop + 26, YL(it.lT + it.lD) - 5);
      const txt = (it.delta > 0 ? '+' : '−') + Math.abs(Math.round(it.delta));
      cx.font = 'bold 4px "Segoe UI",Arial';
      const tw = cx.measureText(txt).width;
      let r = lastXr.findIndex(lx => it.x - lx >= tw + 3);
      if (r < 0) r = lastXr.indexOf(Math.min(...lastXr));   // aucune rangee libre : la moins recente
      const y = yb - r * 9;
      cx.textAlign = 'center'; cx.textBaseline = 'bottom'; cx.fillStyle = up ? COLO : COLF;
      cx.strokeStyle = '#fff'; cx.lineWidth = 3;
      cx.strokeText(txt, it.x, y); cx.fillText(txt, it.x, y);
      cx.font = '3px "Segoe UI",Arial';
      const tri = up ? '▲' : '▼';
      cx.strokeText(tri, it.x, y - 4.5); cx.fillText(tri, it.x, y - 4.5);
      lastXr[r] = it.x;
      if (it.hr != null) {
        cx.font = '6px "Segoe UI",Arial'; const hT = it.hr + ' h';
        if (it.x - lastXh >= cx.measureText(hT).width + 2) { cx.fillStyle = '#5d6b76'; cx.textBaseline = 'top'; cx.fillText(hT, it.x, varTop + varH + 3); lastXh = it.x; }
      }
    }
    cx.restore();
    // Titre fixe (sur #axisCv) + legende des triangles
    ax.fillStyle = '#1a1a2e'; ax.font = 'bold 11px "Segoe UI",Arial';
    ax.textAlign = 'left'; ax.textBaseline = 'bottom';
    const tVar = 'Variations (m³/s)';
    ax.fillText(tVar, pad.l, varTop - 3);   // la legende ▲ / ▼ est dans le cadre du panneau des debits, comme au bureau
  }

  // ===== PANNEAU DU BAS : PLUIE 24 h (1/3), axe X partage =====
  // Orientation normale (barres du bas vers le haut), titre + legende comme le
  // panneau des debits. Meme structure que drawRainPanel() du template bureau,
  // en version compacte (polices reduites, pas de curseur : le mobile est toujours
  // sur la derniere frame).
  if (plM && rainInnerH > 8) {
    const topY = rainTop;
    const base = rainTop + rainInnerH;
    // Echelle Y arrondie sur une echelle 1-2-5, pour que les paliers tombent sur des
    // nombres ronds. 5 paliers comme drawRainPanel du template bureau (qui sert a la
    // fois aux centrales et aux reservoirs) : avec 4, le sommet arrondi tombait sur
    // un multiple different pour un meme maximum — Grand-Mere (849 m3/s) donnait un
    // axe a 2000 sur mobile contre 1000 au bureau, soit des traits d'apport ecrases
    // de moitie et deux graphiques impossibles a comparer.
    const RAIN_ROWS_M = 5;
    const apInRain = hasApportM && !splitM;   // apport dans le panneau pluie (ancienne presentation) sauf avec 2 panneaux
    // Avec les colonnes de jours (variations) : UNE barre de pluie (cumul du jour, mm) et UNE barre d'apport (valeur du jour)
    // par colonne, de meme largeur que les barres du panneau Variations ; echelles recalculees sur ces valeurs du jour.
    let rainDay = null, apDay = null, rainSrcMax = plM.max;
    if (varOnM && dayCtr) {
      rainDay = new Map(); apDay = new Map();
      for (let i = 0; i < N; i++) {
        const d = dkM(i), rv = plM.hVals ? plM.hVals[i] : plM.vals[i];
        if (rv != null && rv > 0) rainDay.set(d, plM.hVals ? (rainDay.get(d) || 0) + rv : Math.max(rainDay.get(d) || 0, rv));
        const av = hasApportM ? c.apports[i] : null;
        if (av != null && av > 0) apDay.set(d, Math.max(apDay.get(d) || 0, av));
      }
      rainSrcMax = 0; for (const v of rainDay.values()) rainSrcMax = Math.max(rainSrcMax, v);
      rainSrcMax = Math.max(rainSrcMax, 1);
    }
    const BWD = 4;   // = BWM : meme largeur que toutes les bandes du panneau Variations
    const stepRawM = rainSrcMax / RAIN_ROWS_M;
    const p10M = Math.pow(10, Math.floor(Math.log10(Math.max(0.1, stepRawM))));
    let stepM = p10M;
    for (const mult of [1, 2, 5, 10]) { stepM = mult * p10M; if (stepM >= stepRawM) break; }
    const yTopM = stepM * RAIN_ROWS_M;
    const decM = stepM >= 1 ? 0 : 1;
    // Grille + paliers (au lieu des deux seuls reperes 0 / max).
    cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
    ax.fillStyle = '#666'; ax.font = '8px "Segoe UI",Arial';
    ax.textAlign = 'right';
    for (let g = 0; g <= RAIN_ROWS_M; g++) {
      const y = topY + (g / RAIN_ROWS_M) * rainInnerH;
      cx.beginPath(); cx.moveTo(pad.l, y); cx.lineTo(pad.l + innerW, y); cx.stroke();
      // Avec un apport : les deux echelles partagent la colonne de GAUCHE (plus de marge a droite) ; le palier en mm est
      // ecrit au-dessus du trait et celui de l'apport (m3/s) dessous.
      if (apInRain) { ax.textBaseline = 'bottom'; ax.fillText((yTopM * (1 - g / RAIN_ROWS_M)).toFixed(decM) + ' mm', pad.l - 6, y - 1); continue; }
      ax.textBaseline = (g === 0) ? 'top' : 'middle';
      ax.fillText((yTopM * (1 - g / RAIN_ROWS_M)).toFixed(decM) + ' mm', pad.l - 6, y + (g === 0 ? 1 : 0));
    }
    drawDaySeps(topY, topY + rainInnerH);
    // Titre au-dessus du cadre (fixe, sur #axisCv).
    ax.fillStyle = '#1a1a2e'; ax.font = 'bold 11px "Segoe UI",Arial';
    ax.textAlign = 'left'; ax.textBaseline = 'bottom';
    // « mm » seul et non « mm/24h » : les barres portent la pluie du pas de temps,
    // le cumul 24 h est desormais la courbe (cf. legende du panneau).
    ax.fillText(apInRain ? 'Pluie du jour (mm) et apport (m³/s)' : 'Pluie du jour (mm)', pad.l, topY - 3);
    // Deux formes pour deux lectures, sur la MEME echelle mm :
    //   BARRES = pluie tombee pendant le pas de temps (p1) -> quand il a plu
    //   COURBE = cumul 24 h glissant (p24)                 -> combien au total
    const plBarsM = plM.hVals || plM.vals;   // repli si p1 absent (vieux dataset)
    // Avec les variations (comme la modale d'une centrale au bureau) : bandes pleines de meme largeur que les
    // barres du panneau Variations, sans courbe de cumul 24 h.
    // Jour : meme largeur que les barres du panneau Variations. Heure : une barre par heure, donc tres fines (pluie a gauche
    // du point, apport a droite : 2 barres par pas de colW / 24).
    const bwRM = varOnM ? (D.periode === 'journalier' ? Math.min(18, colW * 0.5) * 0.6 : Math.max(1, colW / 24 * 0.9)) : 0;
    cx.strokeStyle = SERIES.pluie.line;
    cx.fillStyle = SERIES.pluie.line;
    cx.lineWidth = stemWidth(innerW, N, 3);
    cx.beginPath();
    if (rainDay) for (const [d, v] of rainDay) { const hh = Math.min(1, v / yTopM) * rainInnerH; cx.fillRect(dayCtr.get(d) - (splitM ? BWD / 2 : BWD + 0.5), base - hh, BWD, hh); }
    else for (let i = 0; i < N; i++) {
      const v = plBarsM[i];
      if (v == null || v <= 0) continue;
      const xx = xOf(i);
      if (bwRM) { const hh = Math.min(1, v / yTopM) * rainInnerH; cx.fillRect(xx - bwRM - 0.5, base - hh, bwRM, hh); continue; }
      cx.moveTo(xx, base);
      cx.lineTo(xx, base - Math.min(1, v / yTopM) * rainInnerH);
    }
    cx.stroke();
    // Courbe du cumul 24 h par-dessus les barres, seulement si on a les deux series.
    if (plM.hVals && plM.vals && !bwRM) {
      cx.save();
      cx.strokeStyle = SERIES.pluie.solid;
      cx.lineWidth = 1.3;
      cx.globalAlpha = .85;
      cx.beginPath();
      let startedM = false;
      for (let i = 0; i < N; i++) {
        const v = plM.vals[i];
        if (v == null) { startedM = false; continue; }
        const xx = xOf(i), yy = base - Math.min(1, v / yTopM) * rainInnerH;
        if (startedM) cx.lineTo(xx, yy); else { cx.moveTo(xx, yy); startedM = true; }
      }
      cx.stroke();
      cx.restore();
    }
    // ---- APPORT NATUREL : 2e serie, echelle propre en m3/s a DROITE ----
    let apTopM = 0;
    if (apInRain) {
      // Echelle DYNAMIQUE (mobile seulement) : calibree sur le max de la FENETRE
      // visible, pas sur c.maxApport (max historique de la centrale). Sur un
      // panneau qui ne fait qu'un tiers d'une hauteur deja reduite, une fenetre
      // calme rapportee a la crue printaniere donnait une bande ecrasee a ~7 %
      // de la hauteur, illisible.
      //
      // Deux garde-fous contre le sautillement d'echelle qui avait motive le max
      // historique a l'origine (cf. maxApportByC dans render-animation.ps1) :
      //   1. l'arrondi au palier propre 1/2/5x10^n ci-dessous ne laisse l'echelle
      //      prendre que des valeurs discretes — elle ne bouge qu'au franchissement
      //      d'un palier, pas a chaque frame ;
      //   2. un plancher a 1/8 du max historique borne le facteur de zoom, pour
      //      qu'une pointe de quelques m3/s ne remplisse pas le panneau comme une
      //      crue et qu'il reste une notion d'echelle absolue.
      let apWinM = 0;
      for (let i = 0; i < N; i++) {
        const v = c.apports[i];
        if (v != null && v > apWinM) apWinM = v;
      }
      // Avec les variations : meme regle que la modale d'une centrale au bureau (max de la fenetre, minimum 1 m3/s),
      // sans le plancher 1/8 du max historique.
      const apRefM = varOnM ? Math.max(apWinM, 1) : Math.max(apWinM, c.maxApport / 8);
      const apStepRawM = apRefM / RAIN_ROWS_M;
      const ap10M = Math.pow(10, Math.floor(Math.log10(Math.max(0.1, apStepRawM))));
      let apStepM = ap10M;
      for (const mult of [1, 2, 5, 10]) { apStepM = mult * ap10M; if (apStepM >= apStepRawM) break; }
      apTopM = apStepM * RAIN_ROWS_M;
      // Leger decalage : pluie et apport tombant le meme jour se masqueraient.
      const dxM = Math.min(2, Math.max(1, innerW / Math.max(1, N) * 0.35));
      cx.strokeStyle = SERIES.apport.line;
      cx.lineWidth = stemWidth(innerW, N, 2);
      cx.beginPath();
      if (apDay) for (const [d, v] of apDay) { const hh = Math.min(1, v / apTopM) * rainInnerH; cx.fillStyle = SERIES.apport.line; cx.fillRect(dayCtr.get(d) + 0.5, base - hh, BWD, hh); }
      else for (let i = 0; i < N; i++) {
        const v = c.apports[i];
        if (v == null || v <= 0) continue;
        const xx = xOf(i) + dxM;
        if (bwRM) { const hh = Math.min(1, v / apTopM) * rainInnerH; cx.fillStyle = SERIES.apport.line; cx.fillRect(xx - dxM + 0.5, base - hh, bwRM, hh); continue; }
        cx.moveTo(xx, base);
        cx.lineTo(xx, base - Math.min(1, v / apTopM) * rainInnerH);
      }
      cx.stroke();
      // Axe droit, teinte de la serie. Unite sur chaque palier, comme l'axe des
      // debits et comme l'axe pluie en vis-a-vis.
      // Sur #axisCv : x relatif a la largeur VISIBLE, pas a celle du graphe defilant.
      ax.fillStyle = SERIES.apport.solid;
      ax.font = '8px "Segoe UI",Arial';
      ax.textAlign = 'right'; ax.textBaseline = 'top';   // colonne de gauche, sous le trait (le mm est au-dessus)
      for (let g = 0; g <= RAIN_ROWS_M; g++) {
        const y = topY + (g / RAIN_ROWS_M) * rainInnerH;
        ax.fillText(Math.round(apTopM * (1 - g / RAIN_ROWS_M)) + ' m³/s', pad.l - 6, y + 1);
      }
    }
    // ---- GRAPHIQUE DE L'APPORT (2e panneau, sous la pluie) : une bande par jour, echelle propre en m3/s a gauche ----
    if (splitM && apInnerH > 8 && apDay) {
      const aTop = rainTop + rainInnerH + SPLIT_GAP, aBase = aTop + apInnerH;
      let apMaxD = 1; for (const v of apDay.values()) apMaxD = Math.max(apMaxD, v);
      const aStRaw = apMaxD / RAIN_ROWS_M, a10 = Math.pow(10, Math.floor(Math.log10(Math.max(0.1, aStRaw))));
      let aStep = a10; for (const mult of [1, 2, 5, 10]) { aStep = mult * a10; if (aStep >= aStRaw) break; }
      const yTopA = aStep * RAIN_ROWS_M;
      cx.strokeStyle = '#e3e6ef'; cx.lineWidth = 1;
      ax.fillStyle = SERIES.apport.solid; ax.font = '8px "Segoe UI",Arial'; ax.textAlign = 'right';
      for (let g = 0; g <= RAIN_ROWS_M; g++) {
        const y = aTop + (g / RAIN_ROWS_M) * apInnerH;
        cx.beginPath(); cx.moveTo(pad.l, y); cx.lineTo(pad.l + innerW, y); cx.stroke();
        ax.textBaseline = (g === 0) ? 'top' : 'middle';
        ax.fillText(Math.round(yTopA * (1 - g / RAIN_ROWS_M)) + ' m³/s', pad.l - 6, y + (g === 0 ? 1 : 0));
      }
      drawDaySeps(aTop, aBase);
      ax.fillStyle = '#1a1a2e'; ax.font = 'bold 11px "Segoe UI",Arial';
      ax.textAlign = 'left'; ax.textBaseline = 'bottom';
      ax.fillText('Apport naturel (m³/s)', pad.l, aTop - 3);
      cx.fillStyle = SERIES.apport.line;
      for (const [d, v] of apDay) { const hh = Math.min(1, v / yTopA) * apInnerH; cx.fillRect(dayCtr.get(d) - BWD / 2, aBase - hh, BWD, hh); }
    }
    if (!varOnM) {   // avec les variations : plus de legende pour la pluie (le titre du graphique suffit)
    // Legende encadree, coin choisi dynamiquement pour ne pas couvrir les series.
    ax.font = '6px "Segoe UI",Arial';
    // Une entree par FORME (barres / courbe / stem), suffixee du cote de l'axe quand
    // les deux echelles coexistent — sinon rien ne dit laquelle lire pour quelle
    // serie. Suffixes abreges ('g.' / 'd.') : la largeur d'ecran est limitee.
    const sfxLm = apInRain ? ' (mm)' : '';
    const lgM = [];
    if (plM.hVals) {
      lgM.push({ c: SERIES.pluie.line,  t: 'Pluie tombée' + sfxLm });
      if (!varOnM) lgM.push({ c: SERIES.pluie.solid, t: 'Cumul 24 h' + sfxLm, line: true });   // pas de cumul avec les variations (comme au bureau)
    } else {
      lgM.push({ c: SERIES.pluie.line, t: 'Pluie 24 h' + sfxLm });
    }
    if (apInRain) lgM.push({ c: SERIES.apport.line, t: 'Apport naturel (m³/s)' });
    const swW2 = 18, swH2 = 6, pX = 6, pY = 5;
    let lgWm = 0;
    for (const it of lgM) lgWm = Math.max(lgWm, ax.measureText(it.t).width);
    const bw = lgWm + swW2 + 6 + 2 * pX;
    const bh = 9 * lgM.length + 2 * pY;
    const rYOf = v => base - Math.min(1, v / yTopM) * rainInnerH;
    // Les deux series sont passees a pickCorner (l'apport ramene sur l'echelle de la
    // pluie) pour que le cadre evite aussi les stems d'apport.
    const seriesM = [plM.vals];
    if (hasApportM && apTopM > 0) seriesM.push(c.apports.map(v => (v == null ? null : v / apTopM * yTopM)));
    // Legendes sur #axisCv (fixes) : coin choisi d'apres la portion visible a
    // l'ouverture, c.-a-d. le graphe cale sur la fin (xOfView).
    const coP = pickCorner({ x0: pad.l, y0: topY, w: innerWView, h: rainInnerH },
                           bw, bh, seriesM, rYOf, xOfView, null);
    ax.fillStyle = 'rgba(255,255,255,.85)';
    ax.fillRect(coP.x, coP.y, bw, bh);
    ax.strokeStyle = '#dde'; ax.lineWidth = 1;
    ax.strokeRect(coP.x, coP.y, bw, bh);
    ax.textAlign = 'left'; ax.textBaseline = 'top';
    for (let k = 0; k < lgM.length; k++) {
      const yk = coP.y + pY + k * 9;
      const itM = lgM[k];
      if (itM.line) {
        // Echantillon en TRAIT : il doit ressembler a la courbe qu'il designe.
        ax.strokeStyle = itM.c; ax.lineWidth = 1.3;
        ax.beginPath();
        ax.moveTo(coP.x + pX, yk + 1 + swH2 / 2);
        ax.lineTo(coP.x + pX + swW2, yk + 1 + swH2 / 2);
        ax.stroke();
      } else {
        ax.fillStyle = itM.c;
        ax.fillRect(coP.x + pX, yk + 1, swW2, swH2);
      }
      ax.fillStyle = '#333';
      ax.fillText(itM.t, coP.x + pX + swW2 + 6, yk);
    }
    }
  }

  // Titre du panneau des debits, symetrique de celui du panneau pluie. Seulement
  // quand le 2e panneau existe (sinon rien a distinguer).
  if (plM) {
    ax.fillStyle = '#1a1a2e'; ax.font = 'bold 11px "Segoe UI",Arial';
    ax.textAlign = 'left'; ax.textBaseline = 'top';
    ax.fillText('Débits (m³/s)', pad.l, pad.t + 1);
  }

  // Legende : coin choisi dynamiquement pour ne pas se poser sur les courbes
  // (l'ancien coin fixe haut-gauche tombait en plein dans les donnees des centrales
  // dont le debit est eleve en debut de fenetre).
  const lgSwW = 18, lgSwH = 6, lgGap = 9, lgPadX = 6, lgPadY = 5;
  ax.font = '6px "Segoe UI",Arial';
  // Ni apport ni pluie ici : les deux vivent dans le panneau du bas, qui a sa
  // propre legende. Cette legende ne decrit que les series du panneau des debits.
  const labels = [
    { c: stroke,  t: 'Débit total' },
    { c: turbCol, t: 'Turbiné' },
    { c: devCol,  t: 'Déversé' }
  ];
  // Avec les variations : « Déversé » seulement s'il y en a, + ligne ▲ ouverture / ▼ fermeture (comme au bureau)
  if (varOnM) {
    if (!(c.devs || []).some(v => v > 0.5)) labels.splice(2, 1);
    labels.push({ tri: true, t: '▲ ouverture · ▼ fermeture' });
  }
  // Pas d'entree apport ici : il est descendu dans le panneau du bas, qui a sa
  // propre legende. L'y laisser serait un doublon pointant vers un autre cadre.
  const wMax = Math.max.apply(null, labels.map(lb => ax.measureText(lb.t).width - (lb.tri ? lgSwW + 6 : 0)));
  const boxW = wMax + lgSwW + 14 + 2 * lgPadX;
