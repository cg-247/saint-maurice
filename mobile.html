  const boxH = labels.length * lgGap + 2 * lgPadY;
  const lgTop = plM ? pad.t + 16 : pad.t;   // sous le titre du panneau, s'il y en a un
  const coL = pickCorner({ x0: pad.l, y0: lgTop, w: innerWView, h: pad.t + innerH - lgTop },
                         boxW, boxH, varOnM ? [arr] : [arr, c.turbs, c.devs], yOf, xOfView, null);
  ax.fillStyle = 'rgba(255,255,255,.85)';
  ax.fillRect(coL.x, coL.y, boxW, boxH);
  ax.strokeStyle = '#dde'; ax.lineWidth = 1;
  ax.strokeRect(coL.x, coL.y, boxW, boxH);
  ax.textAlign = 'left'; ax.textBaseline = 'top';
  labels.forEach((lb, k) => {
    if (lb.tri) {
      let xx = coL.x + lgPadX; const yy = coL.y + lgPadY + k * lgGap;
      ax.fillStyle = '#d9640a'; ax.fillText('▲', xx, yy); xx += ax.measureText('▲ ').width;
      ax.fillStyle = '#333'; ax.fillText('ouverture', xx, yy); xx += ax.measureText('ouverture · ').width;
      ax.fillStyle = '#1d5e8c'; ax.fillText('▼', xx, yy); xx += ax.measureText('▼ ').width;
      ax.fillStyle = '#333'; ax.fillText('fermeture', xx, yy);
      return;
    }
    ax.fillStyle = lb.c;
    ax.fillRect(coL.x + lgPadX, coL.y + lgPadY + k * lgGap + 1, lgSwW, lgSwH);
    ax.fillStyle = '#333';
    ax.fillText(lb.t, coL.x + lgPadX + lgSwW + 6, coL.y + lgPadY + k * lgGap);
  });

  // Ouverture sur les donnees recentes : au changement de centrale ou de vue, et
  // tant que l'utilisateur etait deja en bout de course (sinon on respecte sa position).
  if (bigScrollReset || atEnd) scrollEl.scrollLeft = maxScroll;
  bigScrollReset = false;
}

// Redessine sur rotation / resize
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (D) drawBigChart(); }, 100);
}, { passive: true });

// Demarrage
init();

// --- Pull-to-refresh (pattern moderne : indicateur visuel + refetch en place) ---
// Geste : doigt qui descend depuis le haut de page (scrollY === 0).
// - Pendant le drag : indicateur apparait, rotation/etat proportionnels a la progression.
// - Au relachement au-dela du seuil : refetch JSON en bypass cache (refreshData()),
//   pas de location.reload() => pas de flash de page, pas de "2e tentative".
// - Spinner reste actif pendant le refetch ; toast d'erreur si reseau echoue.
(function setupPullToRefresh() {
  const THRESHOLD = 70;
  const MAX_PULL = 140;
  let startY = 0, startX = 0;
  let dragging = false;
  let pulled = 0;
  let refreshing = false;  // bloque les nouveaux gestes pendant un refetch en cours
  const indicator = document.getElementById('ptrIndicator');
  const toast = document.getElementById('ptrToast');

  function setPull(px) {
    pulled = px;
    const clamped = Math.min(px, MAX_PULL);
    document.body.style.transform = 'translateY(' + clamped + 'px)';
    // Indicateur : apparait progressivement, tourne avec la progression, change
    // d'etat visuel quand le seuil est franchi.
    if (indicator) {
      const ratio = Math.min(clamped / THRESHOLD, 1);
      const armed = clamped >= THRESHOLD;
      indicator.style.opacity = Math.min(clamped / 30, 1);
      indicator.style.transform = 'translateY(' + Math.min(clamped - 8, 48) + 'px) rotate(' + (ratio * 180) + 'deg)';
      indicator.classList.toggle('armed', armed);
    }
  }

  function hideIndicator() {
    if (!indicator) return;
    indicator.classList.remove('armed','spinning');
    indicator.style.opacity = '';
    indicator.style.transform = '';
  }

  function reset() {
    document.body.classList.remove('ptr-dragging');
    document.body.classList.add('ptr-releasing');
    document.body.style.transform = '';
    hideIndicator();
    setTimeout(() => {
      document.body.classList.remove('ptr-releasing');
    }, 260);
  }

  function showToast(msg, isError) {
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.toggle('err', !!isError);
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 2200);
  }

  async function triggerRefresh() {
    refreshing = true;
    // Maintient le body legerement decale pour montrer que ca tourne, et active le spin.
    document.body.classList.remove('ptr-dragging');
    document.body.classList.add('ptr-releasing');
    document.body.style.transform = 'translateY(40px)';
    if (indicator) {
      indicator.style.opacity = '1';
      indicator.style.transform = 'translateY(32px) rotate(0deg)';
      indicator.classList.add('armed','spinning');
    }
    try {
      const changed = await refreshData();
      showToast(changed ? 'Données mises à jour' : 'Déjà à jour', false);
    } catch (e) {
      showToast('Hors-ligne : données inchangées', true);
    } finally {
      refreshing = false;
      document.body.style.transform = '';
      hideIndicator();
      setTimeout(() => {
        document.body.classList.remove('ptr-releasing');
      }, 260);
    }
  }

  document.addEventListener('touchstart', e => {
    if (refreshing) { dragging = false; return; }
    // Tolerance : le bounce/overscroll natif laisse parfois scrollY a 1-2px alors
    // qu'on est visuellement en haut. Un seuil strict (> 0) faisait rater le 1er
    // geste, d'ou la sensation de devoir le faire deux fois.
    if (window.scrollY > 2) { dragging = false; return; }
    if (e.touches.length !== 1) { dragging = false; return; }
    startY = e.touches[0].clientY;
    startX = e.touches[0].clientX;
    dragging = true;
    pulled = 0;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    // Si l'utilisateur a scrolle entre-temps (plus en haut), on annule le geste.
    if (window.scrollY > 2) {
      if (pulled > 0) setPull(0);
      dragging = false;
      hideIndicator();
      return;
    }
    const dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;
    // Geste surtout horizontal (defilement du graphique, des chips) : ce n'est pas
    // un tirer-pour-actualiser. Sans ce test, le preventDefault() plus bas bloquait
    // le defilement horizontal des qu'il derivait un peu vers le bas.
    if (pulled === 0 && Math.abs(dx) > dy) {
      dragging = false;
      return;
    }
    if (dy <= 0) {
      if (pulled > 0) setPull(0);
      dragging = false;
      hideIndicator();
      return;
    }
    const resisted = Math.round(Math.sqrt(dy * 32));
    document.body.classList.add('ptr-dragging');
    setPull(resisted);
    // Quand le move est cancelable, on bloque le scroll/bounce natif pour que NOTRE
    // geste prenne immediatement. S'il ne l'est pas (le navigateur a deja decide de
    // scroller), on suit quand meme le drag visuellement plutot que d'abandonner :
    // le geste reste actif et se declenchera au touchend.
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    if (pulled >= THRESHOLD) {
      triggerRefresh();
    } else {
      reset();
    }
  }, { passive: true });

  document.addEventListener('touchcancel', () => {
    if (!dragging) return;
    dragging = false;
    reset();
  }, { passive: true });

  // --- Re-fetch auto au retour au premier plan ---
  // Comportement attendu d'une PWA : on rouvre l'app (ou on y revient apres l'avoir
  // mise en arriere-plan) et les donnees sont a jour, sans geste. Re-fetch SILENCIEUX
  // (pas de spinner, pas de toast) : refreshData() ne re-rend que si l'empreinte a
  // change. Garde-fous : pas pendant un refresh en cours, et au plus une fois / 30 s
  // (evite de spammer le reseau quand on bascule rapidement entre apps).
  //
  // Il faut PLUSIEURS declencheurs, pas seulement 'visibilitychange' : en PWA
  // installee, revenir a l'app depuis une autre application ne masque pas
  // forcement le document, donc aucun 'visibilitychange' ne partait et les
  // donnees restaient celles de l'ouverture. On ajoute 'focus' (retour du focus)
  // et 'pageshow' (restauration bfcache / reprise d'une session gelee, ou ni
  // 'load' ni 'visibilitychange' ne repassent). Le garde-fou des 30 s absorbe les
  // declenchements redondants, donc empiler les sources est sans cout reseau.
  const MIN_REFETCH_GAP = 30000; // ms
  function autoRefetch() {
    if (document.visibilityState === 'hidden') return;
    if (refreshing) return;
    if (performance.now() - lastFetchAt < MIN_REFETCH_GAP) return;
    refreshing = true;
    refreshData()
      .catch(() => { /* hors-ligne : on garde les donnees actuelles, silencieux */ })
      .finally(() => { refreshing = false; });
  }
  document.addEventListener('visibilitychange', autoRefetch);
  window.addEventListener('focus', autoRefetch);
  window.addEventListener('pageshow', autoRefetch);
})();

// Enregistrement du service worker (PWA installable). Silencieux si non supporte
// ou en file:// : ne doit jamais bloquer l'affichage.
if ('serviceWorker' in navigator) {
  // Un SW plus recent prend le controle => la page tourne encore sur l'ANCIEN code
  // applicatif. On recharge. Garde-fou : une seule fois par chargement, sinon un SW
  // qui se reinstalle en boucle bouclerait le reload.
  var swReloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swReloading) return;
    swReloading = true;
    window.location.reload();
  });
  window.addEventListener('load', function () {
    // updateViaCache:'none' => sw.js toujours revalide contre le reseau, jamais lu
    // depuis le cache HTTP du navigateur, sinon reg.update() peut relire un sw.js
    // perime et ne rien detecter alors qu'une version est publiee.
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
      if (!reg) return;
      // Sans reg.update(), la PWA installee restait des jours sur l'ancienne
      // version : le navigateur ne revalide sw.js qu'a l'enregistrement (et au plus
      // une fois par 24 h selon son heuristique), et les HTML etant servis en
      // stale-while-revalidate, la page affichee restait l'ancienne meme apres mise
      // en cache de la nouvelle. On force la verification a l'ouverture, au retour
      // au premier plan, et toutes les 30 min ; le nouveau SW active declenche
      // 'controllerchange' ci-dessus, qui recharge sur le code neuf.
      function checkForUpdate() {
        if (document.visibilityState === 'hidden') return;
        reg.update().catch(function () { /* hors-ligne : sans effet */ });
      }
      checkForUpdate();
      document.addEventListener('visibilitychange', checkForUpdate);
      window.addEventListener('focus', checkForUpdate);
      window.addEventListener('pageshow', checkForUpdate);
      setInterval(checkForUpdate, 30 * 60 * 1000);
    }).catch(function () { /* ignore */ });
  });
}
</script>
